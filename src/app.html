<style>
:root{--rouge:#B3121F;--rouge-f:#7E0C16;--rouge-c:#F7E4E5;--argent:#8B9199;--argent-c:#E6E8EB;--encre:#1E2227;--gris:#5A6068;--papier:#FAFAF8;--blanc:#fff;--vert:#2E7D4F;--vert-c:#E3F2E8;--ambre:#A86B00;--ambre-c:#FFF4DC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papier);color:var(--encre);font:15px/1.5 "Segoe UI",Calibri,Arial,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:.2em 0 .5em}
h2{font-size:1.5em;color:var(--rouge-f)}h3{font-size:1.1em;margin-top:1.2em}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:linear-gradient(90deg,var(--encre),#2C3138);color:#fff;border-bottom:4px solid var(--rouge)}
header img{height:64px}
header .t1{font-family:Georgia,serif;font-size:1.35em;letter-spacing:.02em}
header .t2{font-size:.85em;color:var(--argent-c);opacity:.85}
header .prog{margin-left:auto;text-align:right;font-size:.85em;min-width:160px}
.bar{height:8px;background:#444b54;border-radius:4px;overflow:hidden;margin-top:4px}.bar>i{display:block;height:100%;background:var(--rouge);width:0}
.wrap{display:flex;min-height:calc(100vh - 88px)}
nav{width:290px;flex-shrink:0;background:var(--blanc);border-right:1px solid var(--argent-c);padding:12px 0;overflow-y:auto}
nav .grp{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--gris);padding:12px 18px 4px;font-weight:600}
nav a{display:flex;align-items:center;gap:8px;padding:7px 18px;color:var(--encre);text-decoration:none;font-size:.92em;border-left:3px solid transparent}
nav a:hover{background:var(--argent-c)}
nav a.on{background:var(--rouge-c);border-left-color:var(--rouge);font-weight:600}
nav a.lock{color:#a8adb3;cursor:not-allowed}
nav .st{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:inline-grid;place-items:center;font-size:11px;border:1.5px solid var(--argent)}
nav .st.ok{background:var(--vert);border-color:var(--vert);color:#fff}
nav .st.en{border-color:var(--rouge);color:var(--rouge)}
nav .reu{font-style:italic}
main{flex:1;padding:22px 34px 60px;max-width:1100px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--argent-c);margin:14px 0 18px;flex-wrap:wrap}
.tabs button{background:none;border:none;padding:9px 16px;font:inherit;cursor:pointer;color:var(--gris);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--rouge-f);border-bottom-color:var(--rouge);font-weight:600}
.vid{background:var(--blanc);border:1px solid var(--argent-c);border-left:4px solid var(--encre);border-radius:0 8px 8px 0;padding:12px 16px;margin:12px 0}
.vid h3{margin:0 0 8px;font-size:1em}.vid .d{font-weight:400;color:var(--gris);font-size:.85em}
.vid video{width:100%;max-width:720px;aspect-ratio:16/9;background:#000;border-radius:6px;display:block}
.vid .ko{display:none;color:var(--ambre);font-size:.88em;margin-top:6px}.vid.err .ko{display:block}.vid.err video{display:none}
.vid+.vid{margin-top:8px}
@media print{.vid{display:none}}
.card{background:var(--blanc);border:1px solid var(--argent-c);border-radius:8px;padding:16px 20px;margin:12px 0}
.q{font-weight:700;color:var(--rouge-f)}
.ref{font-size:.8em;color:var(--gris);font-style:italic}
.but{border-left:4px solid var(--rouge);background:var(--rouge-c);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0}
.vig{border-left:4px solid var(--ambre);background:var(--ambre-c);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0}
.vig b{color:var(--ambre)}
ul.c{padding-left:20px;margin:.3em 0}ul.c li{margin:.2em 0}
table{border-collapse:collapse;width:100%;margin:6px 0}
th,td{border:1px solid var(--argent-c);padding:6px 8px;vertical-align:top;text-align:left;font-size:.92em}
th{background:var(--encre);color:#fff;font-weight:600}
td input,td select,td textarea{width:100%;border:1px solid transparent;background:transparent;font:inherit;padding:3px}
td input:focus,td select:focus,td textarea:focus{border-color:var(--argent);background:#fff;outline:none}
.fld{margin:10px 0}.fld label{display:block;font-weight:600;font-size:.92em;margin-bottom:3px}
.fld .h{font-size:.82em;color:var(--gris);margin-bottom:3px}
.fld input,.fld textarea,.fld select{width:100%;padding:7px 9px;border:1px solid var(--argent);border-radius:5px;font:inherit;background:#fff}
textarea{resize:vertical;min-height:60px}
.btn{background:var(--rouge);color:#fff;border:none;padding:8px 14px;border-radius:5px;font:inherit;cursor:pointer;font-size:.9em}
.btn:hover{background:var(--rouge-f)}.btn.s{background:var(--argent-c);color:var(--encre)}.btn.s:hover{background:#d3d6da}
.btn.x{background:none;color:var(--gris);padding:2px 6px}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
/* frise MEDOT */
.cycle{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.ph{background:#fff;border:1px solid var(--argent-c);border-radius:8px;overflow:hidden}
.ph h4{margin:0;padding:8px 12px;background:var(--encre);color:#fff;font-family:Georgia,serif;font-size:.95em}
.ph .s{display:block;padding:6px 12px;border-top:1px solid var(--argent-c);font-size:.88em;cursor:pointer;color:var(--encre);text-decoration:none}
.ph .s:hover{background:var(--rouge-c)}
.ph .r{background:var(--rouge);color:#fff;font-weight:600}.ph .r:hover{background:var(--rouge-f)}
.ph .lk{color:#a8adb3;cursor:default}.ph .lk:hover{background:none}
/* quiz */
.qz{margin:14px 0}.qz .qq{font-weight:600;margin-bottom:6px}
.qz .o{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--argent);border-radius:5px;padding:7px 10px;margin:4px 0;font:inherit;cursor:pointer}
.qz .o:hover:not(:disabled){background:var(--argent-c)}
.qz .o.good{background:var(--vert-c);border-color:var(--vert)}.qz .o.bad{background:var(--rouge-c);border-color:var(--rouge)}
.qz .o:disabled{cursor:default;color:var(--encre);opacity:1}
.qz .ex{font-size:.9em;padding:8px 10px;background:var(--argent-c);border-radius:5px;margin-top:4px}
.score{font-size:1.1em;font-weight:700;padding:12px;border-radius:6px;text-align:center}
.score.ok{background:var(--vert-c);color:var(--vert)}.score.ko{background:var(--ambre-c);color:var(--ambre)}
/* flashcards */
.fc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fcd{background:#fff;border:1px solid var(--argent-c);border-top:3px solid var(--rouge);border-radius:6px;padding:12px;min-height:110px;cursor:pointer;font-size:.9em}
.fcd .tt{font-family:Georgia,serif;font-weight:700;font-size:1.05em;color:var(--rouge-f)}
.fcd .df{display:none;margin-top:6px}.fcd.flip .df{display:block}.fcd.flip .hint{display:none}
.hint{color:var(--gris);font-size:.8em;margin-top:8px}
.chk label{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.chk input{margin-top:4px}
.tag{display:inline-block;font-size:.75em;padding:1px 7px;border-radius:10px;background:var(--argent-c);color:var(--gris);margin-left:6px}
.ok-msg{color:var(--vert);font-size:.85em}.warn{color:var(--ambre);font-size:.85em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9}
.modal.on{display:flex}.modal .card{max-width:760px;width:92%;max-height:85vh;overflow:auto}
footer{font-size:.78em;color:var(--gris);padding:10px 34px;border-top:1px solid var(--argent-c);background:#fff}
.next{margin-top:24px;display:flex;justify-content:space-between}
@media(max-width:820px){.wrap{flex-direction:column}nav{width:100%;max-height:none;border-right:none;border-bottom:1px solid var(--argent-c)}main{padding:16px}.cycle{grid-template-columns:1fr}header img{height:44px}header .prog{display:none}}

.menu{display:none;background:none;border:1px solid #6b7280;color:#fff;font-size:1.4em;border-radius:6px;padding:4px 12px;margin-left:auto;cursor:pointer}
.demo-sw{display:block;margin-top:8px;cursor:pointer;color:#fff}
.demo-banner{background:var(--ambre-c);border-bottom:2px solid var(--ambre);padding:10px 20px;font-size:.9em}
.demo-banner .btn{margin-left:8px}
.cycle-svg svg{width:100%;height:auto;display:block}
.cycle-svg .cl{font:600 13px Georgia,serif;fill:#7E0C16}
.cycle-svg .nt{font:600 12px "Segoe UI",Arial,sans-serif}
.cycle-svg .nq{font:italic 11.5px "Segoe UI",Arial,sans-serif;fill:#5A6068}
.cycle-svg .nd{cursor:pointer}
.cycle-svg .nd.soon{opacity:.45;cursor:default}
.cycle-svg .nd:focus{outline:none}
.scores .sc{display:grid;grid-template-columns:minmax(120px,240px) 1fr 52px;gap:10px;align-items:center;padding:4px 0}
.scores a{color:var(--encre);font-size:.9em}
.sb{position:relative;height:14px;background:var(--argent-c);border-radius:7px}
.sb i{display:block;height:100%;border-radius:7px;background:var(--ambre)}.sb i.ok{background:var(--vert)}
.sb .th{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--encre)}
.hbars .hb{display:grid;grid-template-columns:190px 1fr 36px;gap:10px;align-items:center;padding:3px 0;font-size:.9em}
.hbars .hb div{background:var(--argent-c);height:16px;border-radius:4px}.hbars i{display:block;height:100%;border-radius:4px;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82em;margin-bottom:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
ol.tl{list-style:none;padding:0 0 0 18px;margin:8px 0;border-left:3px solid var(--argent-c)}
ol.tl li{position:relative;padding:6px 0 6px 14px;display:flex;gap:14px;flex-wrap:wrap}
ol.tl li::before{content:"";position:absolute;left:-27px;top:11px;width:14px;height:14px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 1px var(--c)}
ol.tl .g{font-weight:700;min-width:110px;color:var(--rouge-f);font-variant-numeric:tabular-nums}
ol.tl .e{flex:1;min-width:180px}
.sync{display:grid;gap:4px;overflow-x:auto;font-size:.86em}
.sync .lb{font-weight:700;align-self:center;font-size:.85em;color:var(--gris)}
.sync .lb.ami{color:#1F5F99}.sync .lb.eni{color:var(--rouge-f)}
.sync .tm{font-weight:700;text-align:center;background:var(--encre);color:#fff;border-radius:4px;padding:4px}
.sync .blk{border-radius:5px;padding:6px 8px}
.sync .blk.ami{background:#E3EDF7;border-left:4px solid #1F5F99}
.sync .blk.eni{background:var(--rouge-c);border-left:4px solid var(--rouge)}
.sync .mid{text-align:center;padding:4px;border-radius:5px;background:#fff;border:1px dashed var(--argent)}
.sync .mid.op{border:1.5px solid var(--vert);background:var(--vert-c)}.sync .mid.op b{color:var(--vert)}
.sync .mid.ri{border:1.5px solid var(--ambre);background:var(--ambre-c)}.sync .mid.ri b{color:var(--ambre)}
.sync .rf{font-size:.85em;color:var(--gris)}
details summary{cursor:pointer;color:var(--rouge-f);margin-top:10px}
.cycle{display:none}
@media(max-width:820px){
 .menu{display:block}
 .cycle-svg{display:none}.cycle{display:grid}
 nav{display:none;position:sticky;top:0;z-index:5;max-height:75vh;box-shadow:0 6px 16px rgba(0,0,0,.15)}
 nav.open{display:block}
 nav a{padding:12px 18px;min-height:44px}
 header{flex-wrap:wrap}
 .demo-sw{display:inline-block;margin:0 0 0 10px}
 .scores .sc{grid-template-columns:1fr 60px;}.scores .sb{grid-column:1/-1;grid-row:2}
 .hbars .hb{grid-template-columns:130px 1fr 30px}
 main table{display:block;overflow-x:auto}
 .tabs button{flex:1;padding:12px 6px}
 .qz .o{padding:11px 12px}
}

/* ---- accessibilité / forme (audit) ---- */
:root{--ambre:#8A5700;--vert:#256B42;--verrou:#6B7179}
h1.t1{margin:0;font-weight:normal;font-size:1.35em}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:20;background:#fff;padding:8px;color:var(--encre)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card>h3:first-child{margin-top:0}
:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
header :focus-visible{outline-color:#fff}.btn:focus-visible{outline-color:var(--encre)}
main:focus{outline:none}
nav a.lock,.ph .lk{color:var(--verrou)}nav .st{border-color:var(--gris)}
td input,td select,td textarea{border:1px solid var(--argent);background:#fff;border-radius:4px;padding:5px 6px;min-height:36px}
td input:focus,td select:focus,td textarea:focus{border-color:var(--rouge);outline:2px solid var(--rouge);outline-offset:1px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.ph .s{width:100%;text-align:left;border:none;border-top:1px solid var(--argent-c);background:none;font:inherit}
.ph .s.r{background:var(--rouge);color:#fff}.ph .s.r:hover{background:var(--rouge-f)}.ph .s.r.lk{background:var(--argent-c);color:var(--verrou)}
.fcd{text-align:left;font:inherit;color:inherit;width:100%;display:block}.fcd .tt,.fcd .hint{display:block}
.btn.dk{background:var(--encre);color:#fff}.btn.dk:hover{background:#000}
nav .grp{font-size:.8em}.tag{font-size:.8em}.hint{font-size:.85em}footer{font-size:.85em}.ref{font-size:.85em}
header{box-shadow:0 2px 0 var(--argent)}
.ph h4{background:linear-gradient(90deg,var(--rouge-f),var(--rouge))}
@media(min-width:821px){nav{position:sticky;top:0;align-self:flex-start;max-height:100vh}}
@media(hover:none){nav a:hover,.ph .s:hover,.qz .o:hover:not(:disabled),.btn.s:hover{background:inherit}}
@media(pointer:coarse){nav a,.ph .s,.btn,.qz .o,.tabs button{min-height:44px}.btn.x{min-width:44px;min-height:44px;font-size:1.1em}input[type=checkbox]{width:22px;height:22px}.chk label{padding:8px 0;min-height:44px;align-items:center}td select,td input{min-height:44px}}
@media(max-width:820px){
 nav{display:block!important;position:fixed;top:0;left:0;bottom:0;width:min(86vw,320px);max-height:none;z-index:8;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 16px #0003}

 body.navopen::after{content:"";position:fixed;inset:0;background:#0006;z-index:7}
 header .prog{display:block!important;min-width:0;font-size:.75em;margin-left:0;order:3;width:100%;text-align:left}

}
@media(max-width:600px){
 .tw thead{display:none}
 .tw tr{display:block;border:1px solid var(--argent-c);border-radius:6px;margin:8px 0;padding:6px;background:#fff}
 .tw td{display:block;border:none;padding:4px 2px}
 .tw td[data-l]::before{content:attr(data-l);display:block;font-size:.8em;font-weight:600;color:var(--gris)}
 .next{flex-direction:column}.next .btn{width:100%}

}
@media(max-width:820px){header{padding:8px 12px;gap:10px}header img{height:40px}h1.t1{font-size:1.05em}
 header .prog{display:flex!important;align-items:center;gap:10px;flex-wrap:wrap}header .prog .bar{flex:1;min-width:120px;margin:0}.demo-sw{margin:0!important}
 .demo-banner{padding:8px 12px}}
.demo-banner details{display:inline}.demo-banner summary{cursor:pointer;display:inline}
.sync-m{display:none}
@media(max-width:600px){.sync{display:none}.sync-m{display:block}.sync-m .sm{display:grid;gap:4px;margin-bottom:12px;font-size:.9em}.sync-m small{display:block;font-weight:700;font-size:.75em;text-transform:uppercase;color:var(--gris)}.sync-m .tm{font-weight:700;background:var(--encre);color:#fff;border-radius:4px;padding:4px 8px}.sync-m .blk{border-radius:5px;padding:6px 8px}.sync-m .blk.ami{background:#E3EDF7;border-left:4px solid #1F5F99}.sync-m .blk.eni{background:var(--rouge-c);border-left:4px solid var(--rouge)}.sync-m .mid{padding:6px;border-radius:5px;border:1px dashed var(--argent)}.sync-m .mid.op{border:1.5px solid var(--vert);background:var(--vert-c)}.sync-m .mid.ri{border:1.5px solid var(--ambre);background:var(--ambre-c)}}

/* ---- livraison 2 : phase 2, cas, examen, fiche, recherche ---- */
.gantt{font-size:.86em}
.gantt .gr{display:grid;grid-template-columns:minmax(110px,34%) minmax(0,1fr);gap:4px 10px;align-items:center;padding:5px 0;border-top:1px solid var(--argent-c)}
.gantt .gr.ax{border-top:none;padding:0}
.gantt .lbl{line-height:1.3;min-width:0;overflow-wrap:anywhere}.gantt .lbl small{display:block;color:var(--gris)}
.gantt .trk{position:relative;height:24px;margin-right:10px;background:#F3F4F6;border-radius:4px}
.gantt .trk .tk{position:absolute;top:0;bottom:0;width:1px;background:#D5D8DC}
.gantt .trk .bar{position:absolute;top:4px;height:16px;border-radius:4px;min-width:6px;box-shadow:inset 0 0 0 1px #0002}
.gantt .trk .pd{position:absolute;top:-1px;font-size:19px;line-height:1;color:#E0A800;transform:translateX(-50%);text-shadow:0 0 1px #000,0 0 2px #000}
.gantt .trk .na{position:absolute;left:8px;top:3px;font-size:.85em;color:var(--gris);font-style:italic}
.gantt .ticks{position:relative;height:18px;margin-right:10px;font-size:.8em;color:var(--gris);font-variant-numeric:tabular-nums}
.gantt .ticks span{position:absolute;white-space:nowrap;transform:translateX(-50%)}
.gantt .ticks span.f{transform:none}.gantt .ticks span.l{transform:translateX(-100%)}
.pdk{color:#B07F00;font-weight:700}
@media(max-width:600px){.gantt .gr{grid-template-columns:minmax(0,1fr)}.gantt .gr.ax .lbl{display:none}}
.cmpg{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px;gap:4px 6px;align-items:center;font-size:.9em}
.cmpg .hd{font-weight:700;text-align:center;font-size:.85em;color:var(--gris)}.cmpg .hd:first-child{text-align:left}
.cmpg .v{text-align:center;border-radius:4px;padding:4px 2px;font-weight:700}
.v.p{background:var(--vert-c);color:var(--vert)}.v.z{background:var(--argent-c);color:var(--gris)}.v.m{background:var(--rouge-c);color:var(--rouge-f)}
.tot{display:grid;grid-template-columns:44px minmax(0,1fr) 48px;gap:8px;align-items:center;margin:6px 0}

.tot .trk i{position:absolute;top:0;bottom:0;border-radius:4px}
.mame{display:grid;gap:6px;font-size:.9em}
.mame .hd{font-weight:700;text-align:center;align-self:end;color:var(--gris)}
.mame .rh{font-weight:700;align-self:center}
.mame .mc{border-radius:6px;padding:8px;min-height:64px;border:1.5px solid var(--argent);background:#F3F4F6;min-width:0;overflow-wrap:anywhere}
.mame .mc.g{background:var(--vert-c);border-color:var(--vert)}.mame .mc.a{background:var(--ambre-c);border-color:var(--ambre)}.mame .mc.r{background:var(--rouge-c);border-color:var(--rouge)}
.mame .mc small{display:block;color:var(--gris)}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid #0003}
.cor{border:2px solid var(--vert);border-radius:8px;padding:12px 16px;margin:14px 0;background:#F6FAF7}
.cor h3{color:var(--vert);margin-top:0}.cor h4{margin:14px 0 4px;font-size:1em}
.cor .com{border-left:4px solid var(--vert);background:#fff;padding:8px 12px;margin:8px 0}
.cor table{background:#fff}.cor p{margin:.4em 0}

  <nav id="nav" aria-label="Étapes du parcours"><div class="nav-x"><button type="button" id="navX" class="btn s" onclick="toggleNav(false);document.getElementById('menuBtn').focus()">Fermer le menu ✕</button></div><div class="srch" role="search"><label for="srchIn" class="grp" style="display:block;padding:8px 0 4px">Rechercher</label><input id="srchIn" type="search" placeholder="Sigle, définition, étape…" autocomplete="off" aria-controls="sres" oninput="doSearch(this.value)"><div id="sres" aria-live="polite"></div></div><div id="navList"></div></nav>

 <div class="mtop"><button class="btn x" aria-label="Fermer" onclick="closeModal()">✕</button></div>
 <div id="modalBody"></div><div class="rowb"><button class="btn s" onclick="closeModal()">Fermer</button></div></div></div>
<button id="toTop" class="btn dk" hidden aria-label="Revenir en haut de la page" onclick="scrollTo(0,0);const h=document.querySelector('#main h2');h&&(h.tabIndex=-1,h.focus({preventScroll:true}))">↑</button>

<script>/*__i18n.js__*/</script>
<script>
/*__demo.js__*/
/*__app28.js__*/

/* ============ ÉTAT ============ */
if(typeof DEMO_P2!=="undefined"){Object.assign(DEMO.v,DEMO_P2.v||{});Object.assign(DEMO.tab,DEMO_P2.tab||{});DEMO.tcidr.push(...(DEMO_P2.tcidr||[]));DEMO.frise.push(...(DEMO_P2.frise||[]));}
const KEY="app28-esorsem-v1";
let S={quiz:{},v:{},tab:{},tcidr:[],frise:[],unlock:false};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
let DEMO_ON=false,USER=null;
function save(){if(DEMO_ON)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const steps=M.filter(m=>m.quiz);
const PASS=0.7;
function done(id){const q=S.quiz[id];return q&&q.best>=PASS;}
function unlocked(m){return !!m&&!m.soon;}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ============ NAVIGATION ============ */
let cur="accueil",curTab="c";
function renderNav(){let h="",g="";
 M.forEach(m=>{if(m.grp!==g){g=m.grp;h+=`<div class="grp">${esc(g)}</div>`;}
  const lk=!unlocked(m),st=m.quiz?(done(m.id)?'<span class="st ok">✓</span>':(S.quiz[m.id]?'<span class="st en">•</span>':'<span class="st"></span>')):(m.soon?'<span class="st">🔒</span>':'<span class="st">›</span>');
  h+=`<a href="#${m.id}" ${m.id===cur?'aria-current="page"':""} ${lk?'aria-disabled="true"':""} class="${m.id===cur?"on":""} ${lk?"lock":""} ${m.reu?"reu":""}" data-id="${m.id}">${st}<span>${esc(m.title)}${m.soon?' <span class="tag">à venir</span>':""}</span><span class="sr">${m.quiz&&done(m.id)?" – validée":""}</span></a>`;});
 document.getElementById("navList").innerHTML=h;
 const n=steps.filter(s=>done(s.id)).length;
 document.getElementById("progTxt").textContent=`${n} / ${steps.length} étapes validées`;
 document.getElementById("progBar").style.width=(100*n/steps.length)+"%";const pr=document.getElementById("progRole");pr.setAttribute("aria-valuenow",n);pr.setAttribute("aria-valuemax",steps.length);
 if(matchMedia("(min-width:821px)").matches){const nv=document.getElementById("nav"),a=nv.querySelector("#navList a.on");
  if(a&&(a.offsetTop<nv.scrollTop||a.offsetTop+a.offsetHeight>nv.scrollTop+nv.clientHeight))nv.scrollTop=a.offsetTop-nv.clientHeight/3;}}
document.getElementById("nav").addEventListener("click",e=>{const a=e.target.closest("a[data-id]");if(!a)return;e.preventDefault();const m=M.find(x=>x.id===a.dataset.id);if(!unlocked(m)){flash(m);return;}FOCUS_NEXT="#main h2";go(m.id);
 const hl=el=>{if(!el)return;el.classList.add("hl");el.scrollIntoView({block:"center"});setTimeout(()=>el.classList.remove("hl"),2500);};
 if(a.dataset.card!=null){const c=document.querySelectorAll(".fcd")[+a.dataset.card];if(c){c.classList.add("flip");c.setAttribute("aria-expanded","true");hl(c);c.focus();}}
 if(a.dataset.lex!=null)hl(document.getElementById("lex_"+a.dataset.lex));
 if(a.dataset.norme!=null){const d=document.getElementById("norme_"+a.dataset.norme);if(d){d.open=true;hl(d);}}});
function flash(m){openModal(m&&m.soon?`<h3>${esc(m.title)}</h3><p>Ce module arrive dans une prochaine livraison.</p>`:`<h3>Module indisponible</h3><p>Ce module n’est pas encore disponible dans cette version.</p>`);}
function go(id,tab){toggleNav(false);cur=id;curTab=tab||"c";try{history.replaceState(null,"","#"+id);}catch(e){}render();window.scrollTo(0,0);}

/* ============ RENDU ============ */
function render(){renderNav();const m=M.find(x=>x.id===cur)||M[0];const el=document.getElementById("main");
 if(m.kind==="home")return el.innerHTML=home();
 if(m.kind==="recap")return el.innerHTML=recap();
 if(m.kind==="exam")return el.innerHTML=exam();
 if(m.kind==="lex")return el.innerHTML=`<h2>Sigles</h2><p class="ref">Astuce : le champ « Rechercher » du menu cherche aussi dans les définitions et les titres d’étapes.</p><div class="tw"><table><thead><tr><th>Sigle</th><th>Signification</th></tr></thead><tbody>${LEX.map((l,i)=>`<tr id="lex_${i}"><td data-l="Sigle"><b>${l[0]}</b></td><td data-l="Signification">${esc(l[1])}</td></tr>`).join("")}</tbody></table></div>`;
 let h=`<div class="ref">${esc(m.grp)}${m.ref?" · "+esc(m.ref):""}</div><h2>${esc(m.title)}${m.qtag?` <span class="tag">${esc(m.qtag)}</span>`:""}</h2>`;
 h+=`<div class="tabs" role="group" aria-label="Temps de l’étape">${[["c","1 · Comprendre"],["e","2 · S’entraîner"],["a","3 · Appliquer"]].map(t=>`<button type="button" ${curTab===t[0]?'aria-current="step"':""} class="${curTab===t[0]?"on":""}" onclick="go('${m.id}','${t[0]}')">${t[1]}</button>`).join("")}</div>`;
 if(curTab==="c")h+=comprendre(m);else if(curTab==="e")h+=quiz(m);else h+=appliquer(m);
 const i=M.indexOf(m),nx=M.slice(i+1).find(x=>!x.soon&&!x.kind);
 h+=`<div class="next"><span></span>${curTab!=="a"?`<button class="btn dk" onclick="go('${m.id}','${curTab==="c"?"e":"a"}')">Onglet suivant →</button>`:(nx?`<button class="btn" onclick="tryGo('${nx.id}')">Étape suivante : ${esc(nx.title)} →</button>`:"")}</div>`;
 el.innerHTML=h;}
function tryGo(id){const m=M.find(x=>x.id===id);if(unlocked(m)){FOCUS_NEXT="#main h2";go(id);}else flash(m);}

function home(){const box=(t,items)=>`<div class="ph"><h4>${t}</h4>${items.map(([id,l,r])=>{const m=M.find(x=>x.id===id);const lk=!unlocked(m),dn=m&&m.quiz&&done(id);return `<button type="button" class="s ${r?"r":""} ${lk?"lk":""}" onclick="tryGo('${id}')" ${lk?'aria-disabled="true"':""}>${esc(l)}${dn?' <span aria-hidden="true">✓</span><span class="sr"> (validée)</span>':""}${lk?' <span class="sr">(à venir)</span>':""}</button>`;}).join("")}</div>`;
 return `<h2>Apprendre la planification tactique OTAN (APP-28), étape par étape</h2>
 <div class="card"><p>L’<b>APP-28</b> (<i>Tactical Planning for Land Forces</i>, édition A version 1 de 2019) décrit la méthode OTAN de planification tactique des forces terrestres. Elle conduit un état-major de la mission reçue aux ordres en <b>3 phases et 7 étapes</b> : comprendre la situation et le problème, concevoir et développer les modes d’action (COA), communiquer.</p>
 <p><b>Par où commencer ?</b> Si tu découvres la méthode, commence par le <b>Vocabulaire</b> et les <b>Fondements</b>, puis suis les étapes dans l’ordre du cycle ci-dessous. La navigation reste libre.</p>
 <p>Chaque étape se travaille en trois temps, dans cet ordre conseillé :</p>
 <ul class="c"><li><b>1 · Comprendre</b> : la synthèse, avec les références des paragraphes d’APP-28 et une <b>fiche réflexe</b> à imprimer ou à copier.</li>
 <li><b>2 · S’entraîner</b> : un test corrigé ; l’étape est validée à partir de ${PASS*100} %.</li>
 <li><b>3 · Appliquer</b> : les gabarits de l’étape, à remplir sur un cas. Pour voir un exemple sur le thème VIENNE (33(AZ)BB, propositions à valider), active <b>« Exemple VIENNE »</b> en haut de l’écran : tes saisies ne sont pas touchées.</li></ul>
 <p><b>Outils</b> : un examen blanc (30 questions en 30 minutes), une recherche dans les sigles et les définitions, et la vue consolidée des conclusions et de la frise. Tes saisies restent dans ce navigateur : <b>sauvegarde-les</b> (bas de page) avant de changer de poste.</p>
 <p class="warn"><b>Source à revérifier.</b> Ce contenu a été rédigé à partir d’une copie non officielle d’APP-28 (édition A version 1, 21 novembre 2019). Il doit être vérifié sur l’exemplaire officiel. Les équivalents français des termes OTAN sont des propositions de l’outil, pas une traduction officielle.</p>
 <p class="ref">Outil pédagogique : il ne remplace pas APP-28 ni les publications OTAN qu’elle cite (ATP-3.2.2, AJP-5, AAP-06…).</p></div>${vids("accueil")}
 <h3>Le cycle APP-28 : 3 phases, 7 étapes</h3>
 <div class="cycle-svg">${cycleSvg()}</div>
 <div class="cycle">
 ${box("Démarrer",[["vocab","Vocabulaire (pour commencer)"],["fond","Fondements (chapitre 1)"]])}
 ${box("Phase 1 – Comprendre la situation et le problème",[["s1","1. Réception de la mission"],["s2a","2A. Analyse de l’ordre"],["s2b","2B. Évaluation des facteurs"]])}
 ${box("Phase 2 – Concevoir et développer les COA",[["s3","3. Développement des COA"],["s4","4. Analyse des COA (wargaming)"],["s5","5. Comparaison des COA"]])}
 ${box("Phase 3 – Communiquer",[["s6","6. Décision du chef"],["s7","7. Ordres, diffusion et transition"],["tc","Planifier en temps contraint"]])}
 </div>
 <div class="card"><h3>Ma progression</h3>${CHARTS.scores()}<div class="rowb"><button class="btn dk" onclick="go('exam')">Passer l’examen blanc</button>${exBestTxt()?`<span class="ref" style="align-self:center">${exBestTxt()}</span>`:""}</div></div>
 <div class="card"><h3>Cas concret (instructeur)</h3><p>${CAS?`Cas chargé : <b>${esc(CAS.titre)}</b> – corrigé disponible pour ${Object.keys(CAS.corrige).filter(k=>M.some(m=>m.id===k)).length} étape(s).`:"L’instructeur charge un fichier de cas (.json) contenant la situation et le corrigé de chaque étape : le corrigé s’affiche alors dans l’onglet « Appliquer » de chaque étape. Il reste dans ce navigateur jusqu’à son retrait."}</p>
 <p class="ref">Pour créer un cas : remplis les gabarits avec ta solution (ou active l’exemple VIENNE), puis « Créer un cas à partir de mes saisies ». Complète ensuite la situation et les commentaires (« texte ») dans le fichier.</p>
 <div class="rowb"><button class="btn" onclick="document.getElementById('fCas').click()">Charger un cas (instructeur)</button><input type="file" id="fCas" accept=".json,application/json" hidden onchange="importCas(this)"><button class="btn s" onclick="exportCasForm()">Créer un cas à partir de mes saisies</button>${CAS?`<button class="btn s" onclick="showSitu()">Lire la situation</button><button class="btn s" onclick="removeCas()">Retirer le cas</button>`:""}</div><div id="casMsg" role="status"></div></div>
 <div class="card"><h3>Sauvegarde</h3><p>Tes saisies restent dans ce navigateur. Pour changer de poste ou les rendre à l’instructeur :</p>
 <div class="rowb"><button class="btn" onclick="exportDoc()">Exporter mes travaux (Word)</button><button class="btn s" onclick="copyAll()">Copier mes travaux</button><button class="btn s" onclick="exportJson()">Sauvegarder (fichier .json)</button><button class="btn s" onclick="document.getElementById('fImp').click()">Reprendre une sauvegarde</button><input type="file" id="fImp" accept=".json" hidden onchange="importJson(this)"><button class="btn danger" onclick="resetAll()">Tout effacer</button></div><div id="ioMsg" role="status"></div></div>`;}

/* Vidéos de cours : fichiers dans le dossier videos/ placé à côté de index.html */
const VID={};
function vids(id){const v=VID[id];if(!v)return "";return v.map(([f,t,d])=>`<div class="vid"><h3>▶ Vidéo de cours : ${esc(t)} <span class="d">(${d})</span></h3><video controls preload="none" playsinline src="videos/${f}.mp4" onerror="this.parentNode.classList.add('err')"></video><div class="ko">Vidéo indisponible. Sur le site ou l’appli installée, il faut une connexion ; sur un poste hors ligne (Intradef), copie le dossier <b>videos</b> à côté de <b>index.html</b>.</div></div>`).join("");}
function comprendre(m){let h=vids(m.id);
 if(m.but)h+=`<div class="rowb" style="justify-content:flex-end"><button class="btn s" onclick="fiche('${m.id}')">Fiche réflexe</button></div>`;
 if(m.intro)h+=`<p>${esc(m.intro)}</p>`;
 if(m.but)h+=`<div class="but"><b>But :</b> ${esc(m.but)}</div>`;

 let h=`<p>Réponds à chaque question : la correction s’affiche aussitôt.${S.quiz[m.id]?` Meilleur score : <b>${Math.round(S.quiz[m.id].best*100)} %</b>.`:""}</p>`;
 z.order.forEach((qi,n)=>{const q=m.quiz[qi];if(!z.opt[qi])z.opt[qi]=shuffle(q.o.map((_,i)=>i));const a=z.ans[qi];
  h+=`<div class="qz card"><div class="qq">${n+1}. ${esc(q.q)}</div>${z.opt[qi].map(oi=>{let c="";if(a!=null){if(oi===q.a)c="good";else if(oi===a)c="bad";}return `<button class="o ${c}" ${a!=null?"disabled":""} onclick="answer('${m.id}',${qi},${oi})">${esc(q.o[oi])}</button>`;}).join("")}${a!=null?`<div class="ex" id="qex_${qi}" role="status"><b>${a===q.a?"✔ Exact.":"✘ Inexact."}</b> ${esc(q.e)}</div>`:""}</div>`;});
 const nb=Object.keys(z.ans).length;
 if(nb===m.quiz.length){const ok=m.quiz.filter((q,i)=>z.ans[i]===q.a).length,r=ok/m.quiz.length;
  h+=`<div class="score ${r>=PASS?"ok":"ko"}" role="status">${ok} / ${m.quiz.length} – ${r>=PASS?"Étape validée ✓":"Relis la synthèse et recommence"}</div><div class="rowb"><button class="btn s" onclick="QZ['${m.id}']=null;render()">Recommencer</button></div>`;}

 if(Object.keys(z.ans).length===m.quiz.length){const r=m.quiz.filter((q,i)=>z.ans[i]===q.a).length/m.quiz.length;const p=S.quiz[id]||{best:0};p.best=Math.max(p.best,r);p.last=r;S.quiz[id]=p;save();}

/* ============ GRAPHIQUES ============ */
function gdhKey(g){g=String(g||"").trim();const m=g.match(/^J\s*([+\-−]\s*\d+)?\s*(\d{1,2})\s*[h:]\s*(\d{2})?/i);
 if(m){const d=m[1]?parseInt(m[1].replace(/[\s−]/g,c=>c==="−"?"-":"")):0;return d*1440+parseInt(m[2])*60+(parseInt(m[3])||0);}
 const x=Date.parse(g);return isNaN(x)?null:x/6e4;}
function gdhCmp(a,b){const ka=gdhKey(a),kb=gdhKey(b);if(ka!=null&&kb!=null)return ka-kb;if(ka!=null)return -1;if(kb!=null)return 1;return String(a||"").localeCompare(String(b||""));}
const SRC_COL={prealable:"#5A6068",p1e1:"#B3121F",p1e2:"#2E7D4F",p1e3:"#7E0C16",p1e4:"#1F5F99",p1e5:"#A86B00",p2e1:"#6A3D9A",p2e2:"#0F7C80",p2e3:"#8B5A2B",p2e4:"#3B4A8C",p2e5:"#C2410C",p2e6:"#4D7C0F",dec:"#1E2227",pm:"#9D174D"};

const CHARTS={
 dm(){const C=dmCrit(),v=S.v.dm||{};const T=COAS.map((c,j)=>{let u=0,w=0,n=0;C.forEach((r,i)=>{const x=parseInt(v[i+"_"+j]);if(x){u+=x;w+=x*(parseInt(r.w)||1);n++;}});return {c,u,w,n};}).filter(t=>t.n);
  if(!T.length)return `<p class="ref">Saisis les rangs pour voir les totaux.</p>`;const mw=Math.min(...T.map(t=>t.w)),mu=Math.min(...T.map(t=>t.u));
  return `<div class="tw"><table><thead><tr><th>COA</th><th>Total non pondéré</th><th>Total pondéré</th></tr></thead><tbody>${T.map(t=>`<tr><th scope="row">${t.c}${t.n<C.length?` <span class="ref">(${t.n}/${C.length} critères)</span>`:""}</th><td>${t.u}${t.u===mu?" ◀":""}</td><td><b>${t.w}</b>${t.w===mw?" ◀":""}</td></tr>`).join("")}</tbody></table></div><p class="ref">◀ = total le plus bas, donc COA préféré par la matrice. La matrice n’est qu’une base partielle de décision : compare aussi critère par critère (§ 3.3.3).</p>`;},

 tcidr(){const n=TCIDR_TYPES.map(t=>S.tcidr.filter(r=>r.y===t).length),mx=Math.max(1,...n),col=["#B3121F","#5A6068","#A86B00","#1F5F99","#2E7D4F"];

 /* Comparaison pondérée */

const EX_KEY="app28-esorsem-exam-v1",EX_N=30,EX_T=30*60;let EX=null,EXB=null,EXtimer=null;

/* Périmètres de l'examen : [groupe (regex sur m.grp), nombre de questions] */
const EX_PLAN={tout:[[/^Démarrer/,8],[/^Phase 1/,8],[/^Phase 2/,8],[/^Phase 3/,6]],
               p1:[[/^Démarrer/,12],[/^Phase 1/,18]],
               p2:[[/^Phase 2/,18],[/^Phase 3/,12]]};
const EX_LBL={tout:"tout le parcours",p1:"vocabulaire, fondements et phase 1",p2:"phases 2 et 3"};

function exBestTxt(){return Object.keys(EX_LBL).filter(k=>EXB[k]).map(k=>`Meilleur résultat : <b>${EXB[k].best} %</b> (${EX_LBL[k]}, ${esc(EXB[k].date)})`).join(" · ");}
/* Répartition au prorata du nombre de questions de chaque étape du groupe */
function exAlloc(pool,n){const tot=pool.reduce((s,m)=>s+m.quiz.length,0);n=Math.min(n,tot);
 const al=pool.map(m=>{const x=n*m.quiz.length/tot;return {m,k:Math.floor(x),r:x-Math.floor(x)};});
 let rest=n-al.reduce((s,a)=>s+a.k,0);al.slice().sort((a,b)=>b.r-a.r).forEach(a=>{if(rest>0&&a.k<a.m.quiz.length){a.k++;rest--;}});
 const qs=[];al.forEach(a=>shuffle(a.m.quiz.map((_,i)=>i)).slice(0,a.k).forEach(qi=>qs.push([a.m.id,qi])));return qs;}
/* Tirage : une seule question par groupe de questions jumelles (clé g), complément tiré dans le même groupe d'étapes */
function exPick(){const seen=new Set(),used=new Set(),qs=[];
 const take=(mid,qi)=>{const k=mid+":"+qi,q=M.find(m=>m.id===mid).quiz[qi];if(used.has(k)||(q.g&&seen.has(q.g)))return false;
  used.add(k);if(q.g)seen.add(q.g);qs.push({mid,qi,opt:shuffle(q.o.map((_,i)=>i))});return true;};
 (EX_PLAN[EXS]||EX_PLAN.tout).forEach(([re,n])=>{const pool=M.filter(m=>m.quiz&&m.quiz.length&&re.test(m.grp));let k=0;
  exAlloc(pool,n).forEach(([mid,qi])=>{if(take(mid,qi))k++;});
  if(k<n)shuffle(pool.flatMap(m=>m.quiz.map((_,qi)=>[m.id,qi]))).forEach(([mid,qi])=>{if(k<n&&take(mid,qi))k++;});});
 return shuffle(qs);}
function exFmt(s){return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;}
function exLeft(){return Math.max(0,EX_T-Math.floor((Date.now()-EX.t0)/1000));}

 if(e){e.textContent=exFmt(l);e.closest(".extop").classList.toggle("low",l<=300);}
 [300,60].forEach(w=>{if(l<=w&&!EX.warned[w]){EX.warned[w]=1;const a=document.getElementById("exA");if(a)a.textContent=`Il reste ${w/60} minute${w>60?"s":""}.`;}});
 if(l<=0)exFinish(true);}
function exAns(i,oi){if(!EX||EX.res)return;EX.ans[i]=oi;const q=document.getElementById("exq_"+i);
 q.querySelectorAll(".o").forEach(b=>{const on=+b.dataset.o===oi;b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on);});

 if(n)openModal(`<h3>Terminer l’examen ?</h3><p>${n} question${n>1?"s":""} sans réponse ser${n>1?"ont comptées fausses":"a comptée fausse"}.</p><div class="rowb"><button class="btn" onclick="closeModal();exFinish(false)">Terminer et corriger</button></div>`);else exFinish(false);}

 const per={};let ok=0;EX.qs.forEach((x,i)=>{const m=M.find(z=>z.id===x.mid),g=EX.ans[i]===m.quiz[x.qi].a;if(g)ok++;(per[x.mid]=per[x.mid]||{ok:0,n:0}).n++;if(g)per[x.mid].ok++;});
 const pct=Math.round(100*ok/EX.qs.length),dur=Math.min(EX_T,Math.round((Date.now()-EX.t0)/1000)),sc=EX.sc||"tout";EX.res={ok,pct,per,expired,dur};

  const E=EX.qs.map((x,i)=>[x,i]).filter(([x,i])=>EX.ans[i]!==M.find(z=>z.id===x.mid).quiz[x.qi].a);

 const n=mods.length+voc.length+lex.length+nrm.length;
 out.innerHTML=!n?`<p class="none">Aucun résultat.</p>`:`<span class="sr">${n} résultat${n>1?"s":""}</span>`
  +(mods.length?`<div class="sg">Étapes</div>${mods.map(m=>`<a href="#${m.id}" data-id="${m.id}">${esc(m.title)}${m.but?`<small>${esc(cut(m.but))}</small>`:""}</a>`).join("")}`:"")
  +(voc.length?`<div class="sg">Définitions</div>${voc.map(([c,i])=>`<a href="#vocab" data-id="vocab" data-card="${i}">${esc(c[0])}<small>${esc(cut(c[1]))}</small></a>`).join("")}`:"")
  +(lex.length?`<div class="sg">Sigles</div>${lex.map(([l,i])=>`<a href="#lex" data-id="lex" data-lex="${i}"><b>${esc(l[0])}</b><small>${esc(l[1])}</small></a>`).join("")}`:"")
  +(nrm.length?`<div class="sg">Normes et délais</div>${nrm.map(([r,i])=>`<a href="#normes" data-id="normes" data-norme="${i}">${esc(r[0])}<small>${esc(cut(r.slice(1).filter(x=>x!=="–").join(" · ")))}</small></a>`).join("")}`:"");}

/* ============ CRÉER UN CAS (instructeur) ============ */
/* Fichier de cas au format docs/FORMAT_CAS.md, construit à partir des saisies affichées (les siennes ou l'exemple VIENNE) */
function exportCasForm(){openModal(`<h3>Créer un cas à partir de mes saisies</h3><p>Le fichier reprend, comme corrigé, tout ce qui est rempli dans les onglets « Appliquer »${DEMO_ON?" (ici : l’exemple VIENNE)":""}. Tu pourras ensuite y ajouter un commentaire par étape (rubrique « texte »).</p>
 <div class="fld"><label for="casT">Titre du cas</label><input id="casT" value="Cas d’entraînement" autocomplete="off"></div>
 <div class="fld"><label for="casR">Résumé (une ou deux phrases, affiché dans le bandeau)</label><textarea id="casR" rows="2"></textarea></div>
 <div class="fld"><label for="casS">Situation (texte long ; une ligne vide sépare deux paragraphes)</label><textarea id="casS" rows="6"></textarea></div>
 <div class="rowb"><button class="btn" onclick="exportCas()">Créer le fichier</button></div><div id="casFormMsg" role="status"></div>`);}
function casData(titre,resume,situation){const corrige={},filled=v=>v!=null&&String(v).trim()!=="";
 M.forEach(m=>{if(!m.apply)return;const c={v:{},tab:{}};
  m.apply.forEach(b=>{if(b.t==="fields"&&S.v[b.id]){const o={};b.f.forEach(f=>{if(filled(S.v[b.id][f.k]))o[f.k]=S.v[b.id][f.k];});if(Object.keys(o).length)c.v[b.id]=o;}
   if(b.t==="tiers"&&S.v.tiers&&(S.v.tiers.r||S.v.tiers.c))c.v.tiers=S.v.tiers;
   const t=blkTab(b);if(t&&S.tab[t.id]){const rows=S.tab[t.id].filter(r=>t.cols.some(cl=>!cl.ro&&filled(r[cl.k])));if(rows.length)c.tab[t.id]=rows;}});
  const tc=S.tcidr.filter(r=>r.src===m.id&&filled(r.l)).map(({y,fo,l})=>({y,fo,l}));if(tc.length)c.tcidr=tc;
  const fr=S.frise.filter(r=>r.src===m.id&&(filled(r.g)||filled(r.e))).map(({g,e})=>({g,e}));if(fr.length)c.frise=fr;
  if(!Object.keys(c.v).length)delete c.v;if(!Object.keys(c.tab).length)delete c.tab;
  if(Object.keys(c).length)corrige[m.id]=c;});
 return {titre,resume,situation,corrige};}
function exportCas(){const g=id=>(document.getElementById(id)||{}).value||"",titre=g("casT").trim(),out=document.getElementById("casFormMsg");
 if(!titre){if(out)out.innerHTML=`<p class="warn">Donne un titre au cas.</p>`;return;}
 const d=casData(titre,g("casR").trim(),g("casS").trim()),n=Object.keys(d.corrige).length;
 if(!n){if(out)out.innerHTML=`<p class="warn">Aucune saisie à reprendre : remplis d’abord les gabarits (onglets « Appliquer »).</p>`;return;}
 closeModal();dl("cas_"+titre.replace(/[^\wÀ-ÿ]+/g,"_").replace(/^_+|_+$/g,"")+".json","application/json",JSON.stringify(d,null,1));
 const e=document.getElementById("casMsg");if(e)e.innerHTML=`<p class="ok-msg">Cas « ${esc(titre)} » : corrigé pour ${n} étape(s). Complète au besoin la situation et les commentaires (« texte ») dans le fichier, puis charge-le avec « Charger un cas ».</p>`;}

/* ============ FOCUS, HAUTEUR DES CHAMPS, SOMMAIRE (audit forme v2) ============ */
let FOCUS_NEXT=null;
function focusKey(el){const m=document.getElementById("main");if(!el||el===m||!m.contains(el))return null;
 if(el.id)return "#"+CSS.escape(el.id);
 for(const a of ["aria-label","onclick","onchange","oninput"]){const v=el.getAttribute(a);if(v)return `${el.tagName}[${a}="${CSS.escape(v)}"]`;}
 return null;}
function autoH(list){const L=[...list].filter(t=>t.offsetParent!==null);L.forEach(t=>t.style.height="0px");
 const h=L.map(t=>t.scrollHeight);L.forEach((t,i)=>t.style.height=(h[i]+2)+"px");}
function applyToc(){if(curTab!=="a")return;const el=document.getElementById("main");if(!el.querySelector(".tabs"))return;
 const hs=[...el.querySelectorAll(".card>h3,details.card>summary b")];if(hs.length<4)return;
 const n=document.createElement("div");n.className="toc";n.setAttribute("role","navigation");n.setAttribute("aria-label","Sommaire de l’onglet");
 n.innerHTML=hs.map((h,i)=>{const t=h.closest(".card");t.id="sec_"+i;h.tabIndex=-1;h.id="sech_"+i;return `<a href="#sec_${i}" onclick="event.preventDefault();const c=document.getElementById('sec_${i}'),h=document.getElementById('sech_${i}');if(c.tagName==='DETAILS')c.open=true;c.scrollIntoView();h.focus({preventScroll:true})">${esc(h.textContent.replace(/^Gantt – /,"Gantt : "))}</a>`;}).join("");
 el.querySelector(".tabs").after(n);}
const _render=render;
render=function(){const k=focusKey(document.activeElement);_render();
 autoH(document.querySelectorAll("#main textarea"));
 applyToc();
 let e=null;try{e=k&&document.querySelector(k);}catch(x){e=null;}if(e&&e.disabled)e=null;
 if(!e&&FOCUS_NEXT){e=document.querySelector(FOCUS_NEXT);if(e&&!e.matches("a,button,input,select,textarea,summary,[tabindex]"))e.tabIndex=-1;}
 FOCUS_NEXT=null;if(e)e.focus({preventScroll:true});};
document.addEventListener("input",e=>{if(e.target.matches("#main textarea"))autoH([e.target]);});
document.addEventListener("toggle",e=>{if(e.target.open)autoH(e.target.querySelectorAll("textarea"));},true);
let rsz;addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(()=>{refreshCharts();autoH(document.querySelectorAll("#main textarea"));},200);});
const toTop=document.getElementById("toTop");addEventListener("scroll",()=>{toTop.hidden=scrollY<1200;},{passive:true});

/* ============ INIT ============ */
document.addEventListener("click",e=>{if(document.body.classList.contains("navopen")&&!document.getElementById("nav").contains(e.target)&&e.target.id!=="menuBtn")toggleNav(false);});
USER=S;const dsw=document.getElementById("demoSw");dsw.onchange=()=>setDemo(dsw.checked);
function setDemo(on){DEMO_ON=on;dsw.checked=on;const b=document.getElementById("demoBanner");
 if(on){USER=S;S=JSON.parse(JSON.stringify(DEMO));S.quiz=USER.quiz;b.hidden=false;b.innerHTML=`<details><summary><b>Exemple VIENNE – ${esc(DEMO_SITU.titre)}</b> (lire la situation)</summary>${esc(DEMO_SITU.situation||DEMO_SITU.resume).split(/\n\s*\n/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("")}</details><i>Modifications non enregistrées.</i> <button class="btn s" onclick="setDemo(false)">Revenir à mes travaux</button>`;}
 else{S=USER;b.hidden=true;}
 QZ={};render();}
function toggleNav(f){const n=document.getElementById("nav"),o=f===undefined?!n.classList.contains("open"):f;n.classList.toggle("open",o);document.body.classList.toggle("navopen",o);document.getElementById("menuBtn").setAttribute("aria-expanded",o);if(o)setTimeout(()=>document.getElementById("navX").focus(),60);}
function fromHash(){const h=(location.hash||"").slice(1);const m=M.find(x=>x.id===h);if(m&&unlocked(m)){cur=h;curTab="c";}render();}
window.addEventListener("hashchange",fromHash);renderCas();fromHash();
</script>
