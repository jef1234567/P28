 unité dans le plan d’ensemble ; missions des voisins":"Role of our unit in the overall plan; adjacent units’ missions","Ex. : franchir la ligne X à/c de H":"E.g.: cross line X from H","Implicite":"Implied","Spécifiée et essentielle":"Specified and essential","Implicite et essentielle":"Implied and essential","Sur ordre":"On order","Être en mesure de":"Be prepared to","Fonction de combat":"Combat function","Interarmes (toutes)":"Combined arms (all)","Ex. : OPORD § 3":"E.g.: OPORD § 3","Limitation":"Limitation","Contrainte (doit faire)":"Constraint (must do)","Restriction (ne doit pas faire)":"Restraint (must not do)","Source":"Source","Énoncé":"Statement","Vérification / remplacement par un fait":"Verification / replacement by a fact","Point critique":"Critical point","Mesure envisagée / demande au supérieur":"Planned measure / request to the superior","Énoncé de mission – Qui":"Mission statement – Who","Quoi (tâche essentielle)":"What (essential task)","Quand":"When","Où":"Where","Énoncé de mission reformulé (phrase complète)":"Restated mission statement (full sentence)","Intention initiale du chef (but, tâches clés, état final)":"Commander’s initial intent (purpose, key tasks, end state)","Critère d’évaluation":"Evaluation criterion","Quel est le produit de l’analyse de la mission ?":"What is the output of mission analysis?","Un énoncé de mission clair et concis, avec la tâche et le but":"A clear, concise mission statement, with the task and purpose","La liste des modes d’action":"The list of courses of action","L’ordre d’avertissement final":"The final warning order","Le plan de recherche du renseignement":"The intelligence collection plan","Qui présente le briefing d’analyse de l’ordre ?":"Who delivers the order analysis briefing?","Le chef, à son état-major":"The commander, to the staff","Le COS, au chef":"The COS, to the commander","Le G3, aux subordonnés":"The G3, to subordinates","Le G2, à l’échelon supérieur":"The G2, to the higher echelon","L’intention initiale du chef comprend en général…":"The commander’s initial intent usually includes…","le but, les tâches clés et l’objectif (état final)":"the purpose, key tasks and the objective (end state)","l’énoncé de mission et les CCIR":"the mission statement and the CCIR","les critères d’évaluation pondérés":"the weighted evaluation criteria","le schéma de manœuvre et la réserve":"the scheme of manoeuvre and the reserve","À quelle distance hiérarchique l’intention doit-elle être comprise ?":"How far down the chain of command must the intent be understood?","Deux niveaux en dessous":"Two levels down","Un niveau en dessous":"One level down","Au niveau supérieur seulement":"At the higher level only","Par l’état-major uniquement":"By the staff only","Où trouve-t-on en général les tâches confiées par le supérieur ?":"Where are the tasks assigned by the superior usually found?","Au paragraphe 3 (Exécution) de son OPORD":"In paragraph 3 (Execution) of the superior’s OPORD","Au paragraphe 1 (Situation)":"In paragraph 1 (Situation)","Au paragraphe 5 (Commandement et transmissions)":"In paragraph 5 (Command and signal)","Dans l’annexe de renseignement seulement":"In the intelligence annex only","Parfois aussi aux § 4 et 5, en annexe, sur les calques ou oralement (§ 2.3 et 2.4.2.3).":"Sometimes also in paragraphs 4 and 5, annexes, overlays or verbally (§ 2.3 and 2.4.2.3).","Qui pondère d’abord les critères d’évaluation ?":"Who initially weights the evaluation criteria?","Le COS, selon leur importance et les directives du chef":"The COS, by importance and the commander’s guidance","Le chef seul":"The commander alone","Chaque expert fonctionnel":"Each functional expert","Le chef de niveau N+1":"The commander one level up","Le chef peut ajuster la pondération (§ 2.4.5).":"The commander may adjust the weighting (§ 2.4.5).","Dans quel cas le subordonné peut-il s’écarter de la mission reçue ?":"When may subordinates deviate from the assigned mission?","À titre exceptionnel, si la mission est devenue sans objet ou irréalisable":"In exceptional circumstances, if the mission is no longer valid or feasible","Dès qu’il juge un autre mode d’action meilleur":"As soon as they judge another course of action better","Jamais":"Never","Si ses subordonnés le demandent":"If their own subordinates ask for it","Il agit toujours selon l’intention de niveau N+2 (§ 2.3).":"They always act in accordance with the N+2 intent (§ 2.3).","Avec qui vérifie-t-on la légalité des contraintes et restrictions ?":"With whom is the legality of constraints and restraints checked?","Le conseiller juridique (staff judge advocate)":"The staff judge advocate","L’officier de liaison du supérieur":"The superior’s liaison officer","Le chef de niveau N+2":"The commander two levels up","L’évaluation des facteurs (2B)…":"The evaluation of factors (2B)…","commence en parallèle de l’analyse de l’ordre":"starts in parallel with order analysis","ne commence qu’après le back brief initial":"only starts after the initial back-brief","est conduite par le chef seul":"is conducted by the commander alone","remplace l’IPOE":"replaces IPOE","Le chef peut-il désigner, dès ses directives, des modes d’action à écarter ?":"Can the commander, in their guidance, rule out courses of action?","Oui, cela économise le travail de l’état-major":"Yes, it saves staff effort","Non, seul l’état-major propose les COA":"No, only the staff proposes COAs","Seulement à l’étape 6":"Only at step 6","Seulement en temps contraint":"Only under time constraints","Étape 2B – Évaluation des facteurs":"Step 2B – Evaluation of factors","Dans quelle situation ?":"In what situation?","Analyser la situation par rapport à la mission de l’unité (§ 2.5), présenter le briefing d’analyse de la mission, diffuser l’ordre d’avertissement et rendre compte au supérieur par le back brief initial, qui clôt la phase 1.":"Analyse the situation in relation to the unit’s mission (§ 2.5), deliver the mission analysis briefing, issue the warning order and report to the superior through the initial back-brief, which ends phase 1.","Activités (§ 2.5.1)":"Activities (§ 2.5.1)","Analyse de l’ordre et des annexes par chaque cellule":"Staff analysis of the order and annexes by each section","IPOE : terrain et météo ; capacités de l’adversaire et des autres acteurs ; environnement civil (PMESII) ; considérations civiles (ASCOPE)":"IPOE: terrain and weather; adversary and other actors’ capabilities; civil environment (PMESII); civil considerations (ASCOPE)","Revue des troupes et appuis disponibles":"Review of troops and support available","Revue du temps disponible":"Review of time available","Identification des risques et début de l’évaluation des risques":"Risk identification and start of risk assessment","Élaboration des CCIR":"Development of CCIR","Plan initial de recherche du renseignement (ICP)":"Initial intelligence collection plan (ICP)","Briefing d’analyse de la mission":"Mission analysis briefing","Directives de planification complémentaires":"Additional planning guidance","Ordre d’avertissement":"Warning order","Back brief initial du chef":"Commander’s initial back-brief","IPOE (§ 2.5.3)":"IPOE (§ 2.5.3)","Analyse systématique de l’adversaire, du terrain et de la météo dans une zone d’intérêt. Elle commence en analyse de la mission et se poursuit jusqu’à la production de l’OPORD. Le renseignement achève son estimation et élabore les modèles de modes d’action adverses (ACOA). Autres produits : PIR, calque combiné des obstacles, liste des cibles de haute valeur (HVT), gabarits d’événements non affinés.":"Systematic analysis of the adversary, terrain and weather in an area of interest. It begins in mission analysis and continues through OPORD production. Intelligence completes its estimate and develops adversary COA (ACOA) models. Other products: PIR, combined obstacle overlay, high-value target (HVT) list, unrefined event templates.","Troupes et appuis (§ 2.5.4)":"Troops and support (§ 2.5.4)","Examiner les ajouts et retraits de l’articulation, les relations de commandement et de soutien, les capacités et limites de toutes les unités. Vérifier que les moyens suffisent pour toutes les tâches ; demander au supérieur ce qui manque. Option : analyse du centre de gravité de nos forces pour repérer nos vulnérabilités critiques.":"Examine additions to and deletions from the task organization, command and support relationships, capabilities and limitations of all units. Check that assets suffice for all tasks; request what is missing from the superior. Optional: centre of gravity analysis of own forces to identify critical friendly vulnerabilities.","CCIR (§ 2.5.7)":"CCIR (§ 2.5.7)","PIR : besoins prioritaires en renseignement, tirés des CCIR ; peu nombreux, cohérents avec ceux des autres niveaux, liés à une décision du chef":"PIR: priority intelligence requirements, derived from CCIR; limited in number, consistent with other levels, linked to a commander’s decision","FFIR : informations sur nos forces et les forces en appui, gérées par le G3":"FFIR: information about own and supporting forces, managed by the G3","EEFI : informations à protéger, et non à rechercher":"EEFI: information to be protected, not collected","Ordre d’avertissement (§ 2.6)":"Warning order (§ 2.6)","Énoncé de mission approuvé":"Approved mission statement","Changements d’articulation":"Task organization changes","Zone d’opérations":"Area of operations","Produits et calques d’IPOE, dont les CCIR":"IPOE products and overlays, including CCIR","Directives de réduction des risques":"Risk mitigation guidance","Priorités par fonction de combat":"Priorities by combat function","Directives de déception":"Military deception guidance","Plan initial de recherche":"Initial collection plan","Mouvements ou actions à lancer":"Movements or actions to initiate","Chronologie opérationnelle mise à jour":"Updated operational timeline","Back brief initial (§ 2.6.1)":"Initial back-brief (§ 2.6.1)","Il clôt la phase 1 : le chef subordonné rend compte au chef supérieur pour confirmer une compréhension commune de la mission et de l’intention. Il peut demander ou justifier des moyens supplémentaires, proposer des amendements aux mesures de coordination, demander la mise en œuvre ou la délégation de règles d’engagement, demander des précisions et exprimer ses préoccupations majeures (risques, points critiques).":"It ends phase 1: the subordinate commander briefs the higher commander to confirm a shared understanding of the mission and intent. They may request or justify additional resources, propose amendments to control measures, request ROE implementation or delegation, seek clarification and express major concerns (risks, critical points).","Outils (§ 2.6.2)":"Tools (§ 2.6.2)","Analyse du centre de gravité tactique (facultative) : capacités critiques, besoins critiques, vulnérabilités critiques ; les vulnérabilités ennemies sont des points d’application, les nôtres guident la protection":"Tactical centre of gravity analysis (optional): critical capabilities, critical requirements, critical vulnerabilities; enemy vulnerabilities are aiming points, ours guide protection","Modèle à trois colonnes (tableau 2-2) : facteur / déduction / conclusion":"Three-column model (table 2-2): factor / deduction / conclusion","Énoncé de mission du chef":"Commander’s mission statement","Plan initial de recherche du renseignement":"Initial intelligence collection plan","Chronologies opérationnelles mises à jour":"Updated operational timelines","Centres de gravité et modes d’action de l’adversaire":"Adversary centres of gravity and courses of action","Produits, calques et conclusions de l’analyse du terrain":"Terrain analysis products, overlays and conclusions","Prévisions météo, matrice et conclusions":"Weather forecast, matrix and conclusions","Troupes et appuis (forces disponibles, lacunes capacitaires)":"Troops and support (forces available, capability shortfalls)","Considérations sur l’environnement civil":"Civil environment considerations","Les FFIR et les EEFI ne relèvent pas du renseignement ; certaines nations ne rangent pas les EEFI parmi les CCIR (§ 2.5.7).":"FFIR and EEFI are not the intelligence staff’s responsibility; some nations do not treat EEFI as part of CCIR (§ 2.5.7).","L’évaluation des risques est menée par le G3 avec l’officier de sécurité ; chaque cellule l’intègre dans son domaine (§ 2.5.6).":"Risk assessment is led by the G3 with the safety officer; each section integrates it in its own field (§ 2.5.6).","Comparer le temps nécessaire aux tâches avec la chronologie du supérieur et avec celle supposée de l’adversaire fait apparaître des fenêtres d’opportunité et des périodes de risque (§ 2.5.10).":"Comparing the time needed for tasks with the higher timeline and the adversary’s assumed timeline reveals windows of opportunity and periods of risk (§ 2.5.10).","Les conclusions de l’analyse du centre de gravité s’expriment en tâches, en besoins de forces ou de commandement, ou en CCIR (§ 2.6.2).":"Conclusions of the centre of gravity analysis are expressed as tasks, force or C2 requirements, or CCIR (§ 2.6.2).","Pour chaque facteur (terrain et météo, adversaire, environnement civil, troupes et appuis, temps), pose la question, la déduction puis la conclusion. Formule ensuite tes CCIR, l’analyse du centre de gravité adverse et ton ordre d’avertissement.":"For each factor (terrain and weather, adversary, civil environment, troops and support, time), state the question, the deduction and then the conclusion. Then formulate your CCIR, the adversary centre of gravity analysis and your warning order.","Facteur":"Factor","Terrain et météo":"Terrain and weather","Adversaire et autres acteurs":"Adversary and other actors","Environnement civil (PMESII)":"Civil environment (PMESII)","Considérations civiles (ASCOPE)":"Civil considerations (ASCOPE)","Troupes et appuis":"Troops and support","Fait, hypothèse ou question":"Fact, assumption or question","PIR":"PIR","FFIR":"FFIR","EEFI":"EEFI","Besoin":"Requirement","Décision du chef qu’il éclaire":"Commander’s decision it supports","Centre de gravité tactique adverse":"Adversary tactical centre of gravity","Capacités critiques":"Critical capabilities","Besoins critiques":"Critical requirements","Vulnérabilités critiques (points d’application)":"Critical vulnerabilities (aiming points)","Nos vulnérabilités critiques à protéger (facultatif)":"Our critical vulnerabilities to protect (optional)","Ordre d’avertissement (contenu)":"Warning order (content)","Back brief initial : demandes et préoccupations":"Initial back-brief: requests and concerns","Quelle activité clôt la phase 1 ?":"Which activity ends phase 1?","Le back brief initial du chef":"The commander’s initial back-brief","Le briefing d’analyse de la mission":"The mission analysis briefing","La décision du chef":"The commander’s decision","PMESII sert à analyser…":"PMESII is used to analyse…","l’environnement civil : politique, militaire, économique, social, information, infrastructure":"the civil environment: political, military, economic, social, information, infrastructure","les considérations civiles : zones, structures, capacités, organisations, population, événements":"civil considerations: areas, structures, capabilities, organizations, people, events","les capacités de l’adversaire":"the adversary’s capabilities","les fonctions de combat amies":"friendly combat functions","ASCOPE sert aux considérations civiles (§ 2.5.1).":"ASCOPE is used for civil considerations (§ 2.5.1).","Qui élabore les modèles de modes d’action adverses (ACOA) ?":"Who develops the adversary course of action (ACOA) models?","Le renseignement, dans le cadre de l’IPOE":"Intelligence, as part of IPOE","Le COS":"The COS","Les FFIR sont gérées par…":"FFIR are managed by…","le G3":"the G3","le G2":"the G2","le conseiller juridique":"the staff judge advocate","l’officier de sécurité":"the safety officer","FFIR et EEFI ne relèvent pas du renseignement (§ 2.5.7).":"FFIR and EEFI are not the intelligence staff’s responsibility (§ 2.5.7).","Un PIR doit…":"A PIR must…","être lié à une décision que le chef doit prendre":"be linked to a decision the commander must make","porter sur nos propres forces":"concern our own forces","désigner une information à protéger":"designate information to be protected","être formulé par le chef de niveau N+2":"be formulated by the commander two levels up","Peu nombreux, cohérents avec les autres niveaux, en appui d’une décision (§ 2.5.7).":"Limited in number, consistent with other levels, supporting a decision (§ 2.5.7).","Les trois facteurs de l’analyse du centre de gravité tactique sont…":"The three factors of tactical centre of gravity analysis are…","capacités critiques, besoins critiques, vulnérabilités critiques":"critical capabilities, critical requirements, critical vulnerabilities","forces, faiblesses, opportunités":"strengths, weaknesses, opportunities","fait, déduction, conclusion":"fact, deduction, conclusion","tâches, contraintes, restrictions":"tasks, constraints, restraints","Dans le modèle à trois colonnes, la troisième colonne contient…":"In the three-column model, the third column contains…","des conclusions : RFI, demandes de précision au supérieur, tâches, directives du chef":"conclusions: RFIs, requests for clarification to the superior, tasks, commander’s guidance","les faits et hypothèses":"facts and assumptions","les déductions":"deductions","les critères d’évaluation":"evaluation criteria","Tableau 2-2 (§ 2.6.2).":"Table 2-2 (§ 2.6.2).","Qui intègre la gestion des risques à la planification ?":"Who integrates risk management into planning?","Le G3, avec l’officier de sécurité":"The G3, with the safety officer","Le COS seul":"The COS alone","Lors du back brief initial, le chef subordonné peut notamment…":"During the initial back-brief, the subordinate commander may notably…","demander des moyens, proposer des amendements aux mesures de coordination, demander des règles d’engagement":"request resources, propose amendments to control measures, request rules of engagement","présenter son mode d’action retenu":"present the selected course of action","signer l’ordre d’opération":"sign the operation order","modifier l’intention de niveau N+2":"change the intent two levels up","Que révèle la comparaison de nos délais avec la chronologie supposée de l’adversaire ?":"What does comparing our timings with the adversary’s assumed timeline reveal?","Des fenêtres d’opportunité et des périodes de risque":"Windows of opportunity and periods of risk","Les critères d’évaluation":"The evaluation criteria","Le centre de gravité ami":"The friendly centre of gravity","Les tâches spécifiées":"The specified tasks","Phase 2 – Concevoir et développer les modes d’action":"Phase 2 – Consider and develop courses of action","Étape 3 – Développement des COA":"Step 3 – COA development","Développer un ou plusieurs modes d’action, le « comment » de la mission, assez détaillés pour être confrontés aux modes d’action adverses (§ 3.1). Entrées : énoncé de mission, intention, directives de planification, conclusions de l’IPOE et de l’évaluation des facteurs.":"Develop one or more courses of action, the “how” of the mission, detailed enough to be compared against adversary courses of action (§ 3.1). Inputs: mission statement, intent, planning guidance, conclusions from IPOE and the evaluation of factors.","Activités dans l’ordre (§ 3.1.1)":"Activities in order (§ 3.1.1)","Évaluer la puissance de combat relative":"Assess relative combat power","Générer des options":"Generate options","Établir un cadre d’opération":"Establish an operational framework","Articuler les forces":"Array forces","Attribuer les tâches (et, si besoin, les états-majors)":"Assign tasks (and, as required, headquarters)","Rédiger l’énoncé et le croquis de chaque COA":"Develop COA statements and sketches","Valider les COA":"Validate COAs","Présenter le briefing des COA":"Deliver the COA briefing","Retenir ou modifier les COA pour la suite":"Select or modify COAs for continued analysis","Puissance de combat relative (§ 3.1.2)":"Relative combat power (§ 3.1.2)","Estimation grossière des rapports de forces des formations de manœuvre deux niveaux en dessous, en comparant nos forces aux faiblesses adverses et inversement, pour chaque élément de la puissance de combat. Elle ne doit pas reposer sur les seuls ratios mathématiques : elle est largement subjective et pèse aussi les facteurs immatériels (moral, entraînement).":"A rough force-ratio estimate of manoeuvre formations two levels down, comparing our strengths against adversary weaknesses and vice versa, for each element of combat power. It must not rest solely on mathematical ratios: it is largely subjective and also weighs intangible factors (morale, training).","Générer des options (§ 3.1.3)":"Generate options (§ 3.1.3)","Brainstorming : la gamme de choix la plus large, sans biais":"Brainstorming: the widest range of choices, without bias","Méthode « film » (movie-method) : enchaîner nos actions de la situation actuelle au résultat voulu (ou à rebours)":"Movie-method: sequence our actions from the current situation to the desired outcome (or in reverse)","Wargaming : la méthode « film » avec les actions et réactions adverses":"Wargaming: the movie-method plus adversary actions and reactions","Un bon COA doit faire échec à tous les ACOA réalisables.":"A good COA should defeat all feasible ACOAs.","Cadres d’opération (§ 3.1.4)":"Operational frameworks (§ 3.1.4)","Géographique : profondeur (deep), contact (close), arrière (rear)":"Geographic: deep, close, rear","Par le but : opération décisive (décrite en premier, imbriquée dans le concept du supérieur), opérations de modelage (shaping), opérations de soutien (sustaining)":"Purpose-based: decisive operation (developed first, nested within the higher concept), shaping operations, sustaining operations","APP-28 cite quatre cadres (puissance de combat, géographique, fonctionnel, opérationnel) : l’important est que leur sens soit partagé.":"APP-28 cites four frameworks (fighting power, geographic, functional, operational): what matters is a shared understanding of their meaning.","Ratios minimaux de planification (§ 3.1.5, tableau 3-1)":"Historical minimum planning ratios (§ 3.1.5, table 3-1)","Retarder : 1 contre 6":"Delay: 1 to 6","Défendre une position préparée ou fortifiée : 1 contre 3":"Defend a prepared or fortified position: 1 to 3","Défendre une position hâtive : 1 contre 2,5":"Defend a hasty position: 1 to 2.5","Attaquer une position préparée ou fortifiée : 3 contre 1":"Attack a prepared or fortified position: 3 to 1","Attaquer une position hâtive : 2,5 contre 1":"Attack a hasty position: 2.5 to 1","Contre-attaquer de flanc : 1 contre 1":"Counterattack into a flank: 1 to 1","Articuler d’abord l’opération décisive, puis les opérations de modelage et de soutien, avec des unités génériques deux niveaux en dessous. En cas de déficit : demander des moyens, accepter un risque dans une partie de la zone, ou enchaîner les tâches au lieu de les mener simultanément.":"Array the decisive operation first, then shaping and sustaining operations, with generic units two levels down. If short: request more resources, accept risk in part of the area, or execute tasks sequentially rather than simultaneously.","Contenu d’un COA (§ 3.1.7)":"COA contents (§ 3.1.7)","Cadre conceptuel":"Conceptual framework","Schéma de manœuvre, dont l’effort principal":"Scheme of manoeuvre, including the main effort","Schéma des feux, concept du génie, opérations d’information":"Scheme of fires, military engineering concept, information operations","Risques et points critiques identifiés":"Identified risks and critical points","Événements critiques et transitions de phase":"Critical events and phase transitions","Réserve : désignation, emplacement, composition":"Reserve: designation, location, composition","Concept de recherche des CCIR":"CCIR collection concept","Tâches de stabilisation essentielles":"Essential stability tasks","Zones d’opérations des subordonnés":"Subordinate areas of operations","Déception (à diffusion restreinte)":"Military deception (need-to-know basis)","Mesures de coordination clés":"Key control measures","Chaque COA reçoit un nom caractéristique.":"Each COA receives a characteristic name.","Critères de validation (§ 3.1.7)":"Validation criteria (§ 3.1.7)","Adapté (suitable) : atteint le but, conforme à l’intention et aux directives":"Suitable: achieves the purpose, complies with the intent and guidance","Réalisable (feasible) : dans le temps, l’espace et les moyens disponibles":"Feasible: within the available time, space and resources","Acceptable : proportionné, vaut son coût, conforme au droit des conflits armés":"Acceptable: proportional, worth the cost, consistent with the law of armed conflict","Distinct (unique) : nettement différent des autres COA (l’AJP-5 parle d’« exclusivité »)":"Unique: significantly different from other COAs (AJP-5 speaks of “exclusivity”)","Souple (flexible) : laisse des options au chef":"Flexible: gives the commander options","IPOE mise à jour, centrée au minimum sur les ACOA le plus probable et le plus dangereux":"Updated IPOE, focused at least on the most likely and most dangerous ACOAs","Modes d’action adverses, autant que nécessaire ou que le chef le demande":"Adversary courses of action, as many as necessary or as the commander requires","Énoncé et croquis de chaque COA, avec les matrices de synchronisation mises à jour":"Statement and sketch of each COA, with updated synchronisation matrices","Justification de chaque COA : effets sur les ACOA, événements critiques, puissance de combat relative, articulation et mesures de coordination, impact sur l’environnement civil, faits et hypothèses nouveaux ou mis à jour":"Rationale for each COA: effects on ACOAs, critical events, relative combat power, arraying and control measures, impact on the civil environment, new or updated facts and assumptions","Les ratios du tableau 3-1 sont des minimums historiques de planification, pas une règle de décision : vérifie aussi les facteurs immatériels (§ 3.1.5).":"The ratios in table 3-1 are historical minimum planning ratios, not a decision rule: also check intangible factors (§ 3.1.5).","Si tous les COA sont rejetés, l’état-major recommence ; le chef peut aussi combiner des éléments de plusieurs COA (§ 3.1.9).":"If all COAs are rejected, the staff starts again; the commander may also combine elements of several COAs (§ 3.1.9).","Certaines nations attribuent les états-majors dès cette étape ; d’autres en laissent la prérogative au chef à l’étape 6 (§ 3.1.6).":"Some nations assign headquarters at this step; others leave it to the commander’s prerogative at step 6 (§ 3.1.6).","Évalue d’abord la puissance de combat relative, puis rédige au moins deux COA nettement différents. Teste chacun selon les cinq critères de validation avant de préparer le briefing des COA.":"First assess relative combat power, then write at least two clearly different COAs. Test each against the five validation criteria before preparing the COA briefing.","Élément de puissance de combat":"Element of combat power","Nos forces":"Our forces","Adversaire":"Adversary","Déduction (vulnérabilités à exploiter ou à protéger)":"Deduction (vulnerabilities to exploit or protect)","Cadre d’opération retenu (opération décisive, modelage, soutien ; ou profondeur, contact, arrière)":"Selected operational framework (decisive, shaping, sustaining; or deep, close, rear)","COA 1 – nom caractéristique":"COA 1 – characteristic name","COA 1 – énoncé (effort principal, efforts secondaires, réserve, enchaînement)":"COA 1 – statement (main effort, supporting efforts, reserve, sequencing)","COA 2 – nom caractéristique":"COA 2 – characteristic name","COA 2 – énoncé":"COA 2 – statement","COA 3 – nom caractéristique (facultatif)":"COA 3 – characteristic name (optional)","COA 3 – énoncé (facultatif)":"COA 3 – statement (optional)","COA":"COA","COA 1":"COA 1","COA 2":"COA 2","COA 3":"COA 3","Adapté":"Suitable","À revoir":"To be reviewed","Réalisable":"Feasible","Acceptable":"Acceptable","Distinct":"Unique","Souple":"Flexible","Remarques":"Remarks","Quelle est la première activité du développement des COA ?":"What is the first activity of COA development?","Rédiger l’énoncé du COA":"Write the COA statement","À quel niveau fait-on l’estimation des rapports de forces ?":"At what level is the force-ratio estimate made?","Les formations de manœuvre deux niveaux en dessous":"Manoeuvre formations two levels down","Le même niveau que le planificateur":"The planner’s own level","Un niveau au-dessus":"One level up","Toutes les unités jusqu’au groupe":"All units down to section","Ratio minimal pour attaquer une position préparée ou fortifiée ?":"Minimum ratio to attack a prepared or fortified position?","3 contre 1":"3 to 1","2,5 contre 1":"2.5 to 1","1 contre 1":"1 to 1","6 contre 1":"6 to 1","Tableau 3-1 (§ 3.1.5).":"Table 3-1 (§ 3.1.5).","Ratio minimal pour défendre une position préparée ou fortifiée ?":"Minimum ratio to defend a prepared or fortified position?","1 contre 3":"1 to 3","1 contre 2,5":"1 to 2.5","1 contre 6":"1 to 6","1 contre 6 : retarder ; 1 contre 2,5 : défense hâtive (tableau 3-1).":"1 to 6: delay; 1 to 2.5: hasty defence (table 3-1).","Quelle opération articule-t-on en premier ?":"Which operation is arrayed first?","L’opération décisive":"The decisive operation","Les opérations de modelage":"Shaping operations","Les opérations de soutien":"Sustaining operations","La réserve":"The reserve","§ 3.1.5 et 3.1.6.":"§ 3.1.5 and 3.1.6.","Quels sont les cinq critères de validation d’un COA ?":"What are the five COA validation criteria?","Adapté, réalisable, acceptable, distinct, souple":"Suitable, feasible, acceptable, unique, flexible","Adapté, réalisable, acceptable, complet, exclusif":"Suitable, feasible, acceptable, complete, exclusive","Simple, souple, sûr, rapide, économe":"Simple, flexible, safe, fast, economical","Réalisable, décisif, distinct, complet, réversible":"Feasible, decisive, unique, complete, reversible","Suitable, feasible, acceptable, unique, flexible (§ 3.1.7).":"Suitable, feasible, acceptable, unique, flexible (§ 3.1.7).","La méthode « film » (movie-method) consiste à…":"The movie-method consists of…","enchaîner nos actions de la situation actuelle au résultat voulu (ou à rebours)":"sequencing our actions from the current situation to the desired outcome (or in reverse)","générer librement le plus d’idées possible":"freely generating as many ideas as possible","opposer action, réaction et contre-réaction":"playing action, reaction and counteraction","comparer les COA par une matrice":"comparing COAs with a matrix","Le wargaming y ajoute les actions adverses (§ 3.1.3).":"Wargaming adds adversary actions to it (§ 3.1.3).","Face à un déficit de forces pour un COA, APP-28 propose…":"Facing a force shortfall for a COA, APP-28 suggests…","demander des moyens, accepter un risque dans une partie de la zone, ou enchaîner les tâches":"requesting resources, accepting risk in part of the area, or sequencing tasks","abandonner la mission":"abandoning the mission","réduire l’intention du chef":"scaling down the commander’s intent","supprimer la réserve":"removing the reserve","Si le COA reste irréalisable, l’état-major le constate (§ 3.1.5).":"If the COA remains infeasible, the staff must determine so (§ 3.1.5).","Un COA « acceptable » est…":"An “acceptable” COA is…","proportionné, vaut son coût et respecte le droit des conflits armés":"proportional, worth the cost and consistent with the law of armed conflict","réalisable dans le temps et les moyens disponibles":"feasible within the available time and resources","nettement différent des autres":"significantly different from the others","conforme à l’intention du chef":"consistent with the commander’s intent","Réalisable = feasible ; distinct = unique ; conforme à l’intention = adapté (§ 3.1.7).":"Feasible = within means; unique = different; consistent with intent = suitable (§ 3.1.7).","Que fait le chef si aucun COA ne convient ?":"What does the commander do if no COA is satisfactory?","L’état-major recommence ; le chef peut combiner des éléments de plusieurs COA":"The staff starts again; the commander may combine elements of several COAs","Il retient le moins mauvais sans analyse":"Selects the least bad one without analysis","Il demande au supérieur de choisir":"Asks the superior to choose","Il passe directement à l’étape 7":"Goes straight to step 7","Étape 4 – Analyse des COA (wargaming)":"Step 4 – COA analysis (wargaming)","Et si… ?":"What if…?","Mettre à l’épreuve chaque COA : identifier difficultés, besoins de coordination et conséquences probables, et synchroniser les sept fonctions de combat (§ 3.2).":"Test each COA: identify difficulties, coordination needs and probable consequences, and synchronise the seven combat functions (§ 3.2).","Préparation, dans l’ordre (§ 3.2.1)":"Preparation, in order (§ 3.2.1)","Choisir la technique d’analyse : analyse mentale, « réflexion à voix haute », procédure formelle (wargaming) ou simulation informatique":"Select the analysis technique: mental analysis, “thinking out loud”, formal procedure (wargaming) or computer simulation","Choisir le mode d’action adverse : chaque COA contre chaque ACOA (ou, pour gagner du temps, contre le seul ACOA le plus probable)":"Select the adversary course of action: each COA against each ACOA (or, to save time, against the most likely ACOA only)","Choisir les événements critiques et les points de décision à analyser":"Select the critical events and decision points to analyse","Choisir la méthode : par bandes (belt), par cases (box) ou par axe dans la profondeur (avenue in depth)":"Select the method: belt, box or avenue in depth","Préparer l’enregistrement et l’affichage des résultats":"Prepare a method to record and display results","Lister et placer toutes les forces amies et adverses pertinentes":"List and position all relevant friendly and adversary forces","Lister les hypothèses et les CCIR":"List assumptions and CCIR","Conduite (§ 3.2.2)":"Conduct (§ 3.2.2)","Le wargaming est un processus discipliné, fondé sur des règles. Chaque événement critique est joué en action, réaction, contre-réaction. La méthode s’applique aux opérations offensives, défensives et de stabilisation.":"Wargaming is a disciplined, rule-based process. Each critical event is played through action, reaction, counteraction. The method applies to offensive, defensive and stability operations.","Produits (§ 3.2.2)":"Products (§ 3.2.2)","COA affinés":"Refined COAs","Matrice de synchronisation complétée (nos forces synchronisées dans le temps, l’espace et le but face à un ACOA)":"Completed synchronisation matrix (our forces synchronised in time, space and purpose against an ACOA)","Gabarits et matrices d’aide à la décision pour chaque COA (décisions clés et actions probables pendant l’exécution)":"Decision support templates and matrices for each COA (key decisions and likely actions during execution)","Autres buts (§ 3.2.0)":"Other aims (§ 3.2.0)","Maximiser les effets en protégeant la force et en limitant les dommages collatéraux":"Maximise effects while protecting the force and minimising collateral damage","Affiner la visualisation de l’opération":"Refine the visualisation of the operation","Anticiper les événements":"Anticipate events","Identifier conditions et ressources nécessaires au succès":"Identify conditions and resources required for success","Décider quand et où employer les capacités":"Decide when and where to apply capabilities","Identifier les besoins de coordination":"Identify coordination needs","Déterminer le COA le plus souple":"Determine the most flexible COA","Le chef précise la forme d’analyse dans ses directives de planification (§ 3.2.1).":"The commander specifies the form of analysis in the planning guidance (§ 3.2.1).","Chaque phase jouée tient compte des effets de la précédente : pertes, retards, attrition, ruptures (§ 3.2.1).":"Each phase played takes into account the effects of the previous one: losses, delays, attrition, discontinuities (§ 3.2.1).","Le briefing d’analyse des COA est facultatif : le chef y approuve des changements, demande des affinements ou donne des directives pour la comparaison (§ 3.2.3).":"The COA analysis briefing is optional: the commander approves changes, requests refinements or gives guidance for comparison (§ 3.2.3).","L’analyse peut obliger à revoir un COA, voire à reprendre la planification (§ 3.2.0).":"Analysis may require revising a COA, or even restarting planning (§ 3.2.0).","Pour chaque événement critique, joue l’action amie, la réaction adverse et notre contre-réaction ; note le résultat et les décisions à prendre. Reporte ensuite les actions dans la matrice de synchronisation.":"For each critical event, play the friendly action, the adversary reaction and our counteraction; record the result and the decisions to be taken. Then transfer the actions to the synchronisation matrix.","ACOA":"ACOA","Événement critique":"Critical event","Réaction":"Reaction","Contre-réaction":"Counteraction","Résultat / ajustement":"Result / adjustment","Matrice de synchronisation – COA 1":"Synchronisation matrix – COA 1","GDH / lieu":"DTG / location","Condition (indicateur)":"Condition (indicator)","CCIR associé":"Related CCIR","Options du chef":"Commander’s options","Quel est le but de l’analyse des COA ?":"What is the purpose of COA analysis?","Identifier difficultés, besoins de coordination et conséquences probables de chaque COA":"Identify difficulties, coordination needs and probable consequences of each COA","Choisir le COA à présenter au chef":"Choose the COA to present to the commander","Rédiger l’ordre d’opération":"Write the operation order","Définir les critères d’évaluation":"Define the evaluation criteria","Comment joue-t-on chaque événement critique ?":"How is each critical event played?","Action, réaction, contre-réaction":"Action, reaction, counteraction","Fait, déduction, conclusion":"Fact, deduction, conclusion","Avantage, inconvénient, décision":"Advantage, disadvantage, decision","Ami, ennemi, neutre":"Friendly, enemy, neutral","Pour gagner du temps, contre quel ACOA peut-on se limiter ?":"To save time, against which ACOA can the analysis be limited?","Le plus probable":"The most likely","Le plus dangereux":"The most dangerous","Celui que le chef préfère":"The one the commander prefers","Aucun : il faut tous les jouer":"None: all must be played","Option facultative (§ 3.2.1).":"Optional (§ 3.2.1).","Quelles méthodes d’analyse APP-28 cite-t-il ?":"Which analysis methods does APP-28 cite?","Par bandes (belt), par cases (box), par axe dans la profondeur":"Belt, box, avenue in depth","Par phases, par fonctions, par niveaux":"By phase, by function, by level","Brainstorming, méthode « film », matrice":"Brainstorming, movie-method, matrix","Mentale, écrite, orale":"Mental, written, oral","Quels sont les produits du wargaming ?":"What are the products of wargaming?","COA affinés, matrice de synchronisation, gabarits et matrices d’aide à la décision":"Refined COAs, synchronisation matrix, decision support templates and matrices","Énoncé de mission et intention":"Mission statement and intent","Matrice de décision pondérée":"Weighted decision matrix","Ordre d’opération et calque":"Operation order and overlay","Qui précise la technique d’analyse à employer ?":"Who specifies the analysis technique to use?","Le chef, dans ses directives de planification":"The commander, in the planning guidance","Chaque cellule":"Each section","Le briefing d’analyse des COA est…":"The COA analysis briefing is…","facultatif":"optional","obligatoire et présenté par le chef":"mandatory and delivered by the commander","remplacé par le back brief":"replaced by the back-brief","présenté aux subordonnés":"delivered to subordinates","Une matrice de synchronisation montre…":"A synchronisation matrix shows…","comment nos forces sont synchronisées dans le temps, l’espace et le but face à un ACOA":"how our forces are synchronised in time, space and purpose against an ACOA","les avantages et inconvénients de chaque COA":"the advantages and disadvantages of each COA","les CCIR et leurs responsables":"the CCIR and who is responsible for them","la chronologie de planification de l’état-major":"the staff planning timeline","Étape 5 – Comparaison des COA":"Step 5 – COA comparison","Lequel ?":"Which one?","Comparer objectivement les COA, chacun évalué indépendamment selon les critères approuvés par le chef, pour identifier forces et faiblesses et retenir celui qui a la plus forte probabilité de succès (§ 3.3).":"Compare COAs objectively, each evaluated independently against the commander-approved criteria, to identify strengths and weaknesses and select the one with the highest probability of success (§ 3.3).","Avantages et inconvénients (§ 3.3.2)":"Advantages and disadvantages (§ 3.3.2)","Les experts de chaque fonction de combat analysent les avantages et inconvénients de chaque COA, à partir de la justification de l’étape 3, et désignent le COA qu’ils préfèrent pour leur fonction.":"The subject matter experts of each combat function analyse the advantages and disadvantages of each COA, using the rationale from step 3, and identify their preferred COA for their function.","Matrice de décision (§ 3.3.3, tableau 3-3)":"Decision matrix (§ 3.3.3, table 3-3)","Classer les COA de 1 à n pour chaque critère (1 = le plus favorable)":"Rank COAs from 1 to n for each criterion (1 = most favourable)","Le COS affecte un poids à chaque critère":"The COS assigns a weight to each criterion","Additionner les rangs non pondérés : premier total":"Add the unweighted ranks: first total","Multiplier chaque rang par le poids du critère et additionner : second total":"Multiply each rank by the criterion weight and add: second total","Le total le plus bas désigne le COA préféré ; comparer sur les deux totaux":"The lowest total designates the preferred COA; compare on both totals","Précautions (§ 3.3.3)":"Cautions (§ 3.3.3)","Les résultats reposent sur des jugements subjectifs":"Results rest on subjective judgments","La matrice n’est qu’une base partielle de décision":"The matrix is only a partial basis for decision","Comparer critère par critère est souvent plus utile que comparer les totaux":"Comparing criterion by criterion is often more useful than comparing totals","Changer les poids peut changer le COA préféré":"Changing weights may change the preferred COA","COA préféré de l’état-major (§ 3.3.4)":"Staff-preferred COA (§ 3.3.4)","Risque minimal pour la force et la mission":"Minimum risk to the force and the mission","Meilleure posture pour les opérations futures":"Best posture for future operations","Liberté d’action maximale aux subordonnés dans l’intention du supérieur":"Maximum freedom of action for subordinates within the superior’s intent","Souplesse maximale face aux menaces et opportunités imprévues":"Maximum flexibility against unexpected threats and opportunities","Moyens nécessaires, dont la disponibilité ou la constitution d’une réserve":"Required assets, including availability or establishment of a reserve","Effet de surprise":"Element of surprise","Environnement le plus sûr et stable pour les civils":"Most secure and stable environment for civilians","Meilleur appui aux thèmes et messages d’information":"Best support for information themes and messages","Si l’état-major ne s’accorde pas, le COS tranche.":"If the staff cannot agree, the COS decides.","Briefing de décision (§ 3.3.5)":"Decision briefing (§ 3.3.5)","L’état-major présente le COA qu’il préfère ; le COS souligne les changements apportés à chaque COA par l’analyse.":"The staff presents its preferred COA; the COS highlights the changes made to each COA by the analysis.","Dans la matrice d’APP-28, c’est le total le plus BAS qui l’emporte (rang 1 = le plus favorable).":"In the APP-28 matrix, the LOWEST total wins (rank 1 = most favourable).","On compare les COA réalisables pour trouver celui qui a la plus forte probabilité de succès face à l’ACOA le plus probable, au plus dangereux, ou pour la tâche de stabilisation la plus importante (§ 3.3.3).":"Feasible COAs are compared to find the one with the highest probability of success against the most likely ACOA, the most dangerous ACOA, or for the most important stability task (§ 3.3.3).","Ne pas tirer de conclusions d’un calcul fait sur des poids subjectifs.":"Do not draw conclusions from a calculation based on subjective weights.","Les critères et poids viennent de l’étape 2A (tableau « Critère d’évaluation »). Classe les COA pour chaque critère (1 = le meilleur) : l’outil calcule les totaux non pondéré et pondéré. Note ensuite les avantages et inconvénients et le COA préféré de l’état-major.":"Criteria and weights come from step 2A (“Evaluation criterion” table). Rank the COAs for each criterion (1 = best): the tool computes the unweighted and weighted totals. Then note the advantages and disadvantages and the staff-preferred COA.","COA préféré de l’état-major et justification":"Staff-preferred COA and rationale","Dans la matrice de décision d’APP-28, quel COA est préféré ?":"In the APP-28 decision matrix, which COA is preferred?","Celui dont le total est le plus bas":"The one with the lowest total","Celui dont le total est le plus élevé":"The one with the highest total","Celui qui a le plus de « + »":"The one with the most “+”","Celui que préfère le G3":"The one the G3 prefers","Rang 1 = le plus favorable (§ 3.3.3).":"Rank 1 = most favourable (§ 3.3.3).","Qui affecte les poids aux critères ?":"Who assigns weights to the criteria?","§ 3.3.3 ; le chef peut les ajuster (§ 2.4.5).":"§ 3.3.3; the commander may adjust them (§ 2.4.5).","Selon APP-28, la matrice de décision…":"According to APP-28, the decision matrix…","n’est qu’une base p r l’analyse":"The changes made to each COA by the analysis","La chronologie de planification":"The planning timeline","L’intention de niveau N+2":"The intent two levels up","Phase 3 – Communiquer":"Phase 3 – Communication","Étape 6 – Décision du chef":"Step 6 – Commander’s decision","Je décide":"I decide","Le chef retient le COA qui, selon son jugement et son expérience, remplit le mieux la mission, puis donne ses directives finales de planification (§ 4.1).":"The commander selects the COA that, in their judgement and experience, best accomplishes the mission, then issues final planning guidance (§ 4.1).","Décider (§ 4.1.0)":"Deciding (§ 4.1.0)","Si tous les COA sont rejetés, l’état-major reprend la phase 2":"If all COAs are rejected, the staff starts phase 2 anew","Si le chef modifie un COA ou en propose un tout autre, l’état-major l’analyse et présente les résultats avec une recommandation":"If the commander modifies a COA or gives an entirely different one, the staff analyses it and presents the results with a recommendation","Directives finales de planification (§ 4.1.1)":"Final planning guidance (§ 4.1.1)","Intention du chef affinée, si besoin":"Refined commander’s intent, if necessary","Nouveaux CCIR pour l’exécution":"New CCIR to support execution","Directives sur la préparation des ordres et les répétitions":"Guidance on orders preparation and rehearsals","Priorités de ressources qui préservent la liberté d’action et assurent un soutien continu":"Resource priorities that preserve freedom of action and ensure continuous sustainment","Back brief au chef supérieur (§ 4.1.1)":"Back-brief to the higher commander (§ 4.1.1)","Si le temps le permet, ou si le supérieur l’ordonne, le chef rend compte au chef supérieur, notamment des risques qui pourraient compromettre la mission de ce dernier. Il en discute si possible au préalable avec les chefs voisins et subordonnés. Il lui faut l’accord du supérieur pour accepter un tel risque.":"If time allows, or if the superior rix","un document diffusé aux subordonnés":"a document issued to subordinates","le gabarit d’aide à la décision du supérieur":"the superior’s decision support template","Quels types de répétitions APP-28 cite-t-il ?":"Which types of rehearsals does APP-28 cite?","Back briefs, répétitions interarmes (feux), répétitions d’appui":"Back-briefs, combined arms (fires) rehearsals, support rehearsals","Répétitions sur carte uniquement":"Map rehearsals only","Répétitions des seuls subordonnés":"Rehearsals by subordinates only","Répétitions de transmissions":"Signals rehearsals","Voir ATP-3.2.2 annexe F (§ 4.2.6).":"See ATP-3.2.2 annex F (§ 4.2.6).","Planifier en temps contraint":"Planning in a time-constrained environment","Savoir abréger la planification tactique quand le temps manque, sans perdre sa cohérence (chapitre 5).":"Know how to abbreviate tactical planning when time is short, without losing coherence (chapter 5).","Responsabilités (§ 5.1)":"Responsibilities (§ 5.1)","Le temps est une ressource non renouvelable, souvent la plus critique":"Time is a non-renewable and often the most critical resource","Le chef décide comment abréger la planification, par ses directives à l’état-major ; il évite de changer ses directives, car chaque changement coûte du temps":"The commander decides how to abbreviate planning, through guidance to the staff, and avoids changing that guidance, because each change costs time","L’état-major tient ses estimations permanentes aussi à jour que possible : plus le temps manque, plus on s’appuie sur elles et sur les produits existants":"The staff keeps running estimates as current as possible: the shorter the time, the more it relies on them and on existing products","Techniques pour gagner du temps (§ 5.2.1)":"Time-saving techniques (§ 5.2.1)","Le chef s’implique davantage dans la planification":"The commander increases their involvement in planning","Le chef limite le développement, l’analyse ou la comparaison des COA (moins de COA, moins de d function tr(s){
  if(LANG==="fr"||typeof s!=="string")return s;
  const D=I18N[LANG],m=s.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];

  if(r==null)r=trParts(core);
  return r==null?s:m[1]+r+m[3];
}
/* Textes composés à l'affichage (« 3. question », « Phase 2 – titre · référence ») : traduction par morceaux */
const TR_SEPS=[" · "," – "," → "," ; "," : "];
function trParts(c){
  const D=I18N[LANG];const one=x=>{if(!x.trim()||!/[A-Za-zÀ-ÿ]/.test(x))return x;if(D[x]!=null)return D[x];
    const nums=[];const k=x.replace(/\d+(?:[.,]\d+)?/g,y=>{nums.push(y);return "{n}";});if(nums.length&&D[k]!=null){let i=0;return D[k].replace(/\{n\}/g,()=>nums[i++]??"");}return null;};
  const p=c.match(/^([\d.()]+\s+|[★▶✓✗•]\s*)([\s\S]+)$/);if(p){const r=one(p[2])??trParts(p[2]);if(r!=null)return p[1]+r;}
  for(const sp of TR_SEPS){if(!c.includes(sp))continue;const parts=c.split(sp);let hit=0;
    const out=parts.map(x=>{const r=one(x)??trParts(x);if(r!=null&&r!==x)hit++;return r??x;});if(hit)return out.join(sp);}
  return null;
}
const TR_ATTRS=["placeholder","title","aria-label","alt","data-l"],TR_SET=new WeakMap();
function trEl(el){for(const a of TR_ATTRS){const v=el.getAttribute&&el.getAttribute(a);if(v){const t=tr(v);if(t!==v)el.setAttribute(a,t);}}}
function trNode(root){
  if(LANG==="fr"||!root)return;
  if(root.nodeType===3){const v=root.nodeValue;if(v.trim()&&TR_SET.get(root)!==v){const p=root.parentNode;if(p&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName))return;const t=tr(v);if(t!==v){TR_SET.set(root,t);root.nodeValue=t;}}return;}

  if(root.nodeType===1){if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(root.nodeName))return;trEl(root);}
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const L=[];while((n=w.nextNode()))L.push(n);L.forEach(trNode);
  if(root.querySelectorAll)root.querySelectorAll("[placeholder],[title],[aria-label],[alt],[data-l]").forEach(trEl);

   Source : APP-28 Edition A Version 1 (21 novembre 2019), « Tactical Planning for Land Forces ».

   sont des propositions de l'auteur de l'outil, pas une traduction officielle. */

{id:"vocab",grp:"Démarrer",title:"Vocabulaire d’APP-28",
 intro:"Avant d’entrer dans la méthode, il faut parler la même langue que l’état-major. Retourne chaque carte pour vérifier la définition, puis passe au test. Le terme OTAN (anglais) est donné entre parenthèses.",
 cards:[
 ["Tâche (task)","Action ou activité clairement définie, confiée à une personne ou à une organisation par une autorité compétente. Le « quoi » d’un énoncé de mission est toujours une tâche (§ 2.4.2.3)."],
 ["Tâche spécifiée (specified task)","Tâche confiée explicitement par l’échelon supérieur : en général au paragraphe 3 de l’ordre, parfois aux paragraphes 4 et 5, dans les annexes, les calques, ou oralement (§ 2.4.2.3)."],
 ["Tâche implicite (implied task)","Tâche à exécuter pour accomplir une tâche spécifiée ou la mission, mais non énoncée dans l’ordre du supérieur. On la déduit de l’analyse du plan du supérieur, de l’ennemi, du terrain, des considérations civiles et des exigences doctrinales (§ 2.4.2.3)."],
 ["Tâche essentielle (essential task)","Tâche spécifiée ou implicite qui doit être exécutée pour réussir la mission. Elle figure toujours dans l’énoncé de mission de l’unité (§ 2.4.2.3)."],
 ["Mission sur ordre (on-order mission)","Mission à exécuter à un moment futur non précisé, sur ordre. Une unité qui en est chargée est une force engagée : elle planifie, répartit ses moyens, s’articule et se positionne à l’avance (§ 2.4.2.3)."],
 ["Mission « être en mesure de » (be-prepared mission)","Mission de circonstance, exécutée selon le résultat d’une action précédente. Elle est planifiée après toute mission sur ordre (§ 2.4.2.3)."],
 ["Contrainte (constraint)","Limitation imposée par un chef supérieur : ce que l’unité doit faire (une obligation). Elle restreint la liberté d’action (§ 2.4.2.4)."],
 ["Restriction (restraint)","Limitation imposée par un chef supérieur : ce que l’unité ne doit pas faire (une interdiction). Elle restreint la liberté d’action (§ 2.4.2.4)."],
 ["Fait (fact)","Information tenue pour vraie à un moment donné ; base de la compréhension de la situation (§ 2.4.2.5)."],
 ["Hypothèse (assumption)","Supposition sur la situation actuelle ou sur des événements futurs, admise sans preuve, nécessaire pour achever l’estimation et décider d’un mode d’action. Elle doit être remplacée par des faits dès que possible (§ 2.4.2.5)."],
 ["Risque (risk)","Mesure dans laquelle des incertitudes et des événements possibles peuvent affecter les objectifs. Il se mesure par la probabilité de la menace, la vulnérabilité de la cible et l’impact. Il peut être réduit, ou accepté comme risque calculé (§ 2.4.2.6)."],
 ["Point critique (critical point)","Situation que l’unité ne peut pas résoudre avec ses propres moyens et qui rend la mission irréalisable : elle exige l’appui de l’échelon supérieur (§ 2.4.2.6)."],
 ["Opportunité (opportunity)","Moment ou circonstance qui rend quelque chose possible ; elle ouvre des modes d’action et peut permettre d’atteindre l’objectif plus tôt ou plus facilement (§ 2.4.2.6)."],
 ["Critères GO / NO-GO","NO-GO : conditions qui arrêtent la mission avant son début. GO : conditions pour déclencher une opération, ou une branche ou une suite planifiée (§ 2.4.2.7)."],
 ["Abandon (abort) et caveat","Abandon : arrêt d’une mission pour toute raison autre que l’action ennemie, entre son début et son achèvement. Caveat : limitation fixée par une nation à ses forces sous commandement OTAN (§ 2.4.2.7)."],
 ["CCIR","Besoins en informations critiques du chef (commander’s critical information requirements) : lacunes d’information critiques pour le succès de la mission ou révélant une menace critique. Ils comprennent les PIR, les FFIR et les EEFI (§ 2.5.7)."],
 ["PIR, FFIR, EEFI","PIR : besoins prioritaires en renseignement, tirés des CCIR. FFIR : informations sur nos forces et les forces en appui, gérées par le G3. EEFI : informations à protéger, et non à rechercher (§ 2.5.7)."],
 ["Énoncé de mission (mission statement)","Phrase courte qui donne la tâche essentielle et le but, en cinq éléments : qui, quoi (tâche essentielle), quand, où, pourquoi (but) (§ 2.4.3)."],
 ["Intention du chef (commander’s intent)","Énoncé clair et concis de ce que la force doit faire et des conditions à remplir pour réussir, au regard de l’ennemi, du terrain et de l’état final recherché. Elle comprend en général le but, les tâches clés et l’objectif (§ 2.4.4)."],
 ["Critères d’évaluation (evaluation criteria)","Normes qui servent ensuite à mesurer l’efficacité et l’efficience relatives des modes d’action. Ils sont choisis dès l’analyse de l’ordre pour éviter les biais (§ 2.4.5)."],
 ["IPOE","Préparation du renseignement de l’environnement opérationnel : analyse systématique de l’adversaire, du terrain et de la météo dans une zone d’intérêt pour en déterminer les effets probables sur les opérations (§ 2.5.3)."],
 ["Estimation permanente (running estimate)","Évaluation tenue à jour par chaque cellule d’état-major : faits, hypothèses, conclusions et recommandations (§ 1.3.4 et 2.2.5)."],
 ["Centre de gravité tactique (tactical COG)","Entité principale dotée des capacités critiques nécessaires pour atteindre un objectif ; en général un élément subordonné dont la neutralisation réduit fortement la capacité de l’ensemble. Il s’analyse en capacités, besoins et vulnérabilités critiques (§ 2.6.2)."],
 ["Mode d’action (COA)","Course of action : le « comment » de l’accomplissement de la mission. Les modes d’action amis sont comparés aux modes d’action adverses (ACOA) (§ 3.1)."],
 ["Ordres de type mission (mission-type orders)","Ordres qui donnent la mission sans prescrire la façon de l’exécuter ; ils mettent l’accent sur le but et restent aussi brefs que la situation le permet (§ 1.2.3)."]
 ],
 vig:["Les équivalents français des termes OTAN (tâche implicite, restriction, estimation permanente…) sont des propositions de cet outil, pas une traduction officielle : en état-major multinational, utilise le terme anglais.",
      "Contrainte et restriction ne se confondent pas : la contrainte est une obligation (« doit faire »), la restriction une interdiction (« ne doit pas faire »).",
      "Une hypothèse n’est pas un fait : elle doit être vérifiée et remplacée par un fait dès que possible, et rappelée avant toute décision.",
      "Point critique et risque ne se confondent pas : le point critique dépasse nos moyens et appelle l’échelon supérieur."],
 apply:[{t:"note",x:"Entraîne-toi au modèle à trois colonnes (§ 2.6.2, tableau 2-2) : pour chaque facteur, hypothèse ou question, écris la déduction qui y répond, puis la conclusion (tâche, demande d’information, demande de précision au supérieur ou directive du chef)."},
        {t:"table",id:"fdc",cols:[{k:"f",l:"Facteur, hypothèse ou question",ph:"Ex. : le pont X est le seul franchissement pour les véhicules lourds"},{k:"d",l:"Déduction",ph:"Ex. : sa perte bloquerait notre progression"},{k:"c",l:"Conclusion",ph:"Ex. : faire reconnaître et garder le pont X"},{k:"y",l:"Type de conclusion",o:TCIDR_TYPES}]}],
 quiz:[
 {q:"Une contrainte (constraint), c’est…",o:["ce que l’unité doit faire, imposé par le chef supérieur","ce que l’unité ne doit pas faire, imposé par le chef supérieur","une supposition admise sans preuve","une situation que l’unité ne peut pas résoudre seule"],a:0,e:"Contrainte = obligation ; restriction (restraint) = interdiction ; la supposition est une hypothèse ; la situation insoluble avec nos moyens est un point critique (§ 2.4.2.4 et 2.4.2.6)."},
 {q:"Une tâche implicite (implied task) est…",o:["nécessaire à la mission mais non énoncée dans l’ordre du supérieur","confiée explicitement au paragraphe 3 de l’ordre du supérieur","exécutée au moment où le supérieur en donne l’ordre","une tâche qui ne figure jamais dans l’énoncé de mission"],a:0,e:"Elle se déduit de l’analyse du plan du supérieur, de l’ennemi, du terrain, des considérations civiles et de la doctrine (§ 2.4.2.3)."},
 {q:"Une tâche essentielle (essential task)…",o:["figure toujours dans l’énoncé de mission de l’unité","est toujours une tâche spécifiée","n’est connue qu’après la décision du chef","est une mission « être en mesure de »"],a:0,e:"Elle peut être spécifiée ou implicite ; elle doit être exécutée pour réussir et figure toujours dans l’énoncé de mission (§ 2.4.2.3)."},
 {q:"Que deviennent les hypothèses au fil de la planification ?",o:["Elles sont remplacées par des faits dès que possible et revérifiées avant les décisions","Elles deviennent des contraintes une fois validées par le chef","Elles sont figées dès la réception de la mission","Elles ne concernent que l’ennemi"],a:0,e:"Les hypothèses clés sont listées et revérifiées avant les jugements et décisions (§ 2.4.2.5)."},
 {q:"Un point critique (critical point) est…",o:["une situation insoluble avec nos propres moyens, qui exige l’appui de l’échelon supérieur","un lieu dont la possession donne un avantage marqué","le moment où le rapport de forces bascule","un risque accepté par le chef"],a:0,e:"Il rend la mission irréalisable sans l’échelon supérieur (§ 2.4.2.6)."},
 {q:"Que comprennent les CCIR selon APP-28 ?",o:["PIR, FFIR et EEFI","PIR et RFI seulement","Les seules informations à protéger","Les critères GO / NO-GO"],a:0,e:"Certaines nations ne rangent pas les EEFI parmi les CCIR (§ 2.5.7)."},
 {q:"Les EEFI sont…",o:["des informations à protéger, et non à rechercher","des informations sur nos forces, gérées par le G3","des besoins prioritaires en renseignement","des demandes d’information au supérieur"],a:0,e:"Leur compromission compromettrait la mission ; l’adversaire est susceptible de les rechercher (§ 2.5.7)."},
 {q:"Combien d’éléments comporte l’énoncé de mission ?",o:["Cinq : qui, quoi, quand, où, pourquoi","Trois : tâche, but, délai","Quatre : qui, quoi, comment, pourquoi","Six : qui, quoi, comment, quand, où, pourquoi"],a:0,e:"Les six éléments (avec « comment ») décrivent le mode d’action simplifié du chapitre 5, pas l’énoncé de mission (§ 2.4.3 et 5.2.1)."},
 {q:"Pourquoi choisir les critères d’évaluation dès l’analyse de l’ordre ?",o:["Pour éviter les biais lors de la comparaison des modes d’action","Parce qu’ils figurent dans l’ordre du supérieur","Pour pouvoir les communiquer aux subordonnés dans l’ordre d’avertissement","Parce qu’ils remplacent l’intention du chef"],a:0,e:"Ils mesurent ensuite l’efficacité et l’efficience relatives des COA (§ 2.4.5)."},
 {q:"Une restriction (restraint), c’est…",o:["ce que l’unité ne doit pas faire","ce que l’unité doit faire","une limitation qu’une nation impose à ses forces","une condition d’arrêt de la mission"],a:0,e:"La limitation nationale est un caveat ; la condition d’arrêt avant le début est un critère NO-GO (§ 2.4.2.4 et 2.4.2.7)."}
 ]},

{id:"fond",grp:"Démarrer",title:"Fondements de la planification tactique",
 but:"Situer la planification tactique d’APP-28 dans le commandement par la mission, le processus des opérations et l’approche manœuvrière, et connaître les rôles du chef, du chef d’état-major et de l’état-major (chapitre 1).",
 sections:[
 {h:"Commandement par la mission (§ 1.1.2)",l:["Intention du chef","Initiative des subordonnés","Ordres de type mission","Allocation adaptée des ressources"],p:"Exécution décentralisée par des ordres de type mission, centrée sur l’objectif de l’opération et non sur la manière."},
 {h:"Processus des opérations (§ 1.1.3)",p:"Quatre activités cycliques qui se chevauchent : planifier, préparer, exécuter, évaluer. La préparation commence en général avec un ordre d’avertissement (WNGO). La planification tactique s’harmonise avec celle de l’échelon supérieur."},
 {h:"Approche manœuvrière (§ 1.1.4)",p:"Approche indirecte qui vise la cohésion et la volonté de l’ennemi plutôt que ses seules forces physiques. Elle cherche à saisir, conserver et exploiter l’initiative, combine moyens létaux et non létaux, et donne sa pleine mesure avec le commandement par la mission."},
 {h:"Plans et ordres (§ 1.2)",l:["Trois horizons de planification (court, moyen, long terme), relatifs à chaque niveau","Des ordres d’avertissement fréquents permettent la planification parallèle avec les subordonnés","Un plan est un cadre d’adaptation, pas un script : la planification se poursuit pendant la préparation et l’exécution","L’OPLAN est mis en exécution par l’OPORD ; le FRAGO sert quand la planification est brève","Ordres de type mission : format OTAN en cinq paragraphes ; les tâches des subordonnés disent qui, quoi, quand, où et pourquoi, en insistant sur le but"]},
 {h:"Structure : 3 phases, 7 étapes (§ 1.3.1 et 2.1)",l:["Phase 1 – Comprendre la situation et le problème : étape 1 Réception de la mission ; étape 2 Analyse de la mission (2A Analyse de l’ordre, 2B Évaluation des facteurs)","Phase 2 – Concevoir et développer les modes d’action : étape 3 Développement des COA ; étape 4 Analyse des COA ; étape 5 Comparaison des COA","Phase 3 – Communiquer : étape 6 Décision du chef ; étape 7 Production, diffusion des ordres et transition"],p:"Les étapes se déroulent en général dans l’ordre mais peuvent être reprises. Les estimations permanentes et l’IPOE se poursuivent tout au long."},
 {h:"Les sept fonctions de combat (§ 1.3.1)",l:["Commandement","Renseignement","Feux","Manœuvre","Protection","Activités d’information","Soutien"]},
 {h:"Rôles (§ 1.3.2 à 1.3.4)",l:["Le chef conduit la planification : intention initiale, directives de planification, décisions clés. Il comprend, visualise et décrit l’opération","Le chef d’état-major (COS) est le principal assistant du chef : il dirige, coordonne et fixe les horaires et lieux des briefings","L’état-major aide le chef à comprendre, décider et traduire ses décisions en plans et en ordres ; il tient les estimations permanentes"]},
 {h:"Adapter la planification (§ 1.3.5)",p:"La profondeur de la planification dépend du temps, des ressources, de l’expérience et de la situation. La planification complète est la norme pour une nouvelle mission. En temps contraint, le chef ne fait conduire que ce qui sert ses décisions ; en situation extrêmement comprimée, on recourt à la décision intuitive (chapitre 5 et annexe F)."}
 ],

{id:"s1",grp:"Phase 1 – Comprendre la situation et le problème",title:"Étape 1 – Réception de la mission",qtag:"Alerter, se préparer",
 but:"Alerter l’état-major et les subordonnés, et préparer l’analyse de la mission (§ 2.2). L’étape commence à la réception d’une nouvelle mission ou à un changement de situation, éventuellement dès un ordre d’avertissement, avant l’OPORD complet.",
 sections:[
 {h:"Activités dans l’ordre (§ 2.2.2 à 2.2.10)",l:["Alerter l’état-major et les acteurs clés (selon les SOP ; organisations militaires, civiles et du pays hôte si besoin)","Se préparer à planifier : réunir les estimations permanentes, les produits de renseignement du supérieur, les ordres, cartes et calques, les SOP et la doctrine (AAP-06, AAP-15, AAP-39, APP-6, ATP-3.2.1)","Lancer l’IPOE : évaluation de la zone (terrain, météo) et des acteurs (organisation, doctrine, vulnérabilités de l’adversaire)","Mettre à jour les estimations permanentes : faits, hypothèses, ennemi, terrain et météo, troupes et appuis, temps, considérations civiles ; conclusions et recommandations","Estimer la chronologie de la mission","Estimer la chronologie de planification de l’état-major","Briefing de réception de la mission","Directives initiales de planification du chef","Ordre d’avertissement initial"]},
 {h:"Chronologie de la mission (§ 2.2.6)",p:"Lister toutes les actions nécessaires à rebours depuis le point final et leur affecter des durées ; si l’heure H est donnée, partir d’elle. Prendre en compte la durée de la mission, l’environnement (saison, jour et nuit, phases de la lune), les dates critiques et les restrictions."},
 {h:"Règle du tiers / deux tiers (§ 2.2.7)",p:"En règle générale, le chef garde un tiers du temps disponible pour sa propre planification et laisse les deux tiers à ses subordonnés. Le temps est le facteur principal du niveau de détail. Le COS établit la chronologie de planification de l’état-major : temps de chaque étape, échéances des produits, responsables et destinataires."},
 {h:"Directives initiales de planification (§ 2.2.9)",l:["Approuver la chronologie de la mission et de la planification","Méthodes pour abréger la planification, si besoin","Coordinations nécessaires, dont l’échange d’officiers de liaison","Besoins en information","Mouvements autorisés et lancement de la recherche du renseignement","Tâches supplémentaires de l’état-major"]},
 {h:"Ordre d’avertissement initial (§ 2.2.10)",p:"Dernière activité de l’étape 1, au format de l’ATP-3.2.2 (annexe G, appendice 1). Contenu minimal : type d’opération, localisation générale, chronologie initiale, mouvements ou recherche du renseignement à lancer."}
 ],

{id:"s2a",grp:"Phase 1 – Comprendre la situation et le problème",title:"Étape 2A – Analyse de l’ordre",qtag:"Quoi ? Pourquoi ?",
 but:"Comprendre la mission reçue : ce qui doit être accompli, quand, où et surtout pourquoi (§ 2.4). L’analyse de la mission se définit (AAP-39) comme le processus logique qui extrait et déduit des ordres du supérieur les tâches nécessaires à la mission ; son produit est un énoncé de mission clair et concis.",
 sections:[
 {h:"Activités (§ 2.4.1)",l:["Analyser l’ordre du chef de niveau N+1","Rédiger l’énoncé de mission reformulé","Formuler l’intention initiale du chef","Donner des directives de planification complémentaires","Faire le briefing à l’état-major"],p:"L’état-major commence l’évaluation des facteurs (2B) en parallèle."},
 {h:"Ce qu’on analyse dans l’ordre du supérieur (§ 2.4.2)",l:["Intention du chef de niveau N+2 ; mission, intention et concept du niveau N+1","Rôle de l’unité dans le plan d’ensemble ; missions des voisins","Tâches spécifiées, implicites et essentielles","Contraintes et restrictions","Faits et hypothèses critiques","Risques, opportunités et points critiques","Comment la situation pourrait évoluer","Critères GO / NO-GO et d’abandon","CCIR, EEFI, autres demandes d’information et de précision"]},
 {h:"Énoncé de mission (§ 2.4.3)",l:["Qui exécute","Tâche essentielle (quoi)","Quand (heure, événement ou durée)","Où (zone, objectif, coordonnées)","Pourquoi (but)"]},
 {h:"Intention initiale du chef (§ 2.4.4)",p:"Facile à retenir et comprise deux niveaux en dessous. Elle comprend en général le but, les tâches clés et l’objectif (état final). Trois buts : orienter l’état-major ; permettre aux subordonnés d’atteindre l’objectif sans nouvel ordre, même si le plan change ; les guider pour exploiter des opportunités fugaces."},
 {h:"Directives complémentaires et critères d’évaluation (§ 2.4.5)",p:"Le chef livre l’essentiel de sa vision et peut préciser les modes d’action à étudier ou à écarter. Il fixe les critères d’évaluation dès ce moment, pour éviter les biais. Le COS les pondère d’abord selon leur importance relative et les directives du chef, qui peut les ajuster. Le tableau 2-1 donne des exemples de directives par fonction de combat (ni exhaustifs ni obligatoires)."}
 ],

{id:"s2b",grp:"Phase 1 – Comprendre la situation et le problème",title:"Étape 2B – Évaluation des facteurs",qtag:"Dans quelle situation ?",
 but:"Analyser la situation par rapport à la mission de l’unité (§ 2.5), présenter le briefing d’analyse de la mission, diffuser l’ordre d’avertissement et rendre compte au supérieur par le back brief initial, qui clôt la phase 1.",
 sections:[
 {h:"Activités (§ 2.5.1)",l:["Analyse de l’ordre et des annexes par chaque cellule","IPOE : terrain et météo ; capacités de l’adversaire et des autres acteurs ; environnement civil (PMESII) ; considérations civiles (ASCOPE)","Revue des troupes et appuis disponibles","Revue du temps disponible","Identification des risques et début de l’évaluation des risques","Élaboration des CCIR","Plan initial de recherche du renseignement (ICP)","Briefing d’analyse de la mission","Directives de planification complémentaires","Ordre d’avertissement","Back brief initial du chef"]},
 {h:"IPOE (§ 2.5.3)",p:"Analyse systématique de l’adversaire, du terrain et de la météo dans une zone d’intérêt. Elle commence en analyse de la mission et se poursuit jusqu’à la production de l’OPORD. Le renseignement achève son estimation et élabore les modèles de modes d’action adverses (ACOA). Autres produits : PIR, calque combiné des obstacles, liste des cibles de haute valeur (HVT), gabarits d’événements non affinés."},
 {h:"Troupes et appuis (§ 2.5.4)",p:"Examiner les ajouts et retraits de l’articulation, les relations de commandement et de soutien, les capacités et limites de toutes les unités. Vérifier que les moyens suffisent pour toutes les tâches ; demander au supérieur ce qui manque. Option : analyse du centre de gravité de nos forces pour repérer nos vulnérabilités critiques."},
 {h:"CCIR (§ 2.5.7)",l:["PIR : besoins prioritaires en renseignement, tirés des CCIR ; peu nombreux, cohérents avec ceux des autres niveaux, liés à une décision du chef","FFIR : informations sur nos forces et les forces en appui, gérées par le G3","EEFI : informations à protéger, et non à rechercher"]},
 {h:"Ordre d’avertissement (§ 2.6)",l:["Énoncé de mission approuvé","Intention initiale du chef","Changements d’articulation","Zone d’opérations","Produits et calques d’IPOE, dont les CCIR","Directives de réduction des risques","Priorités par fonction de combat","Directives de déception","Plan initial de recherche","Mouvements ou actions à lancer","Chronologie opérationnelle mise à jour"]},
 {h:"Back brief initial (§ 2.6.1)",p:"Il clôt la phase 1 : le chef subordonné rend compte au chef supérieur pour confirmer une compréhension commune de la mission et de l’intention. Il peut demander ou justifier des moyens supplémentaires, proposer des amendements aux mesures de coordination, demander la mise en œuvre ou la délégation de règles d’engagement, demander des précisions et exprimer ses préoccupations majeures (risques, points critiques)."},
 {h:"Outils (§ 2.6.2)",l:["Analyse du centre de gravité tactique (facultative) : capacités critiques, besoins critiques, vulnérabilités critiques ; les vulnérabilités ennemies sont des points d’application, les nôtres guident la protection","Modèle à trois colonnes (tableau 2-2) : facteur / déduction / conclusion"]}
 ],

{id:"s3",grp:"Phase 2 – Concevoir et développer les modes d’action",title:"Étape 3 – Développement des COA",qtag:"Comment ?",
 but:"Développer un ou plusieurs modes d’action, le « comment » de la mission, assez détaillés pour être confrontés aux modes d’action adverses (§ 3.1). Entrées : énoncé de mission, intention, directives de planification, conclusions de l’IPOE et de l’évaluation des facteurs.",
 sections:[
 {h:"Activités dans l’ordre (§ 3.1.1)",l:["Évaluer la puissance de combat relative","Générer des options","Établir un cadre d’opération","Articuler les forces","Attribuer les tâches (et, si besoin, les états-majors)","Rédiger l’énoncé et le croquis de chaque COA","Valider les COA","Présenter le briefing des COA","Retenir ou modifier les COA pour la suite"]},
 {h:"Puissance de combat relative (§ 3.1.2)",p:"Estimation grossière des rapports de forces des formations de manœuvre deux niveaux en dessous, en comparant nos forces aux faiblesses adverses et inversement, pour chaque élément de la puissance de combat. Elle ne doit pas reposer sur les seuls ratios mathématiques : elle est largement subjective et pèse aussi les facteurs immatériels (moral, entraînement)."},
 {h:"Générer des options (§ 3.1.3)",l:["Brainstorming : la gamme de choix la plus large, sans biais","Méthode « film » (movie-method) : enchaîner nos actions de la situation actuelle au résultat voulu (ou à rebours)","Wargaming : la méthode « film » avec les actions et réactions adverses"],p:"Un bon COA doit faire échec à tous les ACOA réalisables."},
 {h:"Cadres d’opération (§ 3.1.4)",l:["Géographique : profondeur (deep), contact (close), arrière (rear)","Par le but : opération décisive (décrite en premier, imbriquée dans le concept du supérieur), opérations de modelage (shaping), opérations de soutien (sustaining)"],p:"APP-28 cite quatre cadres (puissance de combat, géographique, fonctionnel, opérationnel) : l’important est que leur sens soit partagé."},
 {h:"Ratios minimaux de planification (§ 3.1.5, tableau 3-1)",l:["Retarder : 1 contre 6","Défendre une position préparée ou fortifiée : 1 contre 3","Défendre une position hâtive : 1 contre 2,5","Attaquer une position préparée ou fortifiée : 3 contre 1","Attaquer une position hâtive : 2,5 contre 1","Contre-attaquer de flanc : 1 contre 1"],p:"Articuler d’abord l’opération décisive, puis les opérations de modelage et de soutien, avec des unités génériques deux niveaux en dessous. En cas de déficit : demander des moyens, accepter un risque dans une partie de la zone, ou enchaîner les tâches au lieu de les mener simultanément."},
 {h:"Contenu d’un COA (§ 3.1.7)",l:["Intention initiale du chef","Cadre conceptuel","Schéma de manœuvre, dont l’effort principal","Schéma des feux, concept du génie, opérations d’information","Risques et points critiques identifiés","Événements critiques et transitions de phase","Réserve : désignation, emplacement, composition","Concept de recherche des CCIR","Tâches de stabilisation essentielles","Zones d’opérations des subordonnés","Déception (à diffusion restreinte)","Mesures de coordination clés"],p:"Chaque COA reçoit un nom caractéristique."},
 {h:"Critères de validation (§ 3.1.7)",l:["Adapté (suitable) : atteint le but, conforme à l’intention et aux directives","Réalisable (feasible) : dans le temps, l’espace et les moyens disponibles","Acceptable : proportionné, vaut son coût, conforme au droit des conflits armés","Distinct (unique) : nettement différent des autres COA (l’AJP-5 parle d’« exclusivité »)","Souple (flexible) : laisse des options au chef"]}
 ],
 canevas:["IPOE mise à jour, centrée au minimum sur les ACOA le plus probable et le plus dangereux","Modes d’action adverses, autant que nécessaire ou que le chef le demande","Intention du chef de niveau N+2","Énoncé de mission approuvé","Intention du chef","Énoncé et croquis de chaque COA, avec les matrices de synchronisation mises à jour","Justification de chaque COA : effets sur les ACOA, événements critiques, puissance de combat relative, articulation et mesures de coordination, impact sur l’environnement civil, faits et hypothèses nouveaux ou mis à jour"],
 vig:["Les ratios du tableau 3-1 sont des minimums historiques de planification, pas une règle de décision : vérifie aussi les facteurs immatériels (§ 3.1.5).",
      "Si tous les COA sont rejetés, l’état-major recommence ; le chef peut aussi combiner des éléments de plusieurs COA (§ 3.1.9).",
      "Certaines nations attribuent les états-majors dès cette étape ; d’autres en laissent la prérogative au chef à l’étape 6 (§ 3.1.6)."],
 apply:[{t:"note",x:"Évalue d’abord la puissance de combat relative, puis rédige au moins deux COA nettement différents. Teste chacun selon les cinq critères de validation avant de préparer le briefing des COA."},

  {t:"fields",id:"coa",f:[{k:"fw",l:"Cadre d’opération retenu (opération décisive, modelage, soutien ; ou profondeur, contact, arrière)",a:1},{k:"c1t",l:"COA 1 – nom caractéristique"},{k:"c1",l:"COA 1 – énoncé (effort principal, efforts secondaires, réserve, enchaînement)",a:1},{k:"c2t",l:"COA 2 – nom caractéristique"},{k:"c2",l:"COA 2 – énoncé",a:1},{k:"c3t",l:"COA 3 – nom caractéristique (facultatif)"},{k:"c3",l:"COA 3 – énoncé (facultatif)",a:1}]},
