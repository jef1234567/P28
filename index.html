  {t:"canevas"},{t:"tcidr"},{t:"frise"}],
 quiz:[
 {q:"Quelle est la première activité du développement des COA ?",o:["Évaluer la puissance de combat relative","Générer des options","Articuler les forces","Rédiger l’énoncé du COA"],a:0,e:"§ 3.1.1."},
 {q:"À quel niveau fait-on l’estimation des rapports de forces ?",o:["Les formations de manœuvre deux niveaux en dessous","Le même niveau que le planificateur","Un niveau au-dessus","Toutes les unités jusqu’au groupe"],a:0,e:"§ 3.1.2."},
 {q:"Ratio minimal pour attaquer une position préparée ou fortifiée ?",o:["3 contre 1","2,5 contre 1","1 contre 1","6 contre 1"],a:0,e:"Tableau 3-1 (§ 3.1.5)."},
 {q:"Ratio minimal pour défendre une position préparée ou fortifiée ?",o:["1 contre 3","1 contre 2,5","1 contre 6","1 contre 1"],a:0,e:"1 contre 6 : retarder ; 1 contre 2,5 : défense hâtive (tableau 3-1)."},
 {q:"Quelle opération articule-t-on en premier ?",o:["L’opération décisive","Les opérations de modelage","Les opérations de soutien","La réserve"],a:0,e:"§ 3.1.5 et 3.1.6."},
 {q:"Quels sont les cinq critères de validation d’un COA ?",o:["Adapté, réalisable, acceptable, distinct, souple","Adapté, réalisable, acceptable, complet, exclusif","Simple, souple, sûr, rapide, économe","Réalisable, décisif, distinct, complet, réversible"],a:0,e:"Suitable, feasible, acceptable, unique, flexible (§ 3.1.7)."},
 {q:"La méthode « film » (movie-method) consiste à…",o:["enchaîner nos actions de la situation actuelle au résultat voulu (ou à rebours)","générer librement le plus d’idées possible","opposer action, réaction et contre-réaction","comparer les COA par une matrice"],a:0,e:"Le wargaming y ajoute les actions adverses (§ 3.1.3)."},
 {q:"Face à un déficit de forces pour un COA, APP-28 propose…",o:["demander des moyens, accepter un risque dans une partie de la zone, ou enchaîner les tâches","abandonner la mission","réduire l’intention du chef","supprimer la réserve"],a:0,e:"Si le COA reste irréalisable, l’état-major le constate (§ 3.1.5)."},
 {q:"Un COA « acceptable » est…",o:["proportionné, vaut son coût et respecte le droit des conflits armés","réalisable dans le temps et les moyens disponibles","nettement différent des autres","conforme à l’intention du chef"],a:0,e:"Réalisable = feasible ; distinct = unique ; conforme à l’intention = adapté (§ 3.1.7)."},
 {q:"Que fait le chef si aucun COA ne convient ?",o:["L’état-major recommence ; le chef peut combiner des éléments de plusieurs COA","Il retient le moins mauvais sans analyse","Il demande au supérieur de choisir","Il passe directement à l’étape 7"],a:0,e:"§ 3.1.9."}
 ]},

{id:"s4",grp:"Phase 2 – Concevoir et développer les modes d’action",title:"Étape 4 – Analyse des COA (wargaming)",qtag:"Et si… ?",
 but:"Mettre à l’épreuve chaque COA : identifier difficultés, besoins de coordination et conséquences probables, et synchroniser les sept fonctions de combat (§ 3.2).",
 sections:[
 {h:"Préparation, dans l’ordre (§ 3.2.1)",l:["Choisir la technique d’analyse : analyse mentale, « réflexion à voix haute », procédure formelle (wargaming) ou simulation informatique","Choisir le mode d’action adverse : chaque COA contre chaque ACOA (ou, pour gagner du temps, contre le seul ACOA le plus probable)","Choisir les événements critiques et les points de décision à analyser","Choisir la méthode : par bandes (belt), par cases (box) ou par axe dans la profondeur (avenue in depth)","Préparer l’enregistrement et l’affichage des résultats","Lister et placer toutes les forces amies et adverses pertinentes","Lister les hypothèses et les CCIR"]},
 {h:"Conduite (§ 3.2.2)",p:"Le wargaming est un processus discipliné, fondé sur des règles. Chaque événement critique est joué en action, réaction, contre-réaction. La méthode s’applique aux opérations offensives, défensives et de stabilisation."},
 {h:"Produits (§ 3.2.2)",l:["COA affinés","Matrice de synchronisation complétée (nos forces synchronisées dans le temps, l’espace et le but face à un ACOA)","Gabarits et matrices d’aide à la décision pour chaque COA (décisions clés et actions probables pendant l’exécution)"]},
 {h:"Autres buts (§ 3.2.0)",l:["Maximiser les effets en protégeant la force et en limitant les dommages collatéraux","Affiner la visualisation de l’opération","Anticiper les événements","Identifier conditions et ressources nécessaires au succès","Décider quand et où employer les capacités","Identifier les besoins de coordination","Déterminer le COA le plus souple"]}
 ],

 apply:[{t:"note",x:"Pour chaque événement critique, joue l’action amie, la réaction adverse et notre contre-réaction ; note le résultat et les décisions à prendre. Reporte ensuite les actions dans la matrice de synchronisation."},

{id:"s5",grp:"Phase 2 – Concevoir et développer les modes d’action",title:"Étape 5 – Comparaison des COA",qtag:"Lequel ?",
 but:"Comparer objectivement les COA, chacun évalué indépendamment selon les critères approuvés par le chef, pour identifier forces et faiblesses et retenir celui qui a la plus forte probabilité de succès (§ 3.3).",
 sections:[
 {h:"Avantages et inconvénients (§ 3.3.2)",p:"Les experts de chaque fonction de combat analysent les avantages et inconvénients de chaque COA, à partir de la justification de l’étape 3, et désignent le COA qu’ils préfèrent pour leur fonction."},
 {h:"Matrice de décision (§ 3.3.3, tableau 3-3)",l:["Classer les COA de 1 à n pour chaque critère (1 = le plus favorable)","Le COS affecte un poids à chaque critère","Additionner les rangs non pondérés : premier total","Multiplier chaque rang par le poids du critère et additionner : second total","Le total le plus bas désigne le COA préféré ; comparer sur les deux totaux"]},
 {h:"Précautions (§ 3.3.3)",l:["Les résultats reposent sur des jugements subjectifs","La matrice n’est qu’une base partielle de décision","Comparer critère par critère est souvent plus utile que comparer les totaux","Changer les poids peut changer le COA préféré"]},
 {h:"COA préféré de l’état-major (§ 3.3.4)",l:["Risque minimal pour la force et la mission","Meilleure posture pour les opérations futures","Liberté d’action maximale aux subordonnés dans l’intention du supérieur","Souplesse maximale face aux menaces et opportunités imprévues","Moyens nécessaires, dont la disponibilité ou la constitution d’une réserve","Effet de surprise","Environnement le plus sûr et stable pour les civils","Meilleur appui aux thèmes et messages d’information"],p:"Si l’état-major ne s’accorde pas, le COS tranche."},
 {h:"Briefing de décision (§ 3.3.5)",p:"L’état-major présente le COA qu’il préfère ; le COS souligne les changements apportés à chaque COA par l’analyse."}

 {h:"Back brief au chef supérieur (§ 4.1.1)",p:"Si le temps le permet, ou si le supérieur l’ordonne, le chef rend compte au chef supérieur, notamment des risques qui pourraient compromettre la mission de ce dernier. Il en discute si possible au préalable avec les chefs voisins et subordonnés. Il lui faut l’accord du supérieur pour accepter un tel risque."},

/* ---- quiz ---- */
let QZ={};
function quiz(m){if(!QZ[m.id])QZ[m.id]={order:shuffle(m.quiz.map((_,i)=>i)),opt:{},ans:{}};const z=QZ[m.id];
 let h=`<p>Réponds à chaque question : la correction s’affiche aussitôt.${S.quiz[m.id]?` Meilleur score : <b>${Math.round(S.quiz[m.id].best*100)} %</b>.`:""}</p>`;
 z.order.forEach((qi,n)=>{const q=m.quiz[qi];if(!z.opt[qi])z.opt[qi]=shuffle(q.o.map((_,i)=>i));const a=z.ans[qi];
  h+=`<div class="qz card"><div class="qq">${n+1}. ${esc(q.q)}</div>${z.opt[qi].map(oi=>{let c="";if(a!=null){if(oi===q.a)c="good";else if(oi===a)c="bad";}return `<button class="o ${c}" ${a!=null?"disabled":""} onclick="answer('${m.id}',${qi},${oi})">${esc(q.o[oi])}</button>`;}).join("")}${a!=null?`<div class="ex" id="qex_${qi}" role="status"><b>${a===q.a?"✔ Exact.":"✘ Inexact."}</b> ${esc(q.e)}</div>`:""}</div>`;});
 const nb=Object.keys(z.ans).length;
 if(nb===m.quiz.length){const ok=m.quiz.filter((q,i)=>z.ans[i]===q.a).length,r=ok/m.quiz.length;
  h+=`<div class="score ${r>=PASS?"ok":"ko"}" role="status">${ok} / ${m.quiz.length} – ${r>=PASS?"Étape validée ✓":"Relis la synthèse et recommence"}</div><div class="rowb"><button class="btn s" onclick="QZ['${m.id}']=null;render()">Recommencer</button></div>`;}
 return h;}
function answer(id,qi,oi){const m=M.find(x=>x.id===id),z=QZ[id];z.ans[qi]=oi;
 if(Object.keys(z.ans).length===m.quiz.length){const r=m.quiz.filter((q,i)=>z.ans[i]===q.a).length/m.quiz.length;const p=S.quiz[id]||{best:0};p.best=Math.max(p.best,r);p.last=r;S.quiz[id]=p;save();}
 FOCUS_NEXT="#qex_"+qi;const y=window.scrollY;render();window.scrollTo(0,y);}

function calcTxt(){const v=S.v.tiers||{};if(!v.r||!v.c)return "Renseigne les deux horaires.";
 const d=(new Date(v.c)-new Date(v.r))/36e5-(parseFloat(v.m)||0);if(isNaN(d))return "Horaires invalides.";if(d<=0)return "⚠ Aucun temps disponible : vérifie les horaires.";
 const t=d/3,lim=new Date(new Date(v.r).getTime()+t*36e5),f=h=>`${Math.floor(h)} h ${String(Math.round((h%1)*60)).padStart(2,"0")}`;

/* ============ GRAPHIQUES ============ */
function gdhKey(g){g=String(g||"").trim();const m=g.match(/^J\s*([+\-−]\s*\d+)?\s*(\d{1,2})\s*[h:]\s*(\d{2})?/i);
 if(m){const d=m[1]?parseInt(m[1].replace(/[\s−]/g,c=>c==="−"?"-":"")):0;return d*1440+parseInt(m[2])*60+(parseInt(m[3])||0);}
 const x=Date.parse(g);return isNaN(x)?null:x/6e4;}
function gdhCmp(a,b){const ka=gdhKey(a),kb=gdhKey(b);if(ka!=null&&kb!=null)return ka-kb;if(ka!=null)return -1;if(kb!=null)return 1;return String(a||"").localeCompare(String(b||""));}

/* Répartition au prorata du nombre de questions de chaque étape du groupe */
function exAlloc(pool,n){const tot=pool.reduce((s,m)=>s+m.quiz.length,0);n=Math.min(n,tot);
 const al=pool.map(m=>{const x=n*m.quiz.length/tot;return {m,k:Math.floor(x),r:x-Math.floor(x)};});
 let rest=n-al.reduce((s,a)=>s+a.k,0);al.slice().sort((a,b)=>b.r-a.r).forEach(a=>{if(rest>0&&a.k<a.m.quiz.length){a.k++;rest--;}});
 const qs=[];al.forEach(a=>shuffle(a.m.quiz.map((_,i)=>i)).slice(0,a.k).forEach(qi=>qs.push([a.m.id,qi])));return qs;}
/* Tirage : une seule question par groupe de questions jumelles (clé g), complément tiré dans le même groupe d'étapes */
function exPick(){const seen=new Set(),used=new Set(),qs=[];
 const take=(mid,qi)=>{const k=mid+":"+qi,q=M.find(m=>m.id===mid).quiz[qi];if(used.has(k)||(q.g&&seen.has(q.g)))return false;
  used.add(k);if(q.g)seen.add(q.g);qs.push({mid,qi,opt:shuffle(q.o.map((_,i)=>i))});return true;};
 (EX_PLAN[EXS]||EX_PLAN.tout).forEach(([re,n])=>{const pool=M.filter(m=>m.quiz&&m.quiz.length&&re.test(m.grp));let k=0;
  exAlloc(pool,n).forEach(([mid,qi])=>{if(take(mid,qi))k++;});
  if(k<n)shuffle(pool.flatMap(m=>m.quiz.map((_,qi)=>[m.id,qi]))).forEach(([mid,qi])=>{if(k<n&&take(mid,qi))k++;});});
 return shuffle(qs);}

 if(m.canevas)h+=`<h3>Canevas du briefing</h3><ol>${m.canevas.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
 h+=`<p class="ref">APP-28 – fiche réflexe</p></div>`;
 openModal(h+`<div class="rowb"><button class="btn" onclick="printFiche()">Imprimer</button><button class="btn s" onclick="copyText(document.querySelector('#modal .fiche').innerText,'ficheMsg')">Copier</button></div><div id="ficheMsg" role="status"></div>`);
 document.body.classList.add("pfiche");}
function printFiche(){const e=document.getElementById("ficheMsg");if(e)e.innerHTML=`<p class="ref">Si la fenêtre d’impression ne s’ouvre pas (version en ligne), utilise « Copier » puis colle dans Word.</p>`;try{window.print();}catch(err){}}
async function copyText(t,where){const out=h=>{const e=document.getElementById(where);if(e)e.innerHTML=h;};
 try{await navigator.clipboard.writeText(t);out(`<p class="ok-msg">Copié : colle-le dans Word ou un message.</p>`);}
 catch(e){out(`<p class="warn">Copie automatique bloquée : sélectionne le texte ci-dessous puis Ctrl+C.</p><textarea aria-label="Texte à copier" style="width:100%;height:30vh">${esc(t)}</textarea>`);}}

/* ============ RECHERCHE ============ */
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function doSearch(v){const out=document.getElementById("sres"),q=norm(v.trim());if(q.length<2){out.innerHTML="";return;}
 const has=s=>norm(s).includes(q)||(LANG!=="fr"&&norm(tr(s)).includes(q)),cut=s=>{s=tr(s);return s.length>90?s.slice(0,88)+"…":s;};
 const mods=M.filter(m=>has(m.title)||has(m.qtag)||has(m.but)).slice(0,8);
 const voc=(M.find(m=>m.id==="vocab")||{cards:[]}).cards.map((c,i)=>[c,i]).filter(([c])=>has(c[0])||has(c[1])).slice(0,8);
 const lex=LEX.map((l,i)=>[l,i]).filter(([l])=>has(l[0])||has(l[1])).slice(0,8);
 const nrm=typeof NORMES==="undefined"?[]:NORMES.flatMap((s,i)=>s.rows.filter(r=>r.some(has)).map(r=>[r,i])).slice(0,8);
 const n=mods.length+voc.length+lex.length+nrm.length;
 out.innerHTML=!n?`<p class="none">Aucun résultat.</p>`:`<span class="sr">${n} résultat${n>1?"s":""}</span>`
  +(mods.length?`<div class="sg">Étapes</div>${mods.map(m=>`<a href="#${m.id}" data-id="${m.id}">${esc(m.title)}${m.but?`<small>${esc(cut(m.but))}</small>`:""}</a>`).join("")}`:"")
  +(voc.length?`<div class="sg">Définitions</div>${voc.map(([c,i])=>`<a href="#vocab" data-id="vocab" data-card="${i}">${esc(c[0])}<small>${esc(cut(c[1]))}</small></a>`).join("")}`:"")
  +(lex.length?`<div class="sg">Sigles</div>${lex.map(([l,i])=>`<a href="#lex" data-id="lex" data-lex="${i}"><b>${esc(l[0])}</b><small>${esc(l[1])}</small></a>`).join("")}`:"")
  +(nrm.length?`<div class="sg">Normes et délais</div>${nrm.map(([r,i])=>`<a href="#normes" data-id="normes" data-norme="${i}">${esc(r[0])}<small>${esc(cut(r.slice(1).filter(x=>x!=="–").join(" · ")))}</small></a>`).join("")}`:"");}

/* ============ CRÉER UN CAS (instructeur) ============ */
/* Fichier de cas au format docs/FORMAT_CAS.md, construit à partir des saisies affichées (les siennes ou l'exemple VIENNE) */
function exportCasForm(){openModal(`<h3>Créer un cas à partir de mes saisies</h3><p>Le fichier reprend, comme corrigé, tout ce qui est rempli dans les onglets « Appliquer »${DEMO_ON?" (ici : l’exemple VIENNE)":""}. Tu pourras ensuite y ajouter un commentaire par étape (rubrique « texte »).</p>
 <div class="fld"><label for="casT">Titre du cas</label><input id="casT" value="Cas d’entraînement" autocomplete="off"></div>
 <div class="fld"><label for="casR">Résumé (une ou deux phrases, affiché dans le bandeau)</label><textarea id="casR" rows="2"></textarea></div>
 <div class="fld"><label for="casS">Situation (texte long ; une ligne vide sépare deux paragraphes)</label><textarea id="casS" rows="6"></textarea></div>
 <div class="rowb"><button class="btn" onclick="exportCas()">Créer le fichier</button></div><div id="casFormMsg" role="status"></div>`);}
function casData(titre,resume,situation){const corrige={},filled=v=>v!=null&&String(v).trim()!=="";
 M.forEach(m=>{if(!m.apply)return;const c={v:{},tab:{}};
  m.apply.forEach(b=>{if(b.t==="fields"&&S.v[b.id]){const o={};b.f.forEach(f=>{if(filled(S.v[b.id][f.k]))o[f.k]=S.v[b.id][f.k];});if(Object.keys(o).length)c.v[b.id]=o;}
   if(b.t==="tiers"&&S.v.tiers&&(S.v.tiers.r||S.v.tiers.c))c.v.tiers=S.v.tiers;
   const t=blkTab(b);if(t&&S.tab[t.id]){const rows=S.tab[t.id].filter(r=>t.cols.some(cl=>!cl.ro&&filled(r[cl.k])));if(rows.length)c.tab[t.id]=rows;}});
  const tc=S.tcidr.filter(r=>r.src===m.id&&filled(r.l)).map(({y,fo,l})=>({y,fo,l}));if(tc.length)c.tcidr=tc;
  const fr=S.frise.filter(r=>r.src===m.id&&(filled(r.g)||filled(r.e))).map(({g,e})=>({g,e}));if(fr.length)c.frise=fr;
  if(!Object.keys(c.v).length)delete c.v;if(!Object.keys(c.tab).length)delete c.tab;
  if(Object.keys(c).length)corrige[m.id]=c;});
 return {titre,resume,situation,corrige};}
function exportCas(){const g=id=>(document.getElementById(id)||{}).value||"",titre=g("casT").trim(),out=document.getElementById("casFormMsg");
 if(!titre){if(out)out.innerHTML=`<p class="warn">Donne un titre au cas.</p>`;return;}
 const d=casData(titre,g("casR").trim(),g("casS").trim()),n=Object.keys(d.corrige).length;
 if(!n){if(out)out.innerHTML=`<p class="warn">Aucune saisie à reprendre : remplis d’abord les gabarits (onglets « Appliquer »).</p>`;return;}
 closeModal();dl("cas_"+titre.replace(/[^\wÀ-ÿ]+/g,"_").replace(/^_+|_+$/g,"")+".json","application/json",JSON.stringify(d,null,1));
 const e=document.getElementById("casMsg");if(e)e.innerHTML=`<p class="ok-msg">Cas « ${esc(titre)} » : corrigé pour ${n} étape(s). Complète au besoin la situation et les commentaires (« texte ») dans le fichier, puis charge-le avec « Charger un cas ».</p>`;}

/* ============ FOCUS, HAUTEUR DES CHAMPS, SOMMAIRE (audit forme v2) ============ */
let FOCUS_NEXT=null;
function focusKey(el){const m=document.getElementById("main");if(!el||el===m||!m.contains(el))return null;
 if(el.id)return "#"+CSS.escape(el.id);
 for(const a of ["aria-label","onclick","onchange","oninput"]){const v=el.getAttribute(a);if(v)return `${el.tagName}[${a}="${CSS.escape(v)}"]`;}
 return null;}
function autoH(list){const L=[...list].filter(t=>t.offsetParent!==null);L.forEach(t=>t.style.height="0px");
 const h=L.map(t=>t.scrollHeight);L.forEach((t,i)=>t.style.height=(h[i]+2)+"px");}
function applyToc(){if(curTab!=="a")return;const el=document.getElementById("main");if(!el.querySelector(".tabs"))return;
 const hs=[...el.querySelectorAll(".card>h3,details.card>summary b")];if(hs.length<4)return;
 const n=document.createElement("div");n.className="toc";n.setAttribute("role","navigation");n.setAttribute("aria-label","Sommaire de l’onglet");
 n.innerHTML=hs.map((h,i)=>{const t=h.closest(".card");t.id="sec_"+i;h.tabIndex=-1;h.id="sech_"+i;return `<a href="#sec_${i}" onclick="event.preventDefault();const c=document.getElementById('sec_${i}'),h=document.getElementById('sech_${i}');if(c.tagName==='DETAILS')c.open=true;c.scrollIntoView();h.focus({preventScroll:true})">${esc(h.textContent.replace(/^Gantt – /,"Gantt : "))}</a>`;}).join("");
 el.querySelector(".tabs").after(n);}
const _render=render;
render=function(){const k=focusKey(document.activeElement);_render();
 autoH(document.querySelectorAll("#main textarea"));
 applyToc();
 let e=null;try{e=k&&document.querySelector(k);}catch(x){e=null;}if(e&&e.disabled)e=null;
 if(!e&&FOCUS_NEXT){e=document.querySelector(FOCUS_NEXT);if(e&&!e.matches("a,button,input,select,textarea,summary,[tabindex]"))e.tabIndex=-1;}
 FOCUS_NEXT=null;if(e)e.focus({preventScroll:true});};
document.addEventListener("input",e=>{if(e.target.matches("#main textarea"))autoH([e.target]);});
document.addEventListener("toggle",e=>{if(e.target.open)autoH(e.target.querySelectorAll("textarea"));},true);
let rsz;addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(()=>{refreshCharts();autoH(document.querySelectorAll("#main textarea"));},200);});
const toTop=document.getElementById("toTop");addEventListener("scroll",()=>{toTop.hidden=scrollY<1200;},{passive:true});

/* ============ INIT ============ */
document.addEventListener("click",e=>{if(document.body.classList.contains("navopen")&&!document.getElementById("nav").contains(e.target)&&e.target.id!=="menuBtn")toggleNav(false);});
USER=S;const dsw=document.getElementById("demoSw");dsw.onchange=()=>setDemo(dsw.checked);
function setDemo(on){DEMO_ON=on;dsw.checked=on;const b=document.getElementById("demoBanner");
 if(on){USER=S;S=JSON.parse(JSON.stringify(DEMO));S.quiz=USER.quiz;b.hidden=false;b.innerHTML=`<details><summary><b>Exemple VIENNE – ${esc(DEMO_SITU.titre)}</b> (lire la situation)</summary>${esc(DEMO_SITU.situation||DEMO_SITU.resume).split(/\n\s*\n/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("")}</details><i>Modifications non enregistrées.</i> <button class="btn s" onclick="setDemo(false)">Revenir à mes travaux</button>`;}
 else{S=USER;b.hidden=true;}
 QZ={};render();}
function toggleNav(f){const n=document.getElementById("nav"),o=f===undefined?!n.classList.contains("open"):f;n.classList.toggle("open",o);document.body.classList.toggle("navopen",o);document.getElementById("menuBtn").setAttribute("aria-expanded",o);if(o)setTimeout(()=>document.getElementById("navX").focus(),60);}
function fromHash(){const h=(location.hash||"").slice(1);const m=M.find(x=>x.id===h);if(m&&unlocked(m)){cur=h;curTab="c";}render();}
window.addEventListener("hashchange",fromHash);renderCas();fromHash();
</script>
