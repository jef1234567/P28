<style>
:root{--rouge:#B3121F;--rouge-f:#7E0C16;--rouge-c:#F7E4E5;--argent:#8B9199;--argent-c:#E6E8EB;--encre:#1E2227;--gris:#5A6068;--papier:#FAFAF8;--blanc:#fff;--vert:#2E7D4F;--vert-c:#E3F2E8;--ambre:#A86B00;--ambre-c:#FFF4DC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papier);color:var(--encre);font:15px/1.5 "Segoe UI",Calibri,Arial,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:.2em 0 .5em}
h2{font-size:1.5em;color:var(--rouge-f)}h3{font-size:1.1em;margin-top:1.2em}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:linear-gradient(90deg,var(--encre),#2C3138);color:#fff;border-bottom:4px solid var(--rouge)}
header img{height:64px}
header .t1{font-family:Georgia,serif;font-size:1.35em;letter-spacing:.02em}
header .t2{font-size:.85em;color:var(--argent-c);opacity:.85}
header .prog{margin-left:auto;text-align:right;font-size:.85em;min-width:160px}
.bar{height:8px;background:#444b54;border-radius:4px;overflow:hidden;margin-top:4px}.bar>i{display:block;height:100%;background:var(--rouge);width:0}
.wrap{display:flex;min-height:calc(100vh - 88px)}
nav{width:290px;flex-shrink:0;background:var(--blanc);border-right:1px solid var(--argent-c);padding:12px 0;overflow-y:auto}
nav .grp{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--gris);padding:12px 18px 4px;font-weight:600}
nav a{display:flex;align-items:center;gap:8px;padding:7px 18px;color:var(--encre);text-decoration:none;font-size:.92em;border-left:3px solid transparent}
nav a:hover{background:var(--argent-c)}
nav a.on{background:var(--rouge-c);border-left-color:var(--rouge);font-weight:600}
nav a.lock{color:#a8adb3;cursor:not-allowed}
nav .st{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:inline-grid;place-items:center;font-size:11px;border:1.5px solid var(--argent)}
nav .st.ok{background:var(--vert);border-color:var(--vert);color:#fff}
nav .st.en{border-color:var(--rouge);color:var(--rouge)}
nav .reu{font-style:italic}
main{flex:1;padding:22px 34px 60px;max-width:1100px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--argent-c);margin:14px 0 18px;flex-wrap:wrap}
.tabs button{background:none;border:none;padding:9px 16px;font:inherit;cursor:pointer;color:var(--gris);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--rouge-f);border-bottom-color:var(--rouge);font-weight:600}
.vid{background:var(--blanc);border:1px solid var(--argent-c);border-left:4px solid var(--encre);border-radius:0 8px 8px 0;padding:12px 16px;margin:12px 0}
.vid h3{margin:0 0 8px;font-size:1em}.vid .d{font-weight:400;color:var(--gris);font-size:.85em}
.vid video{width:100%;max-width:720px;aspect-ratio:16/9;background:#000;border-radius:6px;display:block}
.vid .ko{display:none;color:var(--ambre);font-size:.88em;margin-top:6px}.vid.err .ko{display:block}.vid.err video{display:none}
.vid+.vid{margin-top:8px}
@media print{.vid{display:none}}
.card{background:var(--blanc);border:1px solid var(--argent-c);border-radius:8px;padding:16px 20px;margin:12px 0}
.q{font-weight:700;color:var(--rouge-f)}
.ref{font-size:.8em;color:var(--gris);font-style:italic}
.but{border-left:4px solid var(--rouge);background:var(--rouge-c);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0}
.vig{border-left:4px solid var(--ambre);background:var(--ambre-c);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0}
.vig b{color:var(--ambre)}
ul.c{padding-left:20px;margin:.3em 0}ul.c li{margin:.2em 0}
table{border-collapse:collapse;width:100%;margin:6px 0}
th,td{border:1px solid var(--argent-c);padding:6px 8px;vertical-align:top;text-align:left;font-size:.92em}
th{background:var(--encre);color:#fff;font-weight:600}
td input,td select,td textarea{width:100%;border:1px solid transparent;background:transparent;font:inherit;padding:3px}
td input:focus,td select:focus,td textarea:focus{border-color:var(--argent);background:#fff;outline:none}
.fld{margin:10px 0}.fld label{display:block;font-weight:600;font-size:.92em;margin-bottom:3px}
.fld .h{font-size:.82em;color:var(--gris);margin-bottom:3px}
.fld input,.fld textarea,.fld select{width:100%;padding:7px 9px;border:1px solid var(--argent);border-radius:5px;font:inherit;background:#fff}
textarea{resize:vertical;min-height:60px}
.btn{background:var(--rouge);color:#fff;border:none;padding:8px 14px;border-radius:5px;font:inherit;cursor:pointer;font-size:.9em}
.btn:hover{background:var(--rouge-f)}.btn.s{background:var(--argent-c);color:var(--encre)}.btn.s:hover{background:#d3d6da}
.btn.x{background:none;color:var(--gris);padding:2px 6px}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
/* frise MEDOT */
.cycle{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.ph{background:#fff;border:1px solid var(--argent-c);border-radius:8px;overflow:hidden}
.ph h4{margin:0;padding:8px 12px;background:var(--encre);color:#fff;font-family:Georgia,serif;font-size:.95em}
.ph .s{display:block;padding:6px 12px;border-top:1px solid var(--argent-c);font-size:.88em;cursor:pointer;color:var(--encre);text-decoration:none}
.ph .s:hover{background:var(--rouge-c)}
.ph .r{background:var(--rouge);color:#fff;font-weight:600}.ph .r:hover{background:var(--rouge-f)}
.ph .lk{color:#a8adb3;cursor:default}.ph .lk:hover{background:none}
/* quiz */
.qz{margin:14px 0}.qz .qq{font-weight:600;margin-bottom:6px}
.qz .o{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--argent);border-radius:5px;padding:7px 10px;margin:4px 0;font:inherit;cursor:pointer}
.qz .o:hover:not(:disabled){background:var(--argent-c)}
.qz .o.good{background:var(--vert-c);border-color:var(--vert)}.qz .o.bad{background:var(--rouge-c);border-color:var(--rouge)}
.qz .o:disabled{cursor:default;color:var(--encre);opacity:1}
.qz .ex{font-size:.9em;padding:8px 10px;background:var(--argent-c);border-radius:5px;margin-top:4px}
.score{font-size:1.1em;font-weight:700;padding:12px;border-radius:6px;text-align:center}
.score.ok{background:var(--vert-c);color:var(--vert)}.score.ko{background:var(--ambre-c);color:var(--ambre)}
/* flashcards */
.fc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fcd{background:#fff;border:1px solid var(--argent-c);border-top:3px solid var(--rouge);border-radius:6px;padding:12px;min-height:110px;cursor:pointer;font-size:.9em}
.fcd .tt{font-family:Georgia,serif;font-weight:700;font-size:1.05em;color:var(--rouge-f)}
.fcd .df{display:none;margin-top:6px}.fcd.flip .df{display:block}.fcd.flip .hint{display:none}
.hint{color:var(--gris);font-size:.8em;margin-top:8px}
.chk label{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.chk input{margin-top:4px}
.tag{display:inline-block;font-size:.75em;padding:1px 7px;border-radius:10px;background:var(--argent-c);color:var(--gris);margin-left:6px}
.ok-msg{color:var(--vert);font-size:.85em}.warn{color:var(--ambre);font-size:.85em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9}
.modal.on{display:flex}.modal .card{max-width:760px;width:92%;max-height:85vh;overflow:auto}
footer{font-size:.78em;color:var(--gris);padding:10px 34px;border-top:1px solid var(--argent-c);background:#fff}
.next{margin-top:24px;display:flex;justify-content:space-between}
@media(max-width:820px){.wrap{flex-direction:column}nav{width:100%;max-height:none;border-right:none;border-bottom:1px solid var(--argent-c)}main{padding:16px}.cycle{grid-template-columns:1fr}header img{height:44px}header .prog{display:none}}

.menu{display:none;background:none;border:1px solid #6b7280;color:#fff;font-size:1.4em;border-radius:6px;padding:4px 12px;margin-left:auto;cursor:pointer}
.demo-sw{display:block;margin-top:8px;cursor:pointer;color:#fff}
.demo-banner{background:var(--ambre-c);border-bottom:2px solid var(--ambre);padding:10px 20px;font-size:.9em}
.demo-banner .btn{margin-left:8px}
.cycle-svg svg{width:100%;height:auto;display:block}
.cycle-svg .cl{font:600 13px Georgia,serif;fill:#7E0C16}
.cycle-svg .nt{font:600 12px "Segoe UI",Arial,sans-serif}
.cycle-svg .nq{font:italic 11.5px "Segoe UI",Arial,sans-serif;fill:#5A6068}
.cycle-svg .nd{cursor:pointer}
.cycle-svg .nd.soon{opacity:.45;cursor:default}
.cycle-svg .nd:focus{outline:none}
.scores .sc{display:grid;grid-template-columns:minmax(120px,240px) 1fr 52px;gap:10px;align-items:center;padding:4px 0}
.scores a{color:var(--encre);font-size:.9em}
.sb{position:relative;height:14px;background:var(--argent-c);border-radius:7px}
.sb i{display:block;height:100%;border-radius:7px;background:var(--ambre)}.sb i.ok{background:var(--vert)}
.sb .th{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--encre)}
.hbars .hb{display:grid;grid-template-columns:190px 1fr 36px;gap:10px;align-items:center;padding:3px 0;font-size:.9em}
.hbars .hb div{background:var(--argent-c);height:16px;border-radius:4px}.hbars i{display:block;height:100%;border-radius:4px;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82em;margin-bottom:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
ol.tl{list-style:none;padding:0 0 0 18px;margin:8px 0;border-left:3px solid var(--argent-c)}
ol.tl li{position:relative;padding:6px 0 6px 14px;display:flex;gap:14px;flex-wrap:wrap}
ol.tl li::before{content:"";position:absolute;left:-27px;top:11px;width:14px;height:14px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 1px var(--c)}
ol.tl .g{font-weight:700;min-width:110px;color:var(--rouge-f);font-variant-numeric:tabular-nums}
ol.tl .e{flex:1;min-width:180px}
.sync{display:grid;gap:4px;overflow-x:auto;font-size:.86em}
.sync .lb{font-weight:700;align-self:center;font-size:.85em;color:var(--gris)}
.sync .lb.ami{color:#1F5F99}.sync .lb.eni{color:var(--rouge-f)}
.sync .tm{font-weight:700;text-align:center;background:var(--encre);color:#fff;border-radius:4px;padding:4px}
.sync .blk{border-radius:5px;padding:6px 8px}
.sync .blk.ami{background:#E3EDF7;border-left:4px solid #1F5F99}
.sync .blk.eni{background:var(--rouge-c);border-left:4px solid var(--rouge)}
.sync .mid{text-align:center;padding:4px;border-radius:5px;background:#fff;border:1px dashed var(--argent)}
.sync .mid.op{border:1.5px solid var(--vert);background:var(--vert-c)}.sync .mid.op b{color:var(--vert)}
.sync .mid.ri{border:1.5px solid var(--ambre);background:var(--ambre-c)}.sync .mid.ri b{color:var(--ambre)}
.sync .rf{font-size:.85em;color:var(--gris)}
details summary{cursor:pointer;color:var(--rouge-f);margin-top:10px}
.cycle{display:none}
@media(max-width:820px){
 .menu{display:block}
 .cycle-svg{display:none}.cycle{display:grid}
 nav{display:none;position:sticky;top:0;z-index:5;max-height:75vh;box-shadow:0 6px 16px rgba(0,0,0,.15)}
 nav.open{display:block}
 nav a{padding:12px 18px;min-height:44px}
 header{flex-wrap:wrap}
 .demo-sw{display:inline-block;margin:0 0 0 10px}
 .scores .sc{grid-template-columns:1fr 60px;}.scores .sb{grid-column:1/-1;grid-row:2}
 .hbars .hb{grid-template-columns:130px 1fr 30px}
 main table{display:block;overflow-x:auto}
 .tabs button{flex:1;padding:12px 6px}
 .qz .o{padding:11px 12px}
}

/* ---- accessibilité / forme (audit) ---- */
:root{--ambre:#8A5700;--vert:#256B42;--verrou:#6B7179}
h1.t1{margin:0;font-weight:normal;font-size:1.35em}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:20;background:#fff;padding:8px;color:var(--encre)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card>h3:first-child{margin-top:0}
:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
header :focus-visible{outline-color:#fff}.btn:focus-visible{outline-color:var(--encre)}
main:focus{outline:none}
nav a.lock,.ph .lk{color:var(--verrou)}nav .st{border-color:var(--gris)}
td input,td select,td textarea{border:1px solid var(--argent);background:#fff;border-radius:4px;padding:5px 6px;min-height:36px}
td input:focus,td select:focus,td textarea:focus{border-color:var(--rouge);outline:2px solid var(--rouge);outline-offset:1px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.ph .s{width:100%;text-align:left;border:none;border-top:1px solid var(--argent-c);background:none;font:inherit}
.ph .s.r{background:var(--rouge);color:#fff}.ph .s.r:hover{background:var(--rouge-f)}.ph .s.r.lk{background:var(--argent-c);color:var(--verrou)}
.fcd{text-align:left;font:inherit;color:inherit;width:100%;display:block}.fcd .tt,.fcd .hint{display:block}
.btn.dk{background:var(--encre);color:#fff}.btn.dk:hover{background:#000}
nav .grp{font-size:.8em}.tag{font-size:.8em}.hint{font-size:.85em}footer{font-size:.85em}.ref{font-size:.85em}
header{box-shadow:0 2px 0 var(--argent)}
.ph h4{background:linear-gradient(90deg,var(--rouge-f),var(--rouge))}
@media(min-width:821px){nav{position:sticky;top:0;align-self:flex-start;max-height:100vh}}
@media(hover:none){nav a:hover,.ph .s:hover,.qz .o:hover:not(:disabled),.btn.s:hover{background:inherit}}
@media(pointer:coarse){nav a,.ph .s,.btn,.qz .o,.tabs button{min-height:44px}.btn.x{min-width:44px;min-height:44px;font-size:1.1em}input[type=checkbox]{width:22px;height:22px}.chk label{padding:8px 0;min-height:44px;align-items:center}td select,td input{min-height:44px}}
@media(max-width:820px){
 nav{display:block!important;position:fixed;top:0;left:0;bottom:0;width:min(86vw,320px);max-height:none;z-index:8;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 16px #0003}

 body.navopen::after{content:"";position:fixed;inset:0;background:#0006;z-index:7}
 header .prog{display:block!important;min-width:0;font-size:.75em;margin-left:0;order:3;width:100%;text-align:left}

}
@media(max-width:600px){
 .tw thead{display:none}
 .tw tr{display:block;border:1px solid var(--argent-c);border-radius:6px;margin:8px 0;padding:6px;background:#fff}
 .tw td{display:block;border:none;padding:4px 2px}
 .tw td[data-l]::before{content:attr(data-l);display:block;font-size:.8em;font-weight:600;color:var(--gris)}
 .next{flex-direction:column}.next .btn{width:100%}

}
@media(max-width:820px){header{padding:8px 12px;gap:10px}header img{height:40px}h1.t1{font-size:1.05em}
 header .prog{display:flex!important;align-items:center;gap:10px;flex-wrap:wrap}header .prog .bar{flex:1;min-width:120px;margin:0}.demo-sw{margin:0!important}
 .demo-banner{padding:8px 12px}}
.demo-banner details{display:inline}.demo-banner summary{cursor:pointer;display:inline}
.sync-m{display:none}
@media(max-width:600px){.sync{display:none}.sync-m{display:block}.sync-m .sm{display:grid;gap:4px;margin-bottom:12px;font-size:.9em}.sync-m small{display:block;font-weight:700;font-size:.75em;text-transform:uppercase;color:var(--gris)}.sync-m .tm{font-weight:700;background:var(--encre);color:#fff;border-radius:4px;padding:4px 8px}.sync-m .blk{border-radius:5px;padding:6px 8px}.sync-m .blk.ami{background:#E3EDF7;border-left:4px solid #1F5F99}.sync-m .blk.eni{background:var(--rouge-c);border-left:4px solid var(--rouge)}.sync-m .mid{padding:6px;border-radius:5px;border:1px dashed var(--argent)}.sync-m .mid.op{border:1.5px solid var(--vert);background:var(--vert-c)}.sync-m .mid.ri{border:1.5px solid var(--ambre);background:var(--ambre-c)}}

/* ---- livraison 2 : phase 2, cas, examen, fiche, recherche ---- */
.gantt{font-size:.86em}
.gantt .gr{display:grid;grid-template-columns:minmax(110px,34%) minmax(0,1fr);gap:4px 10px;align-items:center;padding:5px 0;border-top:1px solid var(--argent-c)}
.gantt .gr.ax{border-top:none;padding:0}
.gantt .lbl{line-height:1.3;min-width:0;overflow-wrap:anywhere}.gantt .lbl small{display:block;color:var(--gris)}
.gantt .trk{position:relative;height:24px;margin-right:10px;background:#F3F4F6;border-radius:4px}
.gantt .trk .tk{position:absolute;top:0;bottom:0;width:1px;background:#D5D8DC}
.gantt .trk .bar{position:absolute;top:4px;height:16px;border-radius:4px;min-width:6px;box-shadow:inset 0 0 0 1px #0002}
.gantt .trk .pd{position:absolute;top:-1px;font-size:19px;line-height:1;color:#E0A800;transform:translateX(-50%);text-shadow:0 0 1px #000,0 0 2px #000}
.gantt .trk .na{position:absolute;left:8px;top:3px;font-size:.85em;color:var(--gris);font-style:italic}
.gantt .ticks{position:relative;height:18px;margin-right:10px;font-size:.8em;color:var(--gris);font-variant-numeric:tabular-nums}
.gantt .ticks span{position:absolute;white-space:nowrap;transform:translateX(-50%)}
.gantt .ticks span.f{transform:none}.gantt .ticks span.l{transform:translateX(-100%)}
.pdk{color:#B07F00;font-weight:700}
@media(max-width:600px){.gantt .gr{grid-template-columns:minmax(0,1fr)}.gantt .gr.ax .lbl{display:none}}
.cmpg{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px;gap:4px 6px;align-items:center;font-size:.9em}
.cmpg .hd{font-weight:700;text-align:center;font-size:.85em;color:var(--gris)}.cmpg .hd:first-child{text-align:left}
.cmpg .v{text-align:center;border-radius:4px;padding:4px 2px;font-weight:700}
.v.p{background:var(--vert-c);color:var(--vert)}.v.z{background:var(--argent-c);color:var(--gris)}.v.m{background:var(--rouge-c);color:var(--rouge-f)}
.tot{display:grid;grid-template-columns:44px minmax(0,1fr) 48px;gap:8px;align-items:center;margin:6px 0}

.tot .trk i{position:absolute;top:0;bottom:0;border-radius:4px}
.mame{display:grid;gap:6px;font-size:.9em}
.mame .hd{font-weight:700;text-align:center;align-self:end;color:var(--gris)}
.mame .rh{font-weight:700;align-self:center}
.mame .mc{border-radius:6px;padding:8px;min-height:64px;border:1.5px solid var(--argent);background:#F3F4F6;min-width:0;overflow-wrap:anywhere}
.mame .mc.g{background:var(--vert-c);border-color:var(--vert)}.mame .mc.a{background:var(--ambre-c);border-color:var(--ambre)}.mame .mc.r{background:var(--rouge-c);border-color:var(--rouge)}
.mame .mc small{display:block;color:var(--gris)}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid #0003}
.cor{border:2px solid var(--vert);border-radius:8px;padding:12px 16px;margin:14px 0;background:#F6FAF7}
.cor h3{color:var(--vert);margin-top:0}.cor h4{margin:14px 0 4px;font-size:1em}
.cor .com{border-left:4px solid var(--vert);background:#fff;padding:8px 12px;margin:8px 0}
.cor table{background:#fff}.cor p{margin:.4em 0}
.cas-banner[hidden],.demo-banner[hidden],#toTop[hidden]{display:none!important}
.cas-banner{background:#E3EDF7;border-bottom:2px solid #1F5F99;padding:10px 20px;font-size:.9em;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cas-banner .btn{padding:6px 10px}.cas-banner summary{cursor:pointer}.cas-banner>span:first-child{flex:1 1 260px}
.extop{position:sticky;top:0;z-index:4;background:var(--encre);color:#fff;padding:8px 14px;border-radius:6px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:center;margin:8px 0}
.extop b{font-size:1.25em;font-variant-numeric:tabular-nums}.extop.low{background:var(--rouge-f)}
.qz .o.sel{border:2px solid var(--rouge);background:var(--rouge-c);font-weight:600}
.err{border-left:4px solid var(--rouge);padding:8px 12px;margin:10px 0;background:#fff;border-radius:0 6px 6px 0}
.err .ko{color:var(--rouge-f)}.err .okr{color:var(--vert)}
.srch{padding:4px 14px 10px;border-bottom:1px solid var(--argent-c)}
.srch input{width:100%;padding:8px 10px;border:1px solid var(--argent);border-radius:5px;font:inherit;min-height:40px}
.srch input:focus{border-color:var(--rouge);outline:2px solid var(--rouge);outline-offset:1px}
#sres .sg{font-size:.75em;text-transform:uppercase;letter-spacing:.06em;color:var(--gris);margin:8px 0 2px;font-weight:600}
#sres a{display:block;padding:6px 8px;border-left:none;border-radius:4px;font-size:.88em;color:var(--encre)}
#sres a small{display:block;color:var(--gris);font-size:.9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sres .none{font-size:.85em;color:var(--gris);padding:4px 0}
tr.hl td{background:var(--ambre-c)!important}.fcd.hl{box-shadow:0 0 0 3px var(--ambre)}
.fiche{font-size:.92em}.fiche h2{margin-bottom:.2em}.fiche h3{margin:.8em 0 .2em;font-size:1em;color:var(--rouge-f)}
.fiche ul,.fiche ol{margin:.2em 0;padding-left:20px}.fiche li{margin:.1em 0}
@media(pointer:coarse){.srch input{min-height:44px}#sres a{min-height:44px}}
@media print{
 body.pfiche>*:not(#modal){display:none!important}
 body.pfiche #modal{position:static;display:block;background:none}
 body.pfiche #modal .card{max-width:none;width:100%;max-height:none;overflow:visible;border:none;padding:0;margin:0}
 body.pfiche #modal .rowb,body.pfiche #ficheMsg{display:none}
 body.pfiche .fiche{font-size:10pt;color:#000}.fiche h3{break-after:avoid}.fiche li{break-inside:avoid}
 .cor,.card{break-inside:avoid}
}
/* ---- audit v2 forme ---- */
#main h2:focus{outline:none}
body.modal-open{overflow:hidden}
.modal .card{padding-top:0}
.modal .mtop{position:sticky;top:0;z-index:1;display:flex;justify-content:flex-end;background:#fff;padding:6px 0 0;margin:0 -8px 0 0}
@media(max-width:820px){nav{visibility:hidden;box-shadow:none;transition:transform .2s,visibility 0s .2s}nav.open{visibility:visible;box-shadow:4px 0 16px #0003;transition:transform .2s}.nav-x{display:flex}}
.nav-x{display:none;justify-content:flex-end;padding:6px 10px 0}
.tw th.nw,.tw td.nw{width:7.5em}.tw th.del,.tw td.del{width:44px}
td select{min-width:6em}
tbody th[scope=row]{background:#fff;color:var(--encre);font-weight:700}
/* 8 colonnes et plus : une fiche par ligne (la zone utile reste < 1100 px, même sur grand écran) */
@media(min-width:601px){
 .tw.wide thead{display:none}.tw.wide table,.tw.wide tbody{display:block}
 .tw.wide tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:dense;gap:6px 12px;border:1px solid var(--argent-c);border-radius:6px;margin:10px 0;padding:10px;background:#fff}
 .tw.wide td{display:block;border:none;padding:0;grid-column:span 3}.tw.wide td.nw{grid-column:span 1}
 .tw.wide td.del{grid-column:3;grid-row:1;justify-self:end}
 .tw.wide td[data-l]::before{content:attr(data-l);display:block;font-size:.8em;font-weight:600;color:var(--gris)}}
@media(max-width:600px){
 .tw tr{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:dense;gap:2px 10px}
 .tw td,.tw th[scope=row]{display:block;border:none;padding:4px 2px;grid-column:1/-1}
 .tw td.nw{grid-column:auto}.tw td.del{grid-column:2;grid-row:1;justify-self:end;padding:0;width:auto}
 .tw td.del .btn.x::after{content:" Supprimer";font-size:.8em}
 input,select,textarea{font-size:16px}
 .demo-banner{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:6px 12px;font-size:.85em}
 .demo-banner details{flex:1 1 60%}.demo-banner .btn{margin-left:auto}
 .cas-banner{padding:6px 12px;font-size:.85em;gap:4px 8px}.cas-banner>span:first-child{flex:1 1 100%}}
.cycle-svg .nd:hover :is(rect,polygon),.cycle-svg .nd:focus-visible :is(rect,polygon){stroke:#1E2227;stroke-width:3}
.cycle-svg .nd:focus-visible :is(rect,polygon){stroke-dasharray:5 3}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.toc a{font-size:.85em;padding:6px 12px;border:1px solid var(--argent);border-radius:16px;color:var(--encre);text-decoration:none;background:#fff}
.toc a:hover{background:var(--rouge-c)}
#toTop{position:fixed;right:14px;bottom:14px;z-index:6;width:48px;height:48px;border-radius:50%;font-size:1.3em;box-shadow:0 2px 8px #0004}
.gantt .ticks{font-size:12px;height:20px}
.gantt .gr.ax{position:sticky;top:0;z-index:2;background:#fff;padding:4px 0;border-bottom:1px solid var(--argent-c)}
.pdk{color:var(--ambre)}
.sync .mid.ri,.sync-m .mid.ri{border-color:var(--rouge);background:var(--rouge-c)}.sync .mid.ri b{color:var(--rouge-f)}
.tag.t-op{background:var(--vert-c);color:var(--vert)}.tag.t-ri{background:var(--rouge-c);color:var(--rouge-f)}
input[type=checkbox],input[type=radio]{accent-color:var(--rouge)}
h2 .tag{font:600 .5em/1.7 "Segoe UI",Calibri,Arial,sans-serif;vertical-align:.3em}
.legend i.lg{width:14px;height:14px;border-radius:3px;border-width:2px;border-style:solid}
.qz .o.sel,.qz .o.sel:hover{background:var(--rouge-c)}
.btn.danger{background:#fff;color:var(--rouge-f);border:1.5px solid var(--rouge);margin-left:auto}.btn.danger:hover{background:var(--rouge-c)}
.cmpg,.tot{max-width:680px}
details.card>summary{margin-top:0}
@media(pointer:coarse){
 .demo-banner summary,.cas-banner summary{display:list-item;list-style-position:inside;padding:12px 0}
 .demo-sw{display:inline-flex!important;align-items:center;gap:8px;min-height:44px}
 .scores a{display:inline-block;padding:10px 0}.skip:focus{padding:12px 14px}
 .toc a{min-height:40px;display:inline-flex;align-items:center}}
@media print{.modal .mtop,.toc,#toTop{display:none}}
.setbtn{background:none;border:1px solid currentColor;border-radius:6px;color:inherit;font-size:1.1rem;line-height:1;padding:.25rem .45rem;cursor:pointer;margin-inline-start:.5rem}.rtl #main,.rtl #nav,.rtl header .t1,.rtl header .t2,.rtl #modalBody,.rtl footer,.rtl .prog{direction:rtl;text-align:start}
</style>

force.","Attaque":"Attack","Attaquer":"Attack","Calculateur de délais":"Time calculator","Contre-attaque":"Counter-attack","Contre-attaquer":"Counter-attack","Défendre":"Defend","Effets":"Effects","Moyens":"Assets","Niveau":"Level","Norme":"Norm","Normes et délais":"Norms and timings","Recommencer":"Start again","Voir les normes et délais":"See norms and timings","au moins {n} h":"at least {n} h","pour {n} GTIA":"for {n} GTIA","sans objet":"not applicable","{n} groupe":"{n} section","{n} section":"{n} platoon","{n}/{n} ou {n}/{n}":"{n}/{n} or {n}/{n}","Participants":"Participants","Back brief":"Back brief","Après le back brief":"After the back brief","Coordination":"Coordination","Justification":"Justification","Avantages":"Advantages","Inconvénients":"Disadvantages","30 minutes":"30 minutes","Oui":"Yes","Vocabulaire d’APP-28":"APP-28 vocabulary","Avant d’entrer dans la méthode, il faut parler la même langue que l’état-major. Retourne chaque carte pour vérifier la définition, puis passe au test. Le terme OTAN (anglais) est donné entre parenthèses.":"Before getting into the method, you need to speak the same language as the staff. Flip each card to check the definition, then take the test. The NATO term is given in brackets.","Tâche (task)":"Task","Action ou activité clairement définie, confiée à une personne ou à une organisation par une autorité compétente. Le « quoi » d’un énoncé de mission est toujours une tâche (§ 2.4.2.3).":"A clearly defined action or activity assigned to an individual or organization by an appropriate authority. The “what” of a mission statement is always a task (§ 2.4.2.3).","Tâche spécifiée (specified task)":"Specified task","Tâche confiée explicitement par l’échelon supérieur : en général au paragraphe 3 de l’ordre, parfois aux paragraphes 4 et 5, dans les annexes, les calques, ou oralement (§ 2.4.2.3).":"A task assigned specifically by the higher headquarters: usually in paragraph 3 of the order, sometimes in paragraphs 4 and 5, in annexes, on overlays, or verbally (§ 2.4.2.3).","Tâche implicite (implied task)":"Implied task","Tâche à exécuter pour accomplir une tâche spécifiée ou la mission, mais non énoncée dans l’ordre du supérieur. On la déduit de l’analyse du plan du supérieur, de l’ennemi, du terrain, des considérations civiles et des exigences doctrinales (§ 2.4.2.3).":"A task that must be performed to accomplish a specified task or the mission, but is not stated in the higher order. It is derived from analysis of the higher plan, the enemy, the terrain, civil considerations and doctrinal requirements (§ 2.4.2.3).","Tâche essentielle (essential task)":"Essential task","Tâche spécifiée ou implicite qui doit être exécutée pour réussir la mission. Elle figure toujours dans l’énoncé de mission de l’unité (§ 2.4.2.3).":"A specified or implied task that must be executed for mission success. It is always included in the unit’s mission statement (§ 2.4.2.3).","Mission sur ordre (on-order mission)":"On-order mission","Mission à exécuter à un moment futur non précisé, sur ordre. Une unité qui en est chargée est une force engagée : elle planifie, répartit ses moyens, s’articule et se positionne à l’avance (§ 2.4.2.3).":"A mission executed at an unspecified future time, when ordered. A unit with an on-order mission is a committed force: it plans, allocates resources, task-organizes and positions forces in advance (§ 2.4.2.3).","Mission « être en mesure de » (be-prepared mission)":"Be-prepared mission","Mission de circonstance, exécutée selon le résultat d’une action précédente. Elle est planifiée après toute mission sur ordre (§ 2.4.2.3).":"A contingency mission, executed depending on the result of a previous action. It is planned after any on-order mission (§ 2.4.2.3).","Contrainte (constraint)":"Constraint","Limitation imposée par un chef supérieur : ce que l’unité doit faire (une obligation). Elle restreint la liberté d’action (§ 2.4.2.4).":"A limitation imposed by a higher commander: something the command must do (an obligation). It restricts freedom of action (§ 2.4.2.4).","Restriction (restraint)":"Restraint","Limitation imposée par un chef supérieur : ce que l’unité ne doit pas faire (une interdiction). Elle restreint la liberté d’action (§ 2.4.2.4).":"A limitation imposed by a higher commander: something the command must not do (a prohibition). It restricts freedom of action (§ 2.4.2.4).","Fait (fact)":"Fact","Information tenue pour vraie à un moment donné ; base de la compréhension de la situation (§ 2.4.2.5).":"Information believed to be true at the time; the basis for situational understanding (§ 2.4.2.5).","Hypothèse (assumption)":"Assumption","Supposition sur la situation actuelle ou sur des événements futurs, admise sans preuve, nécessaire pour achever l’estimation et décider d’un mode d’action. Elle doit être remplacée par des faits dès que possible (§ 2.4.2.5).":"A supposition about the current situation or future events, accepted without proof, needed to complete the estimate and decide on a course of action. It should be replaced by facts as soon as possible (§ 2.4.2.5).","Risque (risk)":"Risk","Mesure dans laquelle des incertitudes et des événements possibles peuvent affecter les objectifs. Il se mesure par la probabilité de la menace, la vulnérabilité de la cible et l’impact. Il peut être réduit, ou accepté comme risque calculé (§ 2.4.2.6).":"The extent to which uncertainties and potential events may affect objectives. It is measured by the probability of the threat, the vulnerability of the asset and the impact. It can be reduced, or accepted as a calculated risk (§ 2.4.2.6).","Point critique (critical point)":"Critical point","Situation que l’unité ne peut pas résoudre avec ses propres moyens et qui rend la mission irréalisable : elle exige l’appui de l’échelon supérieur (§ 2.4.2.6).":"A situation the unit cannot solve with its own means and which makes the mission impractical: it requires support from the higher echelon (§ 2.4.2.6).","Opportunité (opportunity)":"Opportunity","Moment ou circonstance qui rend quelque chose possible ; elle ouvre des modes d’action et peut permettre d’atteindre l’objectif plus tôt ou plus facilement (§ 2.4.2.6).":"A time or circumstance that makes something possible; it opens courses of action and may allow the objective to be reached earlier or more easily (§ 2.4.2.6).","Critères GO / NO-GO":"GO / NO-GO criteria","NO-GO : conditions qui arrêtent la mission avant son début. GO : conditions pour déclencher une opération, ou une branche ou une suite planifiée (§ 2.4.2.7).":"NO-GO: conditions that stop the mission before it starts. GO: conditions to start an operation, or a planned branch or sequel (§ 2.4.2.7).","Abandon (abort) et caveat":"Abort and caveat","Abandon : arrêt d’une mission pour toute raison autre que l’action ennemie, entre son début et son achèvement. Caveat : limitation fixée par une nation à ses forces sous commandement OTAN (§ 2.4.2.7).":"Abort: terminating a mission for any reason other than enemy action, between its start and its completion. Caveat: a limitation set by a nation on its forces under NATO command (§ 2.4.2.7).","CCIR":"CCIR","Besoins en informations critiques du chef (commander’s critical information requirements) : lacunes d’information critiques pour le succès de la mission ou révélant une menace critique. Ils comprennent les PIR, les FFIR et les EEFI (§ 2.5.7).":"Commander’s critical information requirements: information gaps critical to mission success or revealing a critical threat. They include PIR, FFIR and EEFI (§ 2.5.7).","PIR, FFIR, EEFI":"PIR, FFIR, EEFI","PIR : besoins prioritaires en renseignement, tirés des CCIR. FFIR : informations sur nos forces et les forces en appui, gérées par le G3. EEFI : informations à protéger, et non à rechercher (§ 2.5.7).":"PIR: priority intelligence requirements, derived from the CCIR. FFIR: information about own and supporting forces, managed by the G3. EEFI: information to be protected, not collected (§ 2.5.7).","Énoncé de mission (mission statement)":"Mission statement","Phrase courte qui donne la tâche essentielle et le but, en cinq éléments : qui, quoi (tâche essentielle), quand, où, pourquoi (but) (§ 2.4.3).":"A short sentence giving the essential task and the purpose, in five elements: who, what (essential task), when, where, why (purpose) (§ 2.4.3).","Intention du chef (commander’s intent)":"Commander’s intent","Énoncé clair et concis de ce que la force doit faire et des conditions à remplir pour réussir, au regard de l’ennemi, du terrain et de l’état final recherché. Elle comprend en général le but, les tâches clés et l’objectif (§ 2.4.4).":"A clear, concise statement of what the force must do and the conditions it must meet to succeed with respect to the enemy, the terrain and the desired end state. It usually includes the purpose, key tasks and the objective (§ 2.4.4).","Critères d’évaluation (evaluation criteria)":"Evaluation criteria","Normes qui servent ensuite à mesurer l’efficacité et l’efficience relatives des modes d’action. Ils sont choisis dès l’analyse de l’ordre pour éviter les biais (§ 2.4.5).":"Standards used later to measure the relative effectiveness and efficiency of courses of action. They are chosen as early as order analysis to avoid bias (§ 2.4.5).","IPOE":"IPOE","Préparation du renseignement de l’environnement opérationnel : analyse systématique de l’adversaire, du terrain et de la météo dans une zone d’intérêt pour en déterminer les effets probables sur les opérations (§ 2.5.3).":"Intelligence preparation of the operational environment: systematic analysis of the adversary, terrain and weather in an area of interest to determine their likely effects on operations (§ 2.5.3).","Estimation permanente (running estimate)":"Running estimate","Évaluation tenue à jour par chaque cellule d’état-major : faits, hypothèses, conclusions et recommandations (§ 1.3.4 et 2.2.5).":"An assessment kept up to date by each staff section: facts, assumptions, conclusions and recommendations (§ 1.3.4 and 2.2.5).","Centre de gravité tactique (tactical COG)":"Tactical centre of gravity (COG)","Entité principale dotée des capacités critiques nécessaires pour atteindre un objectif ; en général un élément subordonné dont la neutralisation réduit fortement la capacité de l’ensemble. Il s’analyse en capacités, besoins et vulnérabilités critiques (§ 2.6.2).":"The primary entity possessing the critical capabilities needed to achieve an objective; usually a subordinate element whose neutralization significantly reduces the ability of the whole. It is analysed in critical capabilities, requirements and vulnerabilities (§ 2.6.2).","Mode d’action (COA)":"Course of action (COA)","Course of action : le « comment » de l’accomplissement de la mission. Les modes d’action amis sont comparés aux modes d’action adverses (ACOA) (§ 3.1).":"Course of action: the “how” of accomplishing the mission. Friendly courses of action are compared against adversary courses of action (ACOA) (§ 3.1).","Ordres de type mission (mission-type orders)":"Mission-type orders","Ordres qui donnent la mission sans prescrire la façon de l’exécuter ; ils mettent l’accent sur le but et restent aussi brefs que la situation le permet (§ 1.2.3).":"Orders that state the mission without prescribing how to execute it; they emphasize purpose and are as brief as the situation allows (§ 1.2.3).","Les équivalents français des termes OTAN (tâche implicite, restriction, estimation permanente…) sont des propositions de cet outil, pas une traduction officielle : en état-major multinational, utilise le terme anglais.":"The French equivalents of NATO terms used in the French version of this tool are the tool’s own proposals, not an official translation: in a multinational staff, use the English term.","Contrainte et restriction ne se confondent pas : la contrainte est une obligation (« doit faire »), la restriction une interdiction (« ne doit pas faire »).":"Constraint and restraint are different: a constraint is an obligation (“must do”), a restraint a prohibition (“must not do”).","Une hypothèse n’est pas un fait : elle doit être vérifiée et remplacée par un fait dès que possible, et rappelée avant toute décision.":"An assumption is not a fact: it must be checked and replaced by a fact as soon as possible, and restated before any decision.","Point critique et risque ne se confondent pas : le point critique dépasse nos moyens et appelle l’échelon supérieur.":"Critical point and risk are different: a critical point is beyond our means and calls for the higher echelon.","Entraîne-toi au modèle à trois colonnes (§ 2.6.2, tableau 2-2) : pour chaque facteur, hypothèse ou question, écris la déduction qui y répond, puis la conclusion (tâche, demande d’information, demande de précision au supérieur ou directive du chef).":"Practise the three-column model (§ 2.6.2, table 2-2): for each factor, assumption or question, write the deduction that answers it, then the conclusion (task, request for information, request for clarification to the superior, or commander’s guidance).","Facteur, hypothèse ou question":"Factor, assumption or question","Ex. : le pont X est le seul franchissement pour les véhicules lourds":"E.g.: bridge X is the only crossing for heavy vehicles","Ex. : sa perte bloquerait notre progression":"E.g.: losing it would block our advance","Conclusion":"Conclusion","Ex. : faire reconnaître et garder le pont X":"E.g.: have bridge X reconnoitred and secured","Type de conclusion":"Type of conclusion","Demande d’information (RFI)":"Request for information (RFI)","Demande de précision au supérieur":"Request for clarification to the superior","Directive du chef (dont contraintes et restrictions)":"Commander’s guidance (incl. constraints and restraints)","Une contrainte (constraint), c’est…":"A constraint is…","ce que l’unité doit faire, imposé par le chef supérieur":"something the unit must do, imposed by the higher commander","ce que l’unité ne doit pas faire, imposé par le chef supérieur":"something the unit must not do, imposed by the higher commander","une supposition admise sans preuve":"a supposition accepted without proof","une situation que l’unité ne peut pas résoudre seule":"a situation the unit cannot solve on its own","Contrainte = obligation ; restriction (restraint) = interdiction ; la supposition est une hypothèse ; la situation insoluble avec nos moyens est un point critique (§ 2.4.2.4 et 2.4.2.6).":"Constraint = obligation; restraint = prohibition; a supposition is an assumption; a situation we cannot solve with our means is a critical point (§ 2.4.2.4 and 2.4.2.6).","Une tâche implicite (implied task) est…":"An implied task is…","nécessaire à la mission mais non énoncée dans l’ordre du supérieur":"required for the mission but not stated in the higher order","confiée explicitement au paragraphe 3 de l’ordre du supérieur":"assigned explicitly in paragraph 3 of the higher order","exécutée au moment où le supérieur en donne l’ordre":"executed when the superior orders it","une tâche qui ne figure jamais dans l’énoncé de mission":"a task that never appears in the mission statement","Elle se déduit de l’analyse du plan du supérieur, de l’ennemi, du terrain, des considérations civiles et de la doctrine (§ 2.4.2.3).":"It is derived from analysis of the higher plan, the enemy, the terrain, civil considerations and doctrine (§ 2.4.2.3).","Une tâche essentielle (essential task)…":"An essential task…","figure toujours dans l’énoncé de mission de l’unité":"is always included in the unit’s mission statement","est toujours une tâche spécifiée":"is always a specified task","n’est connue qu’après la décision du chef":"is only known after the commander’s decision","est une mission « être en mesure de »":"is a be-prepared mission","Elle peut être spécifiée ou implicite ; elle doit être exécutée pour réussir et figure toujours dans l’énoncé de mission (§ 2.4.2.3).":"It may be specified or implied; it must be executed for success and is always in the mission statement (§ 2.4.2.3).","Que deviennent les hypothèses au fil de la planification ?":"What happens to assumptions as planning progresses?","Elles sont remplacées par des faits dès que possible et revérifiées avant les décisions":"They are replaced by facts as soon as possible and rechecked before decisions","Elles deviennent des contraintes une fois validées par le chef":"They become constraints once approved by the commander","Elles sont figées dès la réception de la mission":"They are frozen at receipt of mission","Elles ne concernent que l’ennemi":"They only concern the enemy","Les hypothèses clés sont listées et revérifiées avant les jugements et décisions (§ 2.4.2.5).":"Key assumptions are listed and rechecked before judgments and decisions (§ 2.4.2.5).","Un point critique (critical point) est…":"A critical point is…","une situation insoluble avec nos propres moyens, qui exige l’appui de l’échelon supérieur":"a situation we cannot solve with our own means, requiring support from the higher echelon","un lieu dont la possession donne un avantage marqué":"a place whose possession gives a marked advantage","le moment où le rapport de forces bascule":"the moment when the balance of forces shifts","un risque accepté par le chef":"a risk accepted by the commander","Il rend la mission irréalisable sans l’échelon supérieur (§ 2.4.2.6).":"It makes the mission impractical without the higher echelon (§ 2.4.2.6).","Que comprennent les CCIR selon APP-28 ?":"What do CCIR include according to APP-28?","PIR, FFIR et EEFI":"PIR, FFIR and EEFI","PIR et RFI seulement":"PIR and RFI only","Les seules informations à protéger":"Only information to be protected","Les critères GO / NO-GO":"GO / NO-GO criteria","Certaines nations ne rangent pas les EEFI parmi les CCIR (§ 2.5.7).":"Some nations do not treat EEFI as part of CCIR (§ 2.5.7).","Les EEFI sont…":"EEFI are…","des informations à protéger, et non à rechercher":"information to be protected, not collected","des informations sur nos forces, gérées par le G3":"information about our forces, managed by the G3","des besoins prioritaires en renseignement":"priority intelligence requirements","des demandes d’information au supérieur":"requests for information to the superior","Leur compromission compromettrait la mission ; l’adversaire est susceptible de les rechercher (§ 2.5.7).":"Their compromise would jeopardize the mission; the adversary is likely to seek them (§ 2.5.7).","Combien d’éléments comporte l’énoncé de mission ?":"How many elements does the mission statement have?","Cinq : qui, quoi, quand, où, pourquoi":"Five: who, what, when, where, why","Trois : tâche, but, délai":"Three: task, purpose, time","Quatre : qui, quoi, comment, pourquoi":"Four: who, what, how, why","Six : qui, quoi, comment, quand, où, pourquoi":"Six: who, what, how, when, where, why","Les six éléments (avec « comment ») décrivent le mode d’action simplifié du chapitre 5, pas l’énoncé de mission (§ 2.4.3 et 5.2.1).":"The six elements (with “how”) describe the simplified COA of chapter 5, not the mission statement (§ 2.4.3 and 5.2.1).","Pourquoi choisir les critères d’évaluation dès l’analyse de l’ordre ?":"Why choose evaluation criteria as early as order analysis?","Pour éviter les biais lors de la comparaison des modes d’action":"To avoid bias when comparing courses of action","Parce qu’ils figurent dans l’ordre du supérieur":"Because they are in the higher order","Pour pouvoir les communiquer aux subordonnés dans l’ordre d’avertissement":"So they can be passed to subordinates in the warning order","Parce qu’ils remplacent l’intention du chef":"Because they replace the commander’s intent","Ils mesurent ensuite l’efficacité et l’efficience relatives des COA (§ 2.4.5).":"They later measure the relative effectiveness and efficiency of COAs (§ 2.4.5).","Une restriction (restraint), c’est…":"A restraint is…","ce que l’unité ne doit pas faire":"something the unit must not do","ce que l’unité doit faire":"something the unit must do","une limitation qu’une nation impose à ses forces":"a limitation a nation places on its forces","une condition d’arrêt de la mission":"a condition for stopping the mission","La limitation nationale est un caveat ; la condition d’arrêt avant le début est un critère NO-GO (§ 2.4.2.4 et 2.4.2.7).":"A national limitation is a caveat; a condition for stopping before the start is a NO-GO criterion (§ 2.4.2.4 and 2.4.2.7).","Fondements de la planification tactique":"Fundamentals of tactical planning","Situer la planification tactique d’APP-28 dans le commandement par la mission, le processus des opérations et l’approche manœuvrière, et connaître les rôles du chef, du chef d’état-major et de l’état-major (chapitre 1).":"Place APP-28 tactical planning within mission command, the operations process and the manoeuvrist approach, and know the roles of the commander, the chief of staff and the staff (chapter 1).","Commandement par la mission (§ 1.1.2)":"Mission command (§ 1.1.2)","Intention du chef":"Commander’s intent","Initiative des subordonnés":"Subordinates’ initiative","Ordres de type mission":"Mission-type orders","Allocation adaptée des ressources":"Proper resource allocation","Exécution décentralisée par des ordres de type mission, centrée sur l’objectif de l’opération et non sur la manière.":"Decentralized execution through mission-type orders, focused on the objective of the operation rather than the method.","Processus des opérations (§ 1.1.3)":"Operations process (§ 1.1.3)","Quatre activités cycliques qui se chevauchent : planifier, préparer, exécuter, évaluer. La préparation commence en général avec un ordre d’avertissement (WNGO). La planification tactique s’harmonise avec celle de l’échelon supérieur.":"Four cyclical, overlapping activities: plan, prepare, execute, assess. Preparation usually starts with a warning order (WNGO). Tactical planning is harmonized with that of the higher echelon.","Approche manœuvrière (§ 1.1.4)":"Manoeuvrist approach (§ 1.1.4)","Approche indirecte qui vise la cohésion et la volonté de l’ennemi plutôt que ses seules forces physiques. Elle cherche à saisir, conserver et exploiter l’initiative, combine moyens létaux et non létaux, et donne sa pleine mesure avec le commandement par la mission.":"An indirect approach targeting the enemy’s cohesion and will rather than only its physical forces. It seeks to seize, retain and exploit the initiative, combines lethal and non-lethal means, and is most effective with mission command.","Plans et ordres (§ 1.2)":"Plans and orders (§ 1.2)","Trois horizons de planification (court, moyen, long terme), relatifs à chaque niveau":"Three planning horizons (short, mid, long term), relative to each level","Des ordres d’avertissement fréquents permettent la planification parallèle avec les subordonnés":"Frequent warning orders enable parallel planning with subordinates","Un plan est un cadre d’adaptation, pas un script : la planification se poursuit pendant la préparation et l’exécution":"A plan is a framework for adaptation, not a script: planning continues during preparation and execution","L’OPLAN est mis en exécution par l’OPORD ; le FRAGO sert quand la planification est brève":"The OPLAN is directed for execution through the OPORD; the FRAGO is used when planning is brief","Ordres de type mission : format OTAN en cinq paragraphes ; les tâches des subordonnés disent qui, quoi, quand, où et pourquoi, en insistant sur le but":"Mission-type orders: NATO five-paragraph format; subordinate tasks state who, what, when, where and why, with emphasis on purpose","Structure : 3 phases, 7 étapes (§ 1.3.1 et 2.1)":"Structure: 3 phases, 7 steps (§ 1.3.1 and 2.1)","Phase 1 – Comprendre la situation et le problème : étape 1 Réception de la mission ; étape 2 Analyse de la mission (2A Analyse de l’ordre, 2B Évaluation des facteurs)":"Phase 1 – Understanding the situation and problem: step 1 Receipt of mission; step 2 Mission analysis (2A Order analysis, 2B Evaluation of factors)","Phase 2 – Concevoir et développer les modes d’action : étape 3 Développement des COA ; étape 4 Analyse des COA ; étape 5 Comparaison des COA":"Phase 2 – Consider and develop courses of action: step 3 COA development; step 4 COA analysis; step 5 COA comparison","Phase 3 – Communiquer : étape 6 Décision du chef ; étape 7 Production, diffusion des ordres et transition":"Phase 3 – Communication: step 6 Commander’s decision; step 7 Orders production, dissemination and transition","Les étapes se déroulent en général dans l’ordre mais peuvent être reprises. Les estimations permanentes et l’IPOE se poursuivent tout au long.":"Steps are usually sequential but may be revisited. Running estimates and IPOE continue throughout.","Les sept fonctions de combat (§ 1.3.1)":"The seven combat functions (§ 1.3.1)","Feux":"Fires","Protection":"Protection","Activités d’information":"Information activities","Rôles (§ 1.3.2 à 1.3.4)":"Roles (§ 1.3.2 to 1.3.4)","Le chef conduit la planification : intention initiale, directives de planification, décisions clés. Il comprend, visualise et décrit l’opération":"The commander drives planning: initial intent, planning guidance, key decisions. The commander understands, visualizes and describes the operation","Le chef d’état-major (COS) est le principal assistant du chef : il dirige, coordonne et fixe les horaires et lieux des briefings":"The chief of staff (COS) is the commander’s principal assistant: supervises, coordinates and sets timelines, briefing times and locations","L’état-major aide le chef à comprendre, décider et traduire ses décisions en plans et en ordres ; il tient les estimations permanentes":"The staff helps the commander understand, decide and translate decisions into plans and orders; it maintains running estimates","Adapter la planification (§ 1.3.5)":"Modifying tactical planning (§ 1.3.5)","La profondeur de la planification dépend du temps, des ressources, de l’expérience et de la situation. La planification complète est la norme pour une nouvelle mission. En temps contraint, le chef ne fait conduire que ce qui sert ses décisions ; en situation extrêmement comprimée, on recourt à la décision intuitive (chapitre 5 et annexe F).":"Planning depth depends on time, resources, experience and the situation. Full planning is the norm for a new mission. Under time constraints, the commander directs only the activities that support their decisions; in extremely compressed situations, intuitive decision-making is used (chapter 5 and annex F).","Briefings : échanges entre le chef et l’état-major. Ordres d’avertissement : échanges avec les subordonnés. Back briefs : échanges avec l’échelon supérieur (§ 2.1).":"Briefings: exchanges between commander and staff. Warning orders: exchanges with subordinates. Back-briefs: exchanges with the higher echelon (§ 2.1).","Ne pas confondre les sept fonctions de combat d’APP-28 avec les fonctions opérationnelles françaises.":"Do not confuse APP-28’s seven combat functions with the French operational functions.","Quels sont les quatre éléments du commandement par la mission selon APP-28 ?":"What are the four elements of mission command according to APP-28?","Intention du chef, initiative des subordonnés, ordres de type mission, allocation adaptée des ressources":"Commander’s intent, subordinates’ initiative, mission-type orders, proper resource allocation","Mission, intention, idée de manœuvre, ordres":"Mission, intent, concept of manoeuvre, orders","Planifier, préparer, exécuter, évaluer":"Plan, prepare, execute, assess","Commandement, renseignement, manœuvre, soutien":"Command, intelligence, manoeuvre, sustainment","Planifier, préparer, exécuter, évaluer : ce sont les activités du processus des opérations (§ 1.1.2 et 1.1.3).":"Plan, prepare, execute, assess: these are the activities of the operations process (§ 1.1.2 and 1.1.3).","Les quatre activités du processus des opérations sont…":"The four activities of the operations process are…","planifier, préparer, exécuter, évaluer":"plan, prepare, execute, assess","comprendre, visualiser, décrire, diriger":"understand, visualize, describe, direct","analyser, concevoir, décider, ordonner":"analyse, design, decide, order","réception, analyse, développement, décision":"receipt, analysis, development, decision","Elles sont cycliques et se chevauchent (§ 1.1.3).":"They are cyclical and overlapping (§ 1.1.3).","Combien de phases et d’étapes compte la planification tactique d’APP-28 ?":"How many phases and steps does APP-28 tactical planning have?","3 phases et 7 étapes":"3 phases and 7 steps","2 phases et 11 étapes":"2 phases and 11 steps","4 phases et 6 étapes":"4 phases and 6 steps","3 phases et 5 étapes":"3 phases and 5 steps","Phase 1 : étapes 1 et 2 ; phase 2 : étapes 3 à 5 ; phase 3 : étapes 6 et 7 (§ 2.1).":"Phase 1: steps 1 and 2; phase 2: steps 3 to 5; phase 3: steps 6 and 7 (§ 2.1).","Quelles sont les sept fonctions de combat d’APP-28 ?":"What are APP-28’s seven combat functions?","Commandement, renseignement, feux, manœuvre, protection, activités d’information, soutien":"Command, intelligence, fires, manoeuvre, protection, information activities, sustainment","Contact, renseignement, appui, soutien, commandement, protection, influence":"Contact, intelligence, support, sustainment, command, protection, influence","Manœuvre, feux, génie, logistique, santé, transmissions, renseignement":"Manoeuvre, fires, engineering, logistics, medical, signals, intelligence","Commandement, contact, appui à l’engagement, soutien, renseignement, feux, champs immatériels":"Command, contact, combat support, sustainment, intelligence, fires, non-physical fields","L’approche manœuvrière vise avant tout…":"The manoeuvrist approach primarily targets…","la cohésion et la volonté de l’ennemi":"the enemy’s cohesion and will","la destruction physique de toutes les forces ennemies":"the physical destruction of all enemy forces","la conquête du terrain clé":"the seizure of key terrain","l’usure de l’ennemi par les feux":"the attrition of the enemy by fires","Approche indirecte, qui combine moyens létaux et non létaux (§ 1.1.4).":"An indirect approach combining lethal and non-lethal means (§ 1.1.4).","Qui fixe les horaires de planification et les horaires et lieux des briefings ?":"Who sets planning timelines and briefing times and locations?","Le chef d’état-major (COS)":"The chief of staff (COS)","Le chef":"The commander","Le G3":"The G3","L’officier de liaison":"The liaison officer","Le COS dirige, coordonne et fixe les horaires (§ 1.3.3).":"The COS supervises, coordinates and sets timelines (§ 1.3.3).","Avec qui l’unité échange-t-elle par back brief ?":"With whom does the unit exchange through a back-brief?","L’échelon supérieur":"The higher echelon","Les subordonnés":"Subordinates","L’état-major interne":"Its own staff","Les unités voisines uniquement":"Adjacent units only","Briefings : chef et état-major ; WNGO : subordonnés ; back briefs : supérieur (§ 2.1).":"Briefings: commander and staff; WNGO: subordinates; back-briefs: superior (§ 2.1).","Selon APP-28, un plan est…":"According to APP-28, a plan is…","un cadre d’adaptation, pas un script":"a framework for adaptation, not a script","un document figé une fois signé":"a document frozen once signed","un script à exécuter tel quel":"a script to be executed as is","un document réservé au niveau opératif":"a document reserved for the operational level","La planification continue pendant la préparation et l’exécution ; l’ordre peut être entièrement remplacé (§ 1.2.2).":"Planning continues during preparation and execution; the order may be replaced entirely (§ 1.2.2).","En situation extrêmement comprimée dans le temps, APP-28 prévoit…":"In an extremely time-compressed situation, APP-28 provides for…","la décision intuitive":"intuitive decision-making","la suppression de l’intention du chef":"dropping the commander’s intent","l’emploi systématique du wargaming informatisé":"systematic computer-based wargaming","le report de la mission":"postponing the mission","§ 1.3.5, chapitre 5 et annexe F.":"§ 1.3.5, chapter 5 and annex F.","Phase 1 – Comprendre la situation et le problème":"Phase 1 – Understanding the situation and problem","Étape 1 – Réception de la mission":"Step 1 – Receipt of mission","Alerter, se préparer":"Alert, prepare","Alerter l’état-major et les subordonnés, et préparer l’analyse de la mission (§ 2.2). L’étape commence à la réception d’une nouvelle mission ou à un changement de situation, éventuellement dès un ordre d’avertissement, avant l’OPORD complet.":"Alert the staff and subordinates, and prepare for mission analysis (§ 2.2). The step begins on receipt of a new mission or a change in the situation, possibly from a warning order, before the complete OPORD.","Activités dans l’ordre (§ 2.2.2 à 2.2.10)":"Activities in order (§ 2.2.2 to 2.2.10)","Alerter l’état-major et les acteurs clés (selon les SOP ; organisations militaires, civiles et du pays hôte si besoin)":"Alert the staff and key participants (per SOPs; military, civilian and host-nation organizations if required)","Se préparer à planifier : réunir les estimations permanentes, les produits de renseignement du supérieur, les ordres, cartes et calques, les SOP et la doctrine (AAP-06, AAP-15, AAP-39, APP-6, ATP-3.2.1)":"Prepare for planning: gather running estimates, higher intelligence products, orders, maps and overlays, SOPs and doctrine (AAP-06, AAP-15, AAP-39, APP-6, ATP-3.2.1)","Lancer l’IPOE : évaluation de la zone (terrain, météo) et des acteurs (organisation, doctrine, vulnérabilités de l’adversaire)":"Initiate IPOE: area evaluation (terrain, weather) and actor evaluation (adversary organization, doctrine, vulnerabilities)","Mettre à jour les estimations permanentes : faits, hypothèses, ennemi, terrain et météo, troupes et appuis, temps, considérations civiles ; conclusions et recommandations":"Update running estimates: facts, assumptions, enemy, terrain and weather, troops and support, time, civil considerations; conclusions and recommendations","Estimer la chronologie de la mission":"Estimate mission timelines","Estimer la chronologie de planification de l’état-major":"Estimate staff planning timelines","Briefing de réception de la mission":"Receipt of mission brief","Directives initiales de planification du chef":"Commander’s initial planning guidance","Ordre d’avertissement initial":"Initial warning order","Chronologie de la mission (§ 2.2.6)":"Mission timelines (§ 2.2.6)","Lister toutes les actions nécessaires à rebours depuis le point final et leur affecter des durées ; si l’heure H est donnée, partir d’elle. Prendre en compte la durée de la mission, l’environnement (saison, jour et nuit, phases de la lune), les dates critiques et les restrictions.":"List all required actions in reverse order from the end point and assign time periods; if H-hour is given, work backward from it. Consider mission duration, environmental conditions (season, day and night, moon phases), critical dates and restraints.","Règle du tiers / deux tiers (§ 2.2.7)":"One-third / two-thirds rule (§ 2.2.7)","En règle générale, le chef garde un tiers du temps disponible pour sa propre planification et laisse les deux tiers à ses subordonnés. Le temps est le facteur principal du niveau de détail. Le COS établit la chronologie de planification de l’état-major : temps de chaque étape, échéances des produits, responsables et destinataires.":"As a rule, the commander uses one-third of the available time for their own planning and gives two-thirds to subordinates. Time is the main factor in planning detail. The COS develops the staff planning timeline: time for each step, product due dates, responsibilities and recipients.","Directives initiales de planification (§ 2.2.9)":"Initial planning guidance (§ 2.2.9)","Approuver la chronologie de la mission et de la planification":"Approve mission and planning timelines","Méthodes pour abréger la planification, si besoin":"Methods to abbreviate planning, if required","Coordinations nécessaires, dont l’échange d’officiers de liaison":"Necessary coordination, including exchange of liaison officers","Besoins en information":"Information requirements","Mouvements autorisés et lancement de la recherche du renseignement":"Authorized movements and initiation of intelligence collection","Tâches supplémentaires de l’état-major":"Additional staff tasks","Ordre d’avertissement initial (§ 2.2.10)":"Initial warning order (§ 2.2.10)","Dernière activité de l’étape 1, au format de l’ATP-3.2.2 (annexe G, appendice 1). Contenu minimal : type d’opération, localisation générale, chronologie initiale, mouvements ou recherche du renseignement à lancer.":"Last activity of step 1, in the ATP-3.2.2 format (annex G, appendix 1). Minimum content: type of operation, general location, initial timeline, movements or intelligence collection to begin.","Intention du chef de niveau N+2":"Intent of the commander two levels up (N+2)","Mission, intention et concept d’opération du niveau N+1":"Mission, intent and concept of operations one level up (N+1)","Rôle de notre unité dans le plan d’ensemble":"Role of our unit in the overall plan","Missions des unités voisines et leur place dans le plan du supérieur":"Missions of adjacent units and their place in the higher plan","Premiers résultats de l’IPOE et acteurs pertinents identifiés":"Initial IPOE results and relevant actors identified","Zone d’opérations, zone d’intérêt et zone de responsabilité du renseignement":"Area of operations, area of interest and area of intelligence responsibility","Situation de nos forces":"Situation of own forces","Chronologie de la mission":"Mission timelines","Chronologie estimée de la planification de l’état-major":"Estimated staff planning timelines","Le briefing de réception de la mission est court : il ne présente que les changements récents et pertinents, pas les estimations complètes ni l’IPOE (§ 2.2.8).":"The receipt of mission brief is short: it covers only recent and relevant changes, not full estimates or IPOE (§ 2.2.8).","L’échelon supérieur doit fournir ses produits d’IPOE aux subordonnés au plus tard à la fin de l’étape 2 (§ 2.2.4).":"The higher echelon should provide its IPOE products to subordinates no later than the end of step 2 (§ 2.2.4).","Le canevas ci-dessus provient de la liste du § 2.2.8 ; pour la rubrique « zones », la copie consultée est peu lisible : à revérifier sur l’exemplaire officiel.":"The checklist above comes from the list in § 2.2.8; for the “areas” item, the copy consulted is hard to read: to be rechecked against the official copy.","Commence par le calculateur : il applique la règle du tiers / deux tiers au temps disponible. Note ensuite les jalons de la mission à rebours depuis le point final, puis les directives initiales du chef et le contenu de ton premier ordre d’avertissement.":"Start with the calculator: it applies the one-third / two-thirds rule to the available time. Then note the mission milestones backward from the end point, the commander’s initial guidance and the content of your first warning order.","Documents réunis (ordres du supérieur, calques, produits de renseignement, SOP)":"Documents gathered (higher orders, overlays, intelligence products, SOPs)","Chronologies approuvées, méthodes d’abrègement, coordinations et LO, besoins en information, mouvements et recherche autorisés, tâches de l’état-major (§ 2.2.9).":"Approved timelines, abbreviation methods, coordination and LOs, information requirements, authorized movements and collection, staff tasks (§ 2.2.9).","Minimum : type d’opération, localisation générale, chronologie initiale, mouvements ou recherche à lancer (§ 2.2.10).":"Minimum: type of operation, general location, initial timeline, movements or collection to begin (§ 2.2.10).","Quel est le but de l’étape 1 ?":"What is the purpose of step 1?","Alerter l’état-major et les subordonnés, et préparer l’analyse de la mission":"Alert the staff and subordinates, and prepare for mission analysis","Rédiger l’énoncé de mission":"Draft the mission statement","Choisir le mode d’action":"Choose the course of action","Produire l’ordre d’opération":"Produce the operation order","Quelle part du temps disponible le chef garde-t-il, en règle générale, pour sa propre planification ?":"As a rule, what share of the available time does the commander keep for their own planning?","Un tiers":"One-third","La moitié":"Half","Deux tiers":"Two-thirds","Un quart":"One-quarter","Il laisse les deux tiers aux subordonnés (§ 2.2.7).":"Two-thirds are left to subordinates (§ 2.2.7).","Comment établit-on la chronologie de la mission ?":"How are mission timelines established?","À rebours depuis le point final (ou depuis l’heure H si elle est donnée)":"Backward from the end point (or from H-hour if given)","Depuis la réception de l’ordre, dans l’ordre chronologique":"From receipt of the order, in chronological order","À partir de la seule durée de la planification":"From the planning duration alone","En copiant celle de l’échelon supérieur":"By copying those of the higher echelon","Quelle est la dernière activité de l’étape 1 ?":"What is the last activity of step 1?","L’ordre d’avertissement initial":"The initial warning order","Le briefing de réception de la mission":"The receipt of mission brief","Les directives initiales de planification":"The initial planning guidance","L’analyse de l’ordre":"Order analysis","Contenu minimal de l’ordre d’avertissement initial ?":"Minimum content of the initial warning order?","Type d’opération, localisation générale, chronologie initiale, mouvements ou recherche à lancer":"Type of operation, general location, initial timeline, movements or collection to begin","Énoncé de mission, intention, concept d’opération":"Mission statement, intent, concept of operations","Tâches aux subordonnés et calque d’opération":"Tasks to subordinates and operation overlay","Les seuls CCIR":"The CCIR only","Le briefing de réception de la mission présente…":"The receipt of mission brief presents…","seulement les changements récents et pertinents":"only recent and relevant changes","les estimations permanentes complètes":"the full running estimates","l’IPOE complète":"the complete IPOE","les modes d’action envisagés":"the courses of action under consideration","Il sert à repérer l’information manquante et les besoins en information (§ 2.2.8).":"It helps identify missing information and information requirements (§ 2.2.8).","Qui établit la chronologie de planification de l’état-major ?":"Who develops the staff planning timeline?","Le chef d’état-major":"The chief of staff","Le G2":"The G2","Chaque cellule pour elle-même":"Each section for itself","Au plus tard quand l’échelon supérieur fournit-il ses produits d’IPOE aux subordonnés ?":"No later than when does the higher echelon provide its IPOE products to subordinates?","À la fin de l’étape 2":"At the end of step 2","À la fin de l’étape 1":"At the end of step 1","À la fin de l’étape 5":"At the end of step 5","Avec l’ordre d’opération":"With the operation order","Quand commence l’étape 1 ?":"When does step 1 begin?","À la réception d’une nouvelle mission ou à un changement de situation":"On receipt of a new mission or a change in the situation","Seulement à la réception de l’OPORD complet":"Only on receipt of the complete OPORD","Après le back brief initial":"After the initial back-brief","À la décision du chef":"At the commander’s decision","Elle peut commencer dès un ordre d’avertissement (§ 2.2.1).":"It may start from a warning order (§ 2.2.1).","Étape 2A – Analyse de l’ordre":"Step 2A – Order analysis","Quoi ? Pourquoi ?":"What? Why?","Comprendre la mission reçue : ce qui doit être accompli, quand, où et surtout pourquoi (§ 2.4). L’analyse de la mission se définit (AAP-39) comme le processus logique qui extrait et déduit des ordres du supérieur les tâches nécessaires à la mission ; son produit est un énoncé de mission clair et concis.":"Understand the assigned mission: what must be accomplished, when, where and, above all, why (§ 2.4). Mission analysis is defined (AAP-39) as a logical process for extracting and deducing from a superior’s orders the tasks needed to fulfil a mission; its output is a clear, concise mission statement.","Activités (§ 2.4.1)":"Activities (§ 2.4.1)","Analyser l’ordre du chef de niveau N+1":"Analyse the order of the commander one level up (N+1)","Rédiger l’énoncé de mission reformulé":"Develop the restated mission statement","Formuler l’intention initiale du chef":"Formulate the commander’s initial intent","Donner des directives de planification complémentaires":"Develop additional planning guidance","Faire le briefing à l’état-major":"Brief the staff","L’état-major commence l’évaluation des facteurs (2B) en parallèle.":"The staff starts the evaluation of factors (2B) in parallel.","Ce qu’on analyse dans l’ordre du supérieur (§ 2.4.2)":"What is analysed in the higher order (§ 2.4.2)","Intention du chef de niveau N+2 ; mission, intention et concept du niveau N+1":"Intent two levels up (N+2); mission, intent and concept one level up (N+1)","Rôle de l’unité dans le plan d’ensemble ; missions des voisins":"The unit’s role in the overall plan; adjacent units’ missions","Tâches spécifiées, implicites et essentielles":"Specified, implied and essential tasks","Contraintes et restrictions":"Constraints and restraints","Faits et hypothèses critiques":"Critical facts and assumptions","Risques, opportunités et points critiques":"Risks, opportunities and critical points","Comment la situation pourrait évoluer":"How the situation might change","Critères GO / NO-GO et d’abandon":"GO / NO-GO and abort criteria","CCIR, EEFI, autres demandes d’information et de précision":"CCIR, EEFI, other requests for information and clarification","Énoncé de mission (§ 2.4.3)":"Mission statement (§ 2.4.3)","Qui exécute":"Who executes","Tâche essentielle (quoi)":"Essential task (what)","Quand (heure, événement ou durée)":"When (time, event or duration)","Où (zone, objectif, coordonnées)":"Where (area, objective, coordinates)","Pourquoi (but)":"Why (purpose)","Intention initiale du chef (§ 2.4.4)":"Commander’s initial intent (§ 2.4.4)","Facile à retenir et comprise deux niveaux en dessous. Elle comprend en général le but, les tâches clés et l’objectif (état final). Trois buts : orienter l’état-major ; permettre aux subordonnés d’atteindre l’objectif sans nouvel ordre, même si le plan change ; les guider pour exploiter des opportunités fugaces.":"Easy to remember and understood two levels down. It usually includes the purpose, key tasks and the objective (end state). Three goals: focus the staff; enable subordinates to achieve the objective without further orders, even if the plan changes; guide them to exploit fleeting opportunities.","Directives complémentaires et critères d’évaluation (§ 2.4.5)":"Additional guidance and evaluation criteria (§ 2.4.5)","Le chef livre l’essentiel de sa vision et peut préciser les modes d’action à étudier ou à écarter. Il fixe les critères d’évaluation dès ce moment, pour éviter les biais. Le COS les pondère d’abord selon leur importance relative et les directives du chef, qui peut les ajuster. Le tableau 2-1 donne des exemples de directives par fonction de combat (ni exhaustifs ni obligatoires).":"The commander conveys the essence of their visualization and may specify courses of action to examine or not to accept. Evaluation criteria are set at this point, to avoid bias. The COS initially weights them by relative importance and the commander’s guidance; the commander may adjust them. Table 2-1 gives examples of guidance by combat function (neither complete nor mandatory).","Mission, intention et concept du niveau N+1":"Mission, intent and concept one level up (N+1)","Rôle de l’unité dans le plan d’ensemble":"The unit’s role in the overall plan","Missions des unités voisines":"Adjacent units’
